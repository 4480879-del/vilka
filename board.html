  isRacePinned(raceId) {
    if (!this.currentRider) return false;
    let pinned = this.currentRider.pinned_chats || [];
    if (typeof pinned === 'string') {
      try { pinned = JSON.parse(pinned); } catch(e) { pinned = []; }
    }
    if (!Array.isArray(pinned)) return false;

    const chat = this.chatsByRaceId[raceId];
    const chatId = chat?.id;
    return pinned.includes(raceId) || Boolean(chatId && pinned.includes(chatId));
  }

  async togglePinRace(raceId, event) {
    if (event) {
      event.stopPropagation();
      event.preventDefault();
    }

    if (this.isGuest || !this.currentRider || this.currentRider.id === 'anonymous_guest') {
      this.openLoginModal();
      return;
    }

    let pinned = this.currentRider.pinned_chats || [];
    if (typeof pinned === 'string') {
      try { pinned = JSON.parse(pinned); } catch(e) { pinned = []; }
    }
    if (!Array.isArray(pinned)) pinned = [];

    const chat = this.chatsByRaceId[raceId];
    const chatId = chat?.id;

    const pinObj = this.allPins.find(p => p.race?.id === raceId);
    const sisterIds = (pinObj?.sisters || []).map(s => s.id);
    const targetIds = new Set([raceId, chatId, ...sisterIds].filter(Boolean));

    const alreadyPinned = Array.from(targetIds).some(id => pinned.includes(id));

    if (alreadyPinned) {
      pinned = pinned.filter(id => !targetIds.has(id));
      this.showToast('Убрано из ваших пинов');
    } else {
      targetIds.forEach(id => {
        if (!pinned.includes(id)) pinned.push(id);
      });
      this.showToast('Добавлено в ваши пины');
    }

    this.currentRider.pinned_chats = pinned;

    try {
      localStorage.setItem('vilka_cached_rider', JSON.stringify(this.currentRider));
      if (window.location.hostname.endsWith('sotka.one')) {
        document.cookie = `pb_rider=${encodeURIComponent(JSON.stringify(this.currentRider))}; path=/; domain=sotka.one; max-age=31536000; SameSite=Lax; Secure`;
      }
    } catch(e) {}

    this.buildPinsStream();
    this.renderGrid();

    try {
      await this.pb.collection('riders').update(this.currentRider.id, { pinned_chats: pinned }, { requestKey: null });
    } catch(err) {
      console.error('Ошибка сохранения пина в БД:', err);
    }
  }

  async initAuth() {
    const authCookieMatch = document.cookie.match(/(?:^|;\s*)pb_auth=([^;]+)/);
    const hasAuthCookie = Boolean(authCookieMatch && authCookieMatch[1] && authCookieMatch[1].trim() !== '');

    if (!hasAuthCookie) {
      this.pb.authStore.clear();
      localStorage.removeItem('pocketbase_auth');
      localStorage.removeItem('vilka_cached_rider');
      this.currentRider = null;
      this.isGuest = true;
      this.renderHeaderIdentity();
      return;
    }

    try {
      this.pb.authStore.loadFromCookie(document.cookie, 'pb_auth');
    } catch (e) {}

    if (!this.pb.authStore.isValid || !this.pb.authStore.token) {
      this.pb.authStore.clear();
      localStorage.removeItem('pocketbase_auth');
      localStorage.removeItem('vilka_cached_rider');
      this.currentRider = null;
      this.isGuest = true;
      this.renderHeaderIdentity();
      return;
    }

    try {
      await this.pb.collection('users').authRefresh({ requestKey: null });
      const authModel = this.pb.authStore.model || this.pb.authStore.record;
      if (authModel) {
        this.isGuest = false;
        this.userRoles = Array.isArray(authModel.role) ? authModel.role : (authModel.role ? [authModel.role] : []);
        const freshRider = await this.pb.collection('riders').getFirstListItem(
          `user_id="${authModel.id}" || email="${authModel.email}"`,
          { requestKey: null }
        );
        if (freshRider) {
          this.currentRider = freshRider;
          localStorage.setItem('vilka_cached_rider', JSON.stringify(freshRider));
        }
      }
    } catch (err) {
      this.pb.authStore.clear();
      localStorage.removeItem('pocketbase_auth');
      localStorage.removeItem('vilka_cached_rider');
      this.currentRider = null;
      this.isGuest = true;
    }

    this.renderHeaderIdentity();
  }

  renderHeaderIdentity() {
    const avEl = document.getElementById('hubUserAv');
    if (!avEl) return;

    if (!this.isGuest && this.currentRider) {
      if (this.currentRider.avatar) {
        const avFile = Array.isArray(this.currentRider.avatar) ? this.currentRider.avatar[0] : this.currentRider.avatar;
        avEl.innerHTML = `<img src="https://vilka.sotka.one/api/files/riders/${this.currentRider.id}/${avFile}" alt="AV">`;
      } else {
        avEl.innerText = ((this.currentRider.first_name?.[0] || 'A') + (this.currentRider.last_name?.[0] || '')).toUpperCase();
      }
    } else {
      avEl.innerHTML = `<img src="${DUCK_SVG_URL}" style="width:20px; height:20px; object-fit:contain;" alt="Guest">`;
    }
  }

  async loadEcosystem() {
    try {
      const [racesRes, rostersRes, teamsRes, postersRes, chatsRes, pelotonsRes] = await Promise.all([
        this.pb.collection('races').getFullList({ sort: 'date', requestKey: null }).catch(() => []),
        this.pb.collection('race_rosters').getFullList({ filter: 'status != "canceled"', fields: 'id,race_id,rider_id,bib,planned_start,is_paid,status,final_cluster', requestKey: null }).catch(() => []),
        this.pb.collection('teams').getFullList({ sort: '-points', requestKey: null }).catch(() => []),
        this.pb.collection('messages').getList(1, 50, { filter: 'is_announcement = true', sort: '-created', expand: 'chat_id', requestKey: null }).catch(() => ({ items: [] })),
        this.pb.collection('chats').getFullList({ filter: 'type = "global" || type = "team_channel"', fields: 'id,collectionId,name,type,race_id,team_id,panel_image,slug,panel_data', sort: '-updated', requestKey: null }).catch(() => []),
        this.pb.collection('pelotons').getFullList({ filter: 'is_private = false', sort: 'name', requestKey: null }).catch(() => [])
      ]);

      this.races = racesRes || [];
      this.racesById = {};
      this.races.forEach(r => { this.racesById[r.id] = r; });

      this.rosters = rostersRes || [];
      this.pelotonsList = pelotonsRes || [];
      this.chatsList = chatsRes || [];
      this.announcements = postersRes.items || [];

      const notifBadge = document.getElementById('railNotifBadge');
      if (notifBadge && this.announcements.length > 0) {
        notifBadge.innerText = Math.min(9, this.announcements.length);
        notifBadge.style.display = 'flex';
      }

      (teamsRes || []).forEach(t => { this.teamsMap[t.id] = t; });

      this.rosterCounts = {};
      this.myRostersMap = {};
      this.rosters.forEach(r => {
        if (r.race_id) {
          this.rosterCounts[r.race_id] = (this.rosterCounts[r.race_id] || 0) + 1;
          if (this.currentRider && r.rider_id === this.currentRider.id) {
            this.myRostersMap[r.race_id] = r;
          }
        }
      });

      this.chatsById = {};
      this.chatsByRaceId = {};
      (chatsRes || []).forEach(c => {
        this.chatsById[c.id] = c;
        if (c.race_id) this.chatsByRaceId[c.race_id] = c;
      });

      (postersRes.items || []).forEach(m => {
        if (m.file && m.chat_id && !this.postersMap[m.chat_id]) {
          this.postersMap[m.chat_id] = m;
        }
      });

      if (!this.isGuest && this.pb.authStore.model?.id) {
        try {
          const wallet = await this.pb.collection('draft_wallets').getFirstListItem(`user_id="${this.pb.authStore.model.id}"`, { requestKey: null });
          if (wallet?.balances) {
            this.walletBalance = Object.values(wallet.balances).reduce((a, b) => a + Number(b || 0), 0);
          }
        } catch(e) {}
      }

      this.buildPinsStream();
      this.renderGrid();
    } catch (err) {
      console.error("Ошибка синхронизации с PocketBase:", err);
    }
  }

  buildCardElevationSvg(points, isPhotoOverlay = false) {
    if (!Array.isArray(points) || points.length < 3) return '';

    const eles = points.map(p => Number(p.ele) || 0);
    const minE = Math.min(...eles);
    const maxE = Math.max(...eles);
    const span = Math.max(1, maxE - minE);
    const w = 300, h = 42;

    const coords = points.map((p, i) => {
      const x = ((i / (points.length - 1)) * w).toFixed(1);
      const y = (h - 4 - (((Number(p.ele) - minE) / span) * (h - 10))).toFixed(1);
      return `${x},${y}`;
    });

    const polyline = `M${coords.join(' L')}`;
    const area = `${polyline} L${w},${h} L0,${h} Z`;

    const strokeColor = isPhotoOverlay ? '#ffc107' : '#111111';
    const fillColor = isPhotoOverlay ? 'rgba(255, 193, 7, 0.28)' : 'rgba(0, 0, 0, 0.14)';

    return `
      <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:38px; display:block;" preserveAspectRatio="none">
        <path d="${area}" fill="${fillColor}" />
        <path d="${polyline}" fill="none" stroke="${strokeColor}" stroke-width="2" stroke-linecap="round" />
      </svg>
    `;
  }

  buildPinsStream() {
    const nowStartOfDay = new Date();
    nowStartOfDay.setHours(0, 0, 0, 0);
    const nowMs = nowStartOfDay.getTime();

    const groupedEventsMap = new Map();
    this.races.forEach(r => {
      if (this.selectedPelotonId !== 'all') {
        const pId = Array.isArray(r.peloton_id) ? r.peloton_id[0] : r.peloton_id;
        if (pId !== this.selectedPelotonId) return;
      }

      if (this.selectedSeasonYear !== 'all' && r.date) {
        const rYear = new Date(r.date).getFullYear();
        if (rYear !== Number(this.selectedSeasonYear)) return;
      }

      const baseName = r.name && r.name.includes('[') ? r.name.split('[')[0].trim() : (r.name || 'Гонка').trim();
      const dayStr = r.date ? String(r.date).slice(0, 10) : 'nodate';
      const key = `${dayStr}_${baseName.toLowerCase()}`;

      if (!groupedEventsMap.has(key)) {
        groupedEventsMap.set(key, {
          baseName,
          dayStr,
          dateMs: new Date(r.date || 0).getTime() || 0,
          primaryRace: r,
          sisters: [r]
        });
      } else {
        groupedEventsMap.get(key).sisters.push(r);
      }
    });

    const upcomingRacePins = [];
    const myTicketPins = [];
    const archiveRacePins = [];

    const isImgFile = (name) => typeof name === 'string' && /\.(jpe?g|png|webp|gif|svg)$/i.test(name.trim());

    groupedEventsMap.forEach((group) => {
      const r = group.primaryRace;
      const sisters = group.sisters;
      sisters.sort((a, b) => (parseFloat(b.distance) || 0) - (parseFloat(a.distance) || 0));

      const totalRiders = sisters.reduce((acc, sr) => acc + (this.rosterCounts[sr.id] || 0), 0);

      let myReg = null;
      let myRegRace = r;
      for (const sr of sisters) {
        if (this.myRostersMap[sr.id]) {
          myReg = this.myRostersMap[sr.id];
          myRegRace = sr;
          break;
        }
      }

      let trackData = null;
      for (const sr of sisters) {
        if (sr.cat_logic) {
          try {
            const cl = typeof sr.cat_logic === 'string' ? JSON.parse(sr.cat_logic) : sr.cat_logic;
            if (cl?.track_data?.points?.length) {
              trackData = cl.track_data;
              break;
            }
          } catch(e) {}
        }
      }

      let eventChat = null;
      let posterUrl = null;
      for (const sr of sisters) {
        const chat = this.chatsByRaceId[sr.id];
        if (chat && !eventChat) eventChat = chat;
        if (chat?.panel_image && isImgFile(chat.panel_image) && !posterUrl) {
          const col = chat.collectionId || 'chats';
          posterUrl = `https://vilka.sotka.one/api/files/${col}/${chat.id}/${chat.panel_image}`;
        }
        const postMsg = (chat && this.postersMap[chat.id]) || this.postersMap[sr.id];
        if (postMsg?.file && !posterUrl) {
          const f = Array.isArray(postMsg.file) ? postMsg.file[0] : postMsg.file;
          if (isImgFile(f)) {
            const col = postMsg.collectionId || 'messages';
            posterUrl = `https://vilka.sotka.one/api/files/${col}/${postMsg.id}/${f}`;
          }
        }
      }

      const isLive = sisters.some(s => s.status === 'LIVE');
      const isFinished = sisters.every(s => s.status === 'Finished');
      const hasOpenReg = !isFinished && sisters.some(s => s.status === 'Registration');
      const isSoon = !isLive && !isFinished && !hasOpenReg;
      const isUpcoming = isLive || (!isFinished && group.dateMs >= nowMs);
      const isPinned = sisters.some(s => this.isRacePinned(s.id));
      const surface = r.surface || 'road';

      if (myReg && !isFinished) {
        myTicketPins.push({
          id: `my_ticket_${r.id}`,
          tagGroups: ['my', 'upcoming'],
          kind: 'my_start_ticket',
          dateMs: group.dateMs,
          race: myRegRace,
          baseName: group.baseName,
          reg: myReg,
          totalRiders,
          chat: eventChat
        });
      }

      const tagList = [
        surface === 'offroad' ? 'offroad' : 'road',
        isUpcoming ? 'upcoming' : 'archive'
      ];
      if (trackData) tagList.push('gpx');
      if (isPinned || myReg) tagList.push('my');

      const racePinObj = {
        id: `race_pin_${r.id}`,
        tagGroups: tagList,
        kind: posterUrl ? 'media_race' : 'yellow_poster_race',
        dateMs: group.dateMs,
        isUpcoming,
        hasOpenReg,
        isSoon,
        isPinned,
        race: r,
        baseName: group.baseName,
        sisters,
        posterUrl,
        trackData,
        totalRiders,
        myReg,
        isLive,
        isFinished,
        chat: eventChat
      };

      if (isUpcoming) {
        upcomingRacePins.push(racePinObj);
      } else {
        archiveRacePins.push(racePinObj);
      }
    });

    upcomingRacePins.sort((a, b) => a.dateMs - b.dateMs);
    archiveRacePins.sort((a, b) => b.dateMs - a.dateMs);

    const finalStream = [];

    if (!this.isGuest && this.currentRider) {
      finalStream.push({
        id: 'pin_personal_control',
        tagGroups: ['my'],
        kind: 'control_athlete',
        rider: this.currentRider
      });
    } else {
      finalStream.push({
        id: 'pin_guest_welcome',
        tagGroups: ['my'],
        kind: 'control_guest'
      });
    }

    finalStream.push(...myTicketPins);
    finalStream.push(...upcomingRacePins);

    const combatTeams = Object.values(this.teamsMap).filter(t => t.name && !t.name.toUpperCase().includes('ONE TEAM')).slice(0, 4);
    if (combatTeams.length > 0) {
      finalStream.push({
        id: 'pin_clubs_leaderboard',
        tagGroups: ['clubs'],
        kind: 'data_clubs_top',
        teams: combatTeams
      });
    }

    const isJudgeOrAdmin = this.userRoles.some(rl => ['superadmin', 'admin', 'judge'].includes(rl));
    if (isJudgeOrAdmin) {
      const targetJudgeRace = upcomingRacePins[0]?.race || this.races[0];
      finalStream.push({
        id: 'pin_judge_control',
        tagGroups: ['my'],
        kind: 'control_judge',
        race: targetJudgeRace
      });
    }

    finalStream.push(...archiveRacePins);

    this.allPins = finalStream;
  }

  // Жёлтая плашка без картинки: покрытие, дата и дистанция расположены прямо под названием
  getYellowPosterInnerHtml(pin, surfaceLabel, dateFmt, ctaText, ctaClass, ctaIcon) {
    const r = pin.race;
    const titleLen = (pin.baseName || '').length;
    const fontSize = titleLen > 24 ? '15px' : (titleLen > 15 ? '17px' : '20px');

    const bottomActionLabel = pin.isFinished 
      ? 'ПРОТОКОЛ' 
      : (pin.isLive ? 'LIVE ТАБЛО' : (pin.hasOpenReg ? 'БРИФИНГ' : 'АНОНС'));

    let gpxEmbeddedHtml = '';
    if (pin.trackData?.points?.length) {
      const sm = pin.trackData.summary || {};
      const svgCurve = this.buildCardElevationSvg(pin.trackData.points, false);
      gpxEmbeddedHtml = `
        <div class="yp-gpx-box">
          <div class="yp-gpx-stats">
            <span style="display:inline-flex; align-items:center; gap:3px;">${ICONS.map} <span>3D GPX +${sm.gain || 0}М</span></span>
            <span>MAX ${sm.maxSlope || 0}%</span>
          </div>
          ${svgCurve}
        </div>
      `;
    }

    const radioHoverBtn = pin.chat ? `
      <button class="pin-radio-pill-btn" onclick="window.sotkaHub.openEventRadio('${r.id}', event)" title="Перейти в Радио события">
        ${ICONS.radio}
        <span>Радио</span>
      </button>
    ` : '';

    return `
      <div class="pin-hover-layer">
        <div class="pin-hover-bottom-bar">
          <button class="pin-cta-btn ${ctaClass}" onclick="event.stopPropagation(); window.sotkaHub.handleRaceRegistration('${r.id}')">
            ${ctaIcon}
            <span>${ctaText}</span>
          </button>
          <div style="display:flex; align-items:center; gap:5px;">
            ${radioHoverBtn}
            <button class="pin-icon-round ${pin.isPinned ? 'is-pinned' : ''}" onclick="window.sotkaHub.togglePinRace('${r.id}', event)" title="${pin.isPinned ? 'В моих пинах (убрать)' : 'Добавить в мои пины'}">
              ${pin.isPinned ? ICONS.pinFilled : ICONS.pinOutline}
            </button>
            <button class="pin-icon-round" onclick="event.stopPropagation(); window.sotkaHub.shareRace('${r.id}')" title="Скопировать ссылку">
              ${ICONS.share}
            </button>
          </div>
        </div>
      </div>

      <div class="yp-center-body">
        <h3 class="yp-event-title" style="font-size:${fontSize};">${this.escapeHTML(pin.baseName)}</h3>
        <div class="yp-under-title-pills">
          <span class="yp-meta-pill">${ICONS.flag} <span>${surfaceLabel}</span></span>
          <span class="yp-meta-pill is-date">${dateFmt}</span>
          ${r.distance ? `<span class="yp-meta-pill">${r.distance} КМ</span>` : ''}
        </div>
      </div>

      ${gpxEmbeddedHtml}

      <div class="yp-bottom-bar">
        <span style="display:inline-flex; align-items:center; gap:4px;">${ICONS.users} <span>${pin.totalRiders} УЧ.</span></span>
        <span style="display:inline-flex; align-items:center; gap:3px;"><span>${bottomActionLabel}</span> ${ICONS.arrowRight}</span>
      </div>
    `;
  }

  upgradeBrokenImgToYellowPoster(imgEl, pinId) {
    const pin = this.allPins.find(p => p.id === pinId);
    const card = imgEl.closest('.pin-visual-card');
    if (!card || !pin) return;

    const r = pin.race;
    const dObj = new Date(r.date);
    const dateFmt = !isNaN(dObj.getTime()) ? dObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).toUpperCase() : 'СКОРО';
    const surfaceLabel = { road: 'ШОССЕ', offroad: 'ГРУНТ', track: 'ТРЕК', indoor: 'ИНДОР' }[r.surface] || 'ВЕЛОГОНКА';

    let ctaText = 'Заявиться';
    let ctaClass = '';
    let ctaIcon = ICONS.bolt;
    if (pin.isFinished) { ctaText = 'Результаты'; ctaClass = 'is-dark'; ctaIcon = ICONS.flag; }
    else if (pin.isLive) { ctaText = 'LIVE'; ctaClass = ''; ctaIcon = ICONS.bolt; }
    else if (pin.myReg) { ctaText = 'В старте'; ctaClass = 'is-green'; ctaIcon = ICONS.check; }
    else if (pin.isSoon) { ctaText = 'Анонс'; ctaClass = 'is-soon'; ctaIcon = ICONS.clock; }

    card.classList.remove('is-media');
    card.classList.add('pin-yellow-poster');
    card.innerHTML = this.getYellowPosterInnerHtml(pin, surfaceLabel, dateFmt, ctaText, ctaClass, ctaIcon);
  }

  renderGrid() {
    const grid = document.getElementById('hubMasonryGrid');
    const mobileDeck = document.getElementById('hubMobileDeck');
    if (!grid) return;

    const isMobile = window.innerWidth <= 640;

    const filtered = this.allPins.filter(p => {
      const tags = p.tagGroups || [];
      const matchTag = (this.activeTag === 'all') 
        || tags.includes(this.activeTag)
        || (this.activeTag === 'my' && (p.myReg || p.isPinned));

      if (!matchTag) return false;
      if (!this.searchQuery) return true;

      const dump = JSON.stringify({
        b: p.baseName,
        n: p.race?.name,
        s: p.race?.surface,
        k: p.kind
      }).toLowerCase();
      return dump.includes(this.searchQuery);
    });

    if (filtered.length === 0) {
      if (mobileDeck) mobileDeck.innerHTML = '';
      grid.innerHTML = `<div style="width:100%; text-align:center; padding:60px 20px; color:var(--text-muted); font-family:'Unbounded'; font-size:12px;">В ЭТОЙ КАТЕГОРИИ ПОКА НЕТ ПИНОВ</div>`;
      return;
    }

    let gridPins = filtered;
    if (isMobile && mobileDeck) {
      const controlPin = filtered.find(p => p.kind === 'control_athlete' || p.kind === 'control_guest');
      if (controlPin && (this.activeTag === 'all' || this.activeTag === 'my')) {
        mobileDeck.innerHTML = this.renderPinHTML(controlPin);
        gridPins = filtered.filter(p => p.id !== controlPin.id);
      } else {
        mobileDeck.innerHTML = '';
      }
    } else if (mobileDeck) {
      mobileDeck.innerHTML = '';
    }

    const colCount = this.getColumnsCount();
    const colsHtml = Array.from({ length: colCount }, () => []);
    const colHeights = Array.from({ length: colCount }, () => 0);

    gridPins.forEach((pin) => {
      let shortestColIdx = 0;
      for (let i = 1; i < colCount; i++) {
        if (colHeights[i] < colHeights[shortestColIdx]) {
          shortestColIdx = i;
        }
      }

      colsHtml[shortestColIdx].push(this.renderPinHTML(pin));
      const estHeight = pin.kind === 'media_race' ? 320 : 250;
      colHeights[shortestColIdx] += estHeight;
    });

    grid.innerHTML = colsHtml.map(colItems => `
      <div class="hub-masonry-col">
        ${colItems.join('')}
      </div>
    `).join('');
  }

              <button class="ctrl-btn dark" onclick="window.sotkaHub.openLoginModal()">
                <span>ВОЙТИ</span>
                ${ICONS.arrowRight}
              </button>
              <button class="ctrl-btn primary" onclick="window.sotkaHub.openCreateEventModal()">
                ${ICONS.plus}
                <span>ДОБАВИТЬ СВОЁ</span>
              </button>
            </div>
          </div>
        </article>
      `;
    }

    if (pin.kind === 'control_judge') {
      const r = pin.race;
      const rName = r ? (r.name.includes('[') ? r.name.split('[')[0].trim() : r.name) : 'Управление';
      return `
        <article class="pin-unit">
          <div class="pin-visual-card pin-data-box surface-dark">
            <div>
              <div class="data-kicker" style="color:var(--sotka-gold);">
                <span style="display:inline-flex; align-items:center; gap:5px;">${ICONS.shield} <span>СУДЕЙСКИЙ & ОРГ ПУЛЬТ</span></span>
                <span>PERO PRO+</span>
              </div>
              <h3 class="data-title">${this.escapeHTML(rName)}</h3>
              <div style="font-size:11px; opacity:0.75; margin-top:6px;">
                Быстрый доступ к мобильному хронометражу, выдаче BIB и конструктору гонок.
              </div>
            </div>
            <div class="ctrl-btn-row">
              ${r ? `<button class="ctrl-btn primary" onclick="window.open('https://pero.sotka.one/?race_id=${r.id}', '_blank')">${ICONS.clock} <span>ПУЛЬТ PERO</span></button>` : ''}
              ${r ? `<button class="ctrl-btn" onclick="window.sotkaHub.openJudgeQrModal('${r.id}', '${this.escapeHTML(rName)}')">${ICONS.qr} <span>QR СУДЬИ</span></button>` : ''}
              <button class="ctrl-btn" onclick="window.sotkaHub.openCreateEventModal()"><span>+ ДОБАВИТЬ СВОЁ</span></button>
            </div>
          </div>
        </article>
      `;
    }

    if (pin.kind === 'my_start_ticket') {
      const r = pin.race;
      const reg = pin.reg;
      const isPaid = Boolean(reg.is_paid) || !(Number(r.price) > 0);
      return `
        <article class="pin-unit">
          <div class="pin-visual-card pin-data-box surface-white" onclick="window.sotkaHub.openRaceHubModal('${r.id}', 'briefing')">
            <div>
              <div class="data-kicker">
                <span style="color:var(--sotka-green); display:inline-flex; align-items:center; gap:4px;">${ICONS.check} <span>ВЫ В СТАРТ-ЛИСТЕ</span></span>
                <span>${isPaid ? 'ОПЛАЧЕНО' : 'ОЖИДАЕТ ОПЛАТЫ'}</span>
              </div>
              <div class="data-big-metric">${reg.bib ? `№${reg.bib}` : 'BIB —'}</div>
              <h3 class="data-title">${this.escapeHTML(pin.baseName)}</h3>
              <div class="data-grid-mini">
                <div class="data-cell">
                  <div class="data-cell-lbl">СТАРТ ВОЛНЫ</div>
                  <div class="data-cell-val">${reg.planned_start || 'По расписанию'}</div>
                </div>
                <div class="data-cell">
                  <div class="data-cell-lbl">КАТЕГОРИЯ</div>
                  <div class="data-cell-val">${this.escapeHTML(reg.final_cluster || 'Абсолют')}</div>
                </div>
              </div>
            </div>
            <div class="data-footer">
              <span style="display:inline-flex; align-items:center; gap:4px;">${ICONS.users} <span>${pin.totalRiders} УЧ.</span></span>
              <div style="display:inline-flex; align-items:center; gap:8px;">
                ${pin.chat ? `<span class="pin-caption-radio-chip" onclick="window.sotkaHub.openEventRadio('${r.id}', event)">${ICONS.radio} <span>РАДИО</span></span>` : ''}
                <span style="color:var(--pin-red); display:inline-flex; align-items:center; gap:3px;"><span>БРИФИНГ</span> ${ICONS.arrowRight}</span>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    if (pin.kind === 'data_clubs_top') {
      return `
        <article class="pin-unit">
          <div class="pin-visual-card pin-data-box surface-soft" onclick="window.sotkaHub.toggleDrawer('messages')">
            <div>
              <div class="data-kicker">
                <span style="display:inline-flex; align-items:center; gap:4px;">${ICONS.trophy} <span>КОМАНДНЫЙ ЗАЧЕТ</span></span>
                <span>ПЕЛОТОН</span>
              </div>
              <h3 class="data-title" style="margin-bottom:10px;">Лидеры Клубной Лиги</h3>
              <div style="display:flex; flex-direction:column; gap:5px;">
                ${pin.teams.map((t, idx) => `
                  <div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:6px 9px; border-radius:8px; border:1px solid var(--border-light); font-size:11px; font-weight:700;">
                    <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:130px;">${idx + 1}.${this.escapeHTML(t.name)}</span>
                    <span style="font-family:'Roboto Mono',monospace; color:#b45309;">${t.points || 0} pts</span>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="data-footer">
              <span>РАЦИЯ КОМАНД</span>
              <span style="display:inline-flex; align-items:center; gap:3px;"><span>ОТКРЫТЬ ЭФИР</span> ${ICONS.arrowRight}</span>
            </div>
          </div>
        </article>
      `;
    }

    const r = pin.race;
    const dObj = new Date(r.date);
    const dateFmt = !isNaN(dObj.getTime()) ? dObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).toUpperCase() : 'СКОРО';
    const surfaceLabel = { road: 'ШОССЕ', offroad: 'ГРУНТ', track: 'ТРЕК', indoor: 'ИНДОР' }[r.surface] || 'ВЕЛОГОНКА';

    let ctaText = 'Заявиться';
    let ctaClass = '';
    let ctaIcon = ICONS.bolt;
    let statusMetaLabel = 'Открыта регистрация';

    if (pin.isFinished) {
      ctaText = 'Результаты';
      ctaClass = 'is-dark';
      ctaIcon = ICONS.flag;
      statusMetaLabel = 'Завершена';
    } else if (pin.isLive) {
      ctaText = 'LIVE';
      ctaClass = '';
      ctaIcon = ICONS.bolt;
      statusMetaLabel = 'Идет гонка';
    } else if (pin.myReg) {
      ctaText = 'В старте';
      ctaClass = 'is-green';
      ctaIcon = ICONS.check;
      statusMetaLabel = 'Вы заявлены';
    } else if (pin.isSoon) {
      ctaText = 'Анонс';
      ctaClass = 'is-soon';
      ctaIcon = ICONS.clock;
      statusMetaLabel = 'Анонс старта';
    }

    const sisterChipsHtml = (pin.sisters && pin.sisters.length > 1) ? `
      <div class="pin-sister-chips" onclick="event.stopPropagation()">
        ${pin.sisters.map(sr => {
          const tag = sr.name.includes('[') ? sr.name.split('[')[1].replace(']', '').trim() : `${sr.distance || 0} км`;
          const cnt = this.rosterCounts[sr.id] || 0;
          return `<span class="pin-sister-chip" onclick="window.sotkaHub.openRaceHubModal('${sr.id}', 'briefing')" title="Открыть дистанцию ${this.escapeHTML(tag)}">${this.escapeHTML(tag)} (${cnt})</span>`;
        }).join('')}
      </div>
    ` : '';

    const radioCaptionChipHtml = pin.chat ? `
      <button type="button" class="pin-caption-radio-chip" onclick="window.sotkaHub.openEventRadio('${r.id}', event)" title="Перейти в Радио гонки">
        ${ICONS.radio}
        <span>Радио</span>
      </button>
    ` : '';

    let photoGpxOverlayHtml = '';
    if (pin.trackData?.points?.length) {
      const sm = pin.trackData.summary || {};
      const svgCurve = this.buildCardElevationSvg(pin.trackData.points, true);
      photoGpxOverlayHtml = `
        <div class="pin-gpx-overlay">
          <div class="pin-gpx-overlay-stats">
            <span style="display:inline-flex; align-items:center; gap:4px;">${ICONS.map} <span>3D GPX • +${sm.gain || 0}М</span></span>
            <span>${sm.distance || r.distance || 0} КМ • MAX ${sm.maxSlope || 0}%</span>
          </div>
          ${svgCurve}
        </div>
      `;
    }

    if (pin.kind === 'media_race' && pin.posterUrl) {
      const radioHoverBtn = pin.chat ? `
        <button class="pin-radio-pill-btn" onclick="window.sotkaHub.openEventRadio('${r.id}', event)" title="Перейти в Радио события">
          ${ICONS.radio}
          <span>Радио</span>
        </button>
      ` : '';

      return `
        <article class="pin-unit">
          <div class="pin-visual-card is-media" onclick="window.sotkaHub.openRaceHubModal('${r.id}', 'briefing')">
            <div class="pin-unified-topbar">
              <span class="pin-surface-pill">${ICONS.flag} <span>${surfaceLabel}</span></span>
              <span class="pin-date-pill">${dateFmt}</span>
            </div>

            ${photoGpxOverlayHtml}

            <div class="pin-hover-layer">
              <div class="pin-hover-bottom-bar">
                <button class="pin-cta-btn ${ctaClass}" onclick="event.stopPropagation(); window.sotkaHub.handleRaceRegistration('${r.id}')">
                  ${ctaIcon}
                  <span>${ctaText}</span>
                </button>
                <div style="display:flex; align-items:center; gap:5px;">
                  ${radioHoverBtn}
                  <button class="pin-icon-round ${pin.isPinned ? 'is-pinned' : ''}" onclick="window.sotkaHub.togglePinRace('${r.id}', event)" title="${pin.isPinned ? 'В моих пинах (убрать)' : 'Добавить в мои пины'}">
                    ${pin.isPinned ? ICONS.pinFilled : ICONS.pinOutline}
                  </button>
                  <button class="pin-icon-round" onclick="event.stopPropagation(); window.sotkaHub.shareRace('${r.id}')" title="Скопировать ссылку">
                    ${ICONS.share}
                  </button>
                </div>
              </div>
            </div>

            <img class="pin-main-img" src="${pin.posterUrl}" alt="${this.escapeHTML(pin.baseName)}" loading="lazy"
                 onerror="window.sotkaHub.upgradeBrokenImgToYellowPoster(this, '${pin.id}')">
          </div>

          <div class="pin-caption">
            <div class="pin-caption-row">
              <h4 class="pin-caption-title" onclick="window.sotkaHub.openRaceHubModal('${r.id}', 'briefing')" style="cursor:pointer;">${this.escapeHTML(pin.baseName)}</h4>
              <button class="pin-caption-pin-btn ${pin.isPinned ? 'is-pinned' : ''}" onclick="window.sotkaHub.togglePinRace('${r.id}', event)" title="${pin.isPinned ? 'В моих пинах' : 'В мои пины'}">
                ${pin.isPinned ? ICONS.pinFilled : ICONS.pinOutline}
              </button>
            </div>
            <div class="pin-caption-meta">
              <div style="display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <span>${statusMetaLabel}</span>
                ${radioCaptionChipHtml}
              </div>
              <span style="font-family:'Roboto Mono',monospace; font-weight:700; display:inline-flex; align-items:center; gap:3px;">${ICONS.users} <span>${pin.totalRiders}</span></span>
            </div>
            ${sisterChipsHtml}
          </div>
        </article>
      `;
    }

    return `
      <article class="pin-unit">
        <div class="pin-visual-card pin-yellow-poster" onclick="window.sotkaHub.openRaceHubModal('${r.id}', 'briefing')">
          ${this.getYellowPosterInnerHtml(pin, surfaceLabel, dateFmt, ctaText, ctaClass, ctaIcon)}
        </div>
        <div class="pin-caption">
          <div class="pin-caption-row">
            <div style="display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap;">
              <span style="font-size:11px; color:var(--text-muted); font-weight:600;">${statusMetaLabel}</span>
              ${radioCaptionChipHtml}
            </div>
            <button class="pin-caption-pin-btn ${pin.isPinned ? 'is-pinned' : ''}" onclick="window.sotkaHub.togglePinRace('${r.id}', event)" title="${pin.isPinned ? 'В моих пинах' : 'В мои пины'}">
              ${pin.isPinned ? ICONS.pinFilled : ICONS.pinOutline}
            </button>
          </div>
          ${sisterChipsHtml}
        </div>
      </article>
    `;
  }

  openMyIduckModal() {
    if (this.isGuest || !this.currentRider) {
      return this.openLoginModal();
    }

    const r = this.currentRider;
    const modal = document.getElementById('hubQrModal');
    const box = document.getElementById('hubQrModalContent');
    box.className = 'hub-modal-card';

    const fullName = `${r.first_name || ''} ${r.last_name || ''}`.trim();
    const cluster = r.base_cluster || 'B';
    const yob = r.yob || '';
    const gender = (r.gender || 'M').toUpperCase();
    const tIds = Array.isArray(r.team_id) ? r.team_id : (r.team_id ? [r.team_id] : []);
    const teamName = (tIds[0] && this.teamsMap[tIds[0]]?.name) ? this.teamsMap[tIds[0]].name : 'ONE TEAM';

    const qrPayload = `V1|${r.id}|${r.last_name || ''}|${r.first_name || ''}|${yob}|${gender}|${cluster}|${teamName}`;

    box.innerHTML = `
      <div style="font-family:'Roboto Mono',monospace; font-size:10px; font-weight:800; color:var(--text-muted); margin-bottom:4px; display:inline-flex; align-items:center; gap:5px; justify-content:center;">
        ${ICONS.qr} <span>IDUCK • ПРОПУСК УЧАСТНИКА</span>
      </div>
      <div style="font-family:'Unbounded',sans-serif; font-size:15px; font-weight:900; text-transform:uppercase; text-align:center;">${this.escapeHTML(fullName)}</div>
      <div style="font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:700; color:#b45309; text-align:center;">${this.escapeHTML(teamName)} • КЛАСТЕР ${cluster}</div>
      <div style="display:flex; justify-content:center;">
        <canvas id="hubIduckCanvas" width="210" height="210" style="border-radius:12px; border:1px solid var(--border-light);"></canvas>
      </div>
      <div style="font-size:11px; color:var(--text-muted); text-align:center;">Покажите QR судье на регистрации для мгновенной выдачи номера BIB</div>
      <button class="ctrl-btn dark" style="width:100%; height:44px;" onclick="document.getElementById('hubQrModal').style.display='none'">ЗАКРЫТЬ</button>
    `;

    modal.style.display = 'flex';

    setTimeout(() => {
      const canvas = document.getElementById('hubIduckCanvas');
      if (canvas && typeof QRCode !== 'undefined') {
        QRCode.toCanvas(canvas, qrPayload, { width: 210, margin: 1, errorCorrectionLevel: 'H' });
      }
    }, 30);
  }

  openJudgeQrModal(raceId, raceName) {
    const modal = document.getElementById('hubQrModal');
    const box = document.getElementById('hubQrModalContent');
    box.className = 'hub-modal-card';
    const pultUrl = `https://pero.sotka.one/?race_id=${raceId}`;

    box.innerHTML = `
      <div style="font-family:'Roboto Mono',monospace; font-size:10px; font-weight:800; color:var(--pin-red); display:inline-flex; align-items:center; gap:5px; justify-content:center;">
        ${ICONS.shield} <span>МОБИЛЬНЫЙ ПУЛЬТ СУДЬИ PERO</span>
      </div>
      <div style="font-family:'Unbounded',sans-serif; font-size:14px; font-weight:900; text-transform:uppercase; text-align:center;">${this.escapeHTML(raceName)}</div>
      <div style="display:flex; justify-content:center;">
        <canvas id="hubJudgeQrCanvas" width="210" height="210" style="border-radius:12px; border:1px solid var(--border-light);"></canvas>
      </div>
      <div style="display:flex; gap:8px; width:100%;">
        <button class="ctrl-btn primary" style="height:42px;" onclick="window.open('${pultUrl}', '_blank')">
          <span>ОТКРЫТЬ ПУЛЬТ</span>
          ${ICONS.arrowRight}
        </button>
        <button class="ctrl-btn" style="height:42px;" onclick="document.getElementById('hubQrModal').style.display='none'">ЗАКРЫТЬ</button>
      </div>
    `;
    modal.style.display = 'flex';

    setTimeout(() => {
      const canvas = document.getElementById('hubJudgeQrCanvas');
      if (canvas && typeof QRCode !== 'undefined') {
        QRCode.toCanvas(canvas, pultUrl, { width: 210, margin: 1 });
      }
    }, 30);
  }

  setTag(tag, btn) {
    this.activeTag = tag;
    document.querySelectorAll('.hub-tag').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    this.renderGrid();
  }

  onSearch(val) {
    this.searchQuery = (val || '').toLowerCase().trim();
    this.renderGrid();
  }

  shareRace(raceId) {
    const url = `https://vilka.sotka.one/#${raceId}`;
    navigator.clipboard.writeText(url).then(() => this.showToast('Ссылка скопирована'));
  }

  async start() {
    await this.initAuth();
    await this.loadEcosystem();
  }
}

window.sotkaHub = new SotkaPinterestHub();
document.addEventListener('DOMContentLoaded', () => window.sotkaHub.start());
</script>

<script>

  function syncPinHeightToPoster() {

    if (window.innerWidth <= 860) {
      bodyCol.style.height = 'auto';
      bodyCol.style.maxHeight = 'none';
      return;
    }

    var h = mediaCol.offsetHeight;
    if (h > 320) {
      var targetH = Math.max(h, 520);
      bodyCol.style.height = targetH + 'px';
      bodyCol.style.maxHeight = targetH + 'px';

    if (_vilkaLoadingPromise) {
      await _vilkaLoadingPromise;
      syncHubToVilkaApp(hub);
      return window.app;

    _vilkaLoadingPromise = (async function() {
      try {
        var res = await fetch('/vilka.js?v=81');

        // Убираем редирект на /board.html внутри vilka.js и отключаем только MessengerApp.init()
        var safeCode = code
          .replace(/if\s*\(\s*window\.location\.hostname\.toLowerCase\(\)\s*===\s*['"]ru\.sotka\.one['"][\s\S]*?\}\s*/, '')

        var scriptEl = document.createElement('script');
        scriptEl.textContent = safeCode;
        document.body.appendChild(scriptEl);

        if (!window.app && typeof MessengerApp !== 'undefined') {
          window.app = new MessengerApp();
        }
      } catch (err) {
        console.error('Ошибка подключения vilka.js:', err);

    await _vilkaLoadingPromise;

    window.app.chats = hub.chatsList || [];
    window.app.pelotonsMap = {};
    (hub.pelotonsList || []).forEach(function(p) {
      window.app.pelotonsMap[p.id] = p;
    });
    window.app.getUserMaxRole = function() {
      var roles = hub.userRoles || [];
      if (roles.includes('superadmin')) return 'superadmin';
      if (roles.includes('admin')) return 'admin';
      if (roles.includes('judge')) return 'judge';
      if (roles.includes('captain')) return 'captain';
      return 'rider';
    };
    if (typeof window.app.getSisterRaces !== 'function') {
      window.app.getSisterRaces = function(raceOrId) {
        var r = (typeof raceOrId === 'object' && raceOrId) ? raceOrId : hub.racesById[raceOrId];
        if (!r) return [];
        var base = (r.name && r.name.includes('[')) ? r.name.split('[')[0].trim().toLowerCase() : (r.name || '').trim().toLowerCase();
        var day = r.date ? String(r.date).slice(0, 10) : '';
        return (hub.races || []).filter(function(sr) {
          var srBase = (sr.name && sr.name.includes('[')) ? sr.name.split('[')[0].trim().toLowerCase() : (sr.name || '').trim().toLowerCase();
          var srDay = sr.date ? String(sr.date).slice(0, 10) : '';
          return srBase === base && srDay === day;
        });
      };

  }

  function ensureInlineContainer() {
    var existing = document.getElementById('inlinePinStageWrap');
    if (existing) return existing;
    var grid = document.getElementById('hubMasonryGrid');
    if (!grid || !grid.parentNode) return null;
    var wrap = document.createElement('section');
    wrap.id = 'inlinePinStageWrap';
    grid.parentNode.insertBefore(wrap, grid);
    return wrap;
  }

  var origGoHome = SotkaPinterestHub.prototype.goHome;
  var origSetTag = SotkaPinterestHub.prototype.setTag;
  var origToggleDrawer = SotkaPinterestHub.prototype.toggleDrawer;

  Object.assign(SotkaPinterestHub.prototype, {

    getRacePinAlias: function(raceId) {
      var r = this.racesById[raceId];
      if (!r) return raceId;
      var chat = this.chatsByRaceId[raceId];
      if (!chat) {
        var baseName = (r.name && r.name.includes('[')) ? r.name.split('[')[0].trim().toLowerCase() : (r.name || '').trim().toLowerCase();
        var dayStr = r.date ? String(r.date).slice(0, 10) : '';
        for (var i = 0; i < this.races.length; i++) {
          var sr = this.races[i];
          var srBase = (sr.name && sr.name.includes('[')) ? sr.name.split('[')[0].trim().toLowerCase() : (sr.name || '').trim().toLowerCase();
          var srDay = sr.date ? String(sr.date).slice(0, 10) : '';
          if (srBase === baseName && srDay === dayStr && this.chatsByRaceId[sr.id]) {
            chat = this.chatsByRaceId[sr.id];
            break;
          }
        }
      }
      if (chat && chat.slug && String(chat.slug).trim()) {
        return String(chat.slug).trim();
      }
      return raceId;
    },

    resolveRaceIdFromHash: function(rawHash) {
      var clean = decodeURIComponent(String(rawHash || '')).replace(/^#\/?/, '').trim();
      if (!clean) return null;
      var low = clean.toLowerCase();

      if (this.racesById[clean]) return clean;

      for (var i = 0; i < this.chatsList.length; i++) {
        var c = this.chatsList[i];
        if (!c || !c.race_id) continue;
        var cSlug = String(c.slug || '').trim().toLowerCase();
        if ((cSlug && cSlug === low) || String(c.id).toLowerCase() === low || String(c.race_id).toLowerCase() === low) {
          var rId = Array.isArray(c.race_id) ? c.race_id[0] : c.race_id;
          if (this.racesById[rId]) return rId;
        }
      }

      for (var j = 0; j < this.races.length; j++) {
        var r = this.races[j];
        if (String(r.id).toLowerCase() === low) return r.id;
      }

      return null;
    },

    handleUrlHashRouting: async function() {
      stripBoardHtmlFromUrl();
      var hash = window.location.hash;
      if (!hash || hash === '#') {
        if (this._modalRaceContext) {
          this.closeInlinePin(true);
        }
        return false;
      }
      var targetRaceId = this.resolveRaceIdFromHash(hash);
      if (targetRaceId) {
        if (!this._modalRaceContext || this._modalRaceContext.activeRace.id !== targetRaceId) {
          await this.openRaceHubModal(targetRaceId, 'briefing', true);
        }
        return true;
      }
      return false;
    },

    bindHistoryRouter: function() {
      if (this._historyRouterBound) return;
      this._historyRouterBound = true;
      var self = this;

      window.addEventListener('popstate', function() {
        stripBoardHtmlFromUrl();

        var liveModal = document.getElementById('liveBoardModal');
        if (liveModal && liveModal.style.display === 'flex') {
          if (window.app && window.app.crm) window.app.crm.closeLiveBoard();
          else liveModal.style.display = 'none';
          return;
        }
        var track3DModal = document.getElementById('race3DTrackModal');
        if (track3DModal && track3DModal.style.display === 'flex') {
          if (window.app && typeof window.app.close3DTrackModal === 'function') window.app.close3DTrackModal();
          else track3DModal.style.display = 'none';
          return;
        }
        var mapModal = document.getElementById('mapEmbedModal');
        if (mapModal && mapModal.style.display === 'flex') {
          mapModal.style.display = 'none';
          return;
        }
        var qrModal = document.getElementById('hubQrModal');
        if (qrModal && qrModal.style.display === 'flex') {
          qrModal.style.display = 'none';
          return;
        }

        self.handleUrlHashRouting();
      });
    },

    start: async function() {
      var self = this;
      stripBoardHtmlFromUrl();
      this.bindHistoryRouter();

      try {
        var authCookieMatch = document.cookie.match(/(?:^|;\s*)pb_auth=([^;]+)/);
        var hasAuthCookie = Boolean(authCookieMatch && authCookieMatch[1] && authCookieMatch[1].trim() !== '');
        if (hasAuthCookie) {
          this.pb.authStore.loadFromCookie(document.cookie, 'pb_auth');
          var cachedRiderStr = localStorage.getItem('vilka_cached_rider');
          if (cachedRiderStr && this.pb.authStore.isValid) {
            this.currentRider = JSON.parse(cachedRiderStr);
            this.isGuest = false;
            var authModel = this.pb.authStore.model || this.pb.authStore.record;
            if (authModel && authModel.role) {
              this.userRoles = Array.isArray(authModel.role) ? authModel.role : [authModel.role];
            }
            this.renderHeaderIdentity();
          }
        }
      } catch (e) {}

      var openedFromCacheHash = false;
      try {
        var snapStr = localStorage.getItem(BOARD_CACHE_KEY);
        if (snapStr) {
          var snap = JSON.parse(snapStr);
          if (snap && Array.isArray(snap.races) && snap.races.length > 0) {
            this.walletBalance = snap.walletBalance || 0;
            this.applyEcosystemPayload(snap);
            if (window.location.hash && window.location.hash.length > 1) {
              openedFromCacheHash = await this.handleUrlHashRouting();
            }
          }
        }
      } catch (e) {}

      await Promise.all([
        this.initAuth(),
        this.loadEcosystem()
      ]);

      if (!openedFromCacheHash && window.location.hash && window.location.hash.length > 1) {
        await this.handleUrlHashRouting();
      } else if (this._modalRaceContext) {
        var freshRace = this.racesById[this._modalRaceContext.activeRace.id];
        if (freshRace) {
          this._modalRaceContext.activeRace = freshRace;
          await this.renderRaceHubModalContent();
        }
      }

      setTimeout(function() {
        ensureVilkaEngineReady(self);
      }, 1200);
    },

    applyEcosystemPayload: function(data) {
      var self = this;
      this.races = data.races || [];
      this.racesById = {};
      this.races.forEach(function(r) { self.racesById[r.id] = r; });

      this.rosters = data.rosters || [];
      this.pelotonsList = data.pelotons || [];
      this.chatsList = data.chats || [];
      this.announcements = data.announcements || [];

      this.updateNotifBadge();

      this.teamsMap = {};
      (data.teams || []).forEach(function(t) { self.teamsMap[t.id] = t; });

      this.rosterCounts = {};
      this.myRostersMap = {};
      this.rosters.forEach(function(r) {
        if (r.race_id) {
          self.rosterCounts[r.race_id] = (self.rosterCounts[r.race_id] || 0) + 1;
          if (self.currentRider && r.rider_id === self.currentRider.id) {
            self.myRostersMap[r.race_id] = r;
          }
        }
      });

      this.chatsById = {};
      this.chatsByRaceId = {};
      (data.chats || []).forEach(function(c) {
        self.chatsById[c.id] = c;
        if (c.race_id) self.chatsByRaceId[c.race_id] = c;
      });

      this.postersMap = {};
      (data.announcements || []).forEach(function(m) {
        if (m.file && m.chat_id && !self.postersMap[m.chat_id]) {
          self.postersMap[m.chat_id] = m;
        }
      });

      this.buildPinsStream();
      this.renderGrid();
    },

// Считаем только реально новые (непрочитанные) анонсы
    updateNotifBadge: function() {
      var notifBadge = document.getElementById('railNotifBadge');
      if (!notifBadge) return;

      var seenTs = Number(localStorage.getItem('sotka_notif_seen_ts') || 0);
      var unreadCount = (this.announcements || []).filter(function(m) {
        var mTs = new Date(m.created || 0).getTime();
        return mTs > seenTs;
      }).length;

      if (unreadCount > 0) {
        notifBadge.innerText = unreadCount > 9 ? '9+' : String(unreadCount);
        notifBadge.style.display = 'flex';
      } else {
        notifBadge.style.display = 'none';
      }
    },

    // При открытии колокольчика фиксируем время последнего анонса как прочитанное
    toggleDrawer: function(drawerKey) {
      if (drawerKey === 'notif' && Array.isArray(this.announcements) && this.announcements.length > 0) {
        var latestTs = 0;
        this.announcements.forEach(function(m) {
          var t = new Date(m.created || 0).getTime() || 0;
          if (t > latestTs) latestTs = t;
        });
        if (latestTs > 0) {
          try {
            localStorage.setItem('sotka_notif_seen_ts', String(latestTs));
          } catch (e) {}
        }
      }
      if (origToggleDrawer) origToggleDrawer.call(this, drawerKey);
      if (drawerKey === 'notif') {
        this.updateNotifBadge();
      }
    },

    loadEcosystem: async function() {
      try {
        var uid = (!this.isGuest && this.pb.authStore.model) ? this.pb.authStore.model.id : null;

        var results = await Promise.all([
          this.pb.collection('races').getFullList({
            sort: 'date',
            fields: 'id,name,date,surface,format,distance,laps,status,price,peloton_id,creator_id,is_public,level,cat_logic',
            requestKey: null
          }).catch(function() { return []; }),
          this.pb.collection('race_rosters').getFullList({
            filter: 'status != "canceled"',
            fields: 'id,race_id,rider_id,bib,planned_start,is_paid,status,final_cluster',
            requestKey: null
          }).catch(function() { return []; }),
          this.pb.collection('teams').getFullList({
            sort: '-points',
            fields: 'id,name,points,peloton_id,avatar',
            requestKey: null
          }).catch(function() { return []; }),
          this.pb.collection('messages').getList(1, 35, {
            filter: 'is_announcement = true',
            sort: '-created',
            expand: 'chat_id',
            requestKey: null
          }).catch(function() { return { items: [] }; }),
          this.pb.collection('chats').getFullList({
            filter: 'type = "global" || type = "team_channel"',
            fields: 'id,collectionId,name,type,race_id,team_id,panel_image,slug,panel_data',
            sort: '-updated',
            requestKey: null
          }).catch(function() { return []; }),
          this.pb.collection('pelotons').getFullList({
            filter: 'is_private = false',
            fields: 'id,name,slug,is_private',
            sort: 'name',
            requestKey: null
          }).catch(function() { return []; }),
          uid
            ? this.pb.collection('draft_wallets').getFirstListItem('user_id="' + uid + '"', { requestKey: null }).catch(function() { return null; })
            : Promise.resolve(null)
        ]);

        var wallet = results[6];
        if (wallet && wallet.balances) {
          this.walletBalance = Object.values(wallet.balances).reduce(function(a, b) { return a + Number(b || 0); }, 0);
        }

        var payload = {
          races: results[0] || [],
          rosters: results[1] || [],
          teams: results[2] || [],
          announcements: (results[3] && results[3].items) ? results[3].items : [],
          chats: results[4] || [],
          pelotons: results[5] || [],
          walletBalance: this.walletBalance
        };

        this.applyEcosystemPayload(payload);

        try {
          localStorage.setItem(BOARD_CACHE_KEY, JSON.stringify(payload));
        } catch (e) {}
      } catch (err) {
        console.error('Ошибка синхронизации с PocketBase:', err);
      }
    },

    goHome: function() {
      this.closeInlinePin();
      if (origGoHome) origGoHome.call(this);
    },

    setTag: function(tag, btn) {
      this.closeInlinePin();
      if (origSetTag) origSetTag.call(this, tag, btn);
    },

    closeInlinePin: function(fromHistory) {
      document.body.classList.remove('pin-view-open');
      document.title = DEFAULT_DOC_TITLE;
      var wrap = document.getElementById('inlinePinStageWrap');
      if (wrap) {
        wrap.classList.remove('open');
        wrap.innerHTML = '';
      }
      this._modalRaceContext = null;

      if (!fromHistory) {
        try {
          history.pushState(null, '', '/' + window.location.search);
        } catch (e) {}
      }
    },

    // Формирует чистую короткую ссылку https://ru.sotka.one/#slug без board.html
    shareRace: function(raceId) {
      var alias = this.getRacePinAlias(raceId);
      var url = window.location.origin + '/#' + alias;
      var self = this;
      navigator.clipboard.writeText(url).then(function() {
        self.showToast('Ссылка скопирована: ' + url.replace(/^https?:\/\//, ''));

    openVilkaProtocol: async function(raceId, event) {
      if (event) event.stopPropagation();
      var app = await ensureVilkaEngineReady(this);
      if (app && typeof app.openLiveBoard === 'function') {
        app.openLiveBoard(raceId, event);
      }
    },

    openVilkaRouteMap: async function(raceId, event) {
      if (event) event.stopPropagation();
      var app = await ensureVilkaEngineReady(this);
      var r = this.racesById[raceId];
      if (!r || !app) return;

      var hasGpx = false;
      try {
        var cl = typeof r.cat_logic === 'string' ? JSON.parse(r.cat_logic) : r.cat_logic;
        hasGpx = Boolean(cl && cl.track_data && cl.track_data.points && cl.track_data.points.length);
      } catch (e) {}

      if (hasGpx && typeof app.open3DTrackModal === 'function') {
        app.open3DTrackModal(raceId);
        return;
      }

      var chat = this.chatsByRaceId[raceId] || (this._modalRaceContext && this._modalRaceContext.eventChat);
      var embedCode = null;
      if (chat && chat.panel_data) {
        try {
          var pData = typeof chat.panel_data === 'string' ? JSON.parse(chat.panel_data) : chat.panel_data;
          embedCode = pData.embed_code || pData.map_iframe;
        } catch (e) {}
      }
      if (embedCode && typeof app.openMapModal === 'function') {
        app.currentMapEmbed = embedCode;
        app.openMapModal();
        return;
      }

      if (this._modalRaceContext && this._modalRaceContext.trackData && typeof app.open3DTrackModal === 'function') {
        var sisterWithTrack = (this._modalRaceContext.sisters || []).find(function(sr) {
          try {
            var scl = typeof sr.cat_logic === 'string' ? JSON.parse(sr.cat_logic) : sr.cat_logic;
            return Boolean(scl && scl.track_data && scl.track_data.points && scl.track_data.points.length);
          } catch (e) { return false; }
        });
        if (sisterWithTrack) {
          app.open3DTrackModal(sisterWithTrack.id);
          return;
        }
      }

      this.showToast('Маршрут для этой дистанции ещё не загружен');
    },

    resolveRaceMediaAndTrack: function(sisters) {
      var isImgFile = function(name) {
        return typeof name === 'string' && /\.(jpe?g|png|webp|gif|svg)$/i.test(name.trim());
      };
      var posterUrl = null;
      var trackData = null;
      var eventChat = null;

      for (var i = 0; i < sisters.length; i++) {
        var sr = sisters[i];
        var chat = this.chatsByRaceId[sr.id];
        if (chat && !eventChat) eventChat = chat;

        if (chat && chat.panel_image && isImgFile(chat.panel_image) && !posterUrl) {
          var col = chat.collectionId || 'chats';
          posterUrl = 'https://vilka.sotka.one/api/files/' + col + '/' + chat.id + '/' + chat.panel_image;
        }
        var postMsg = (chat && this.postersMap[chat.id]) || this.postersMap[sr.id];
        if (postMsg && postMsg.file && !posterUrl) {
          var f = Array.isArray(postMsg.file) ? postMsg.file[0] : postMsg.file;
          if (isImgFile(f)) {
            var mCol = postMsg.collectionId || 'messages';
            posterUrl = 'https://vilka.sotka.one/api/files/' + mCol + '/' + postMsg.id + '/' + f;
          }
        }

        if (!trackData && sr.cat_logic) {
          try {
            var cl = typeof sr.cat_logic === 'string' ? JSON.parse(sr.cat_logic) : sr.cat_logic;
            if (cl && cl.track_data && cl.track_data.points && cl.track_data.points.length) {
              trackData = cl.track_data;
            }
          } catch (e) {}
        }
      }
      return { posterUrl: posterUrl, trackData: trackData, eventChat: eventChat };
    },

    openRaceHubModal: async function(raceId, initialTab, fromHistory) {
      var modal = document.getElementById('hubQrModal');
      if (modal) modal.style.display = 'none';

      var r = this.racesById[raceId] || this.races[0];
      if (!r) return;

      var baseName = (r.name && r.name.includes('[')) ? r.name.split('[')[0].trim() : r.name;
      var dayStr = r.date ? String(r.date).slice(0, 10) : '';
      var sisters = this.races.filter(function(sr) {
        var srBase = (sr.name && sr.name.includes('[')) ? sr.name.split('[')[0].trim() : sr.name;
        var srDay = sr.date ? String(sr.date).slice(0, 10) : '';
        return srBase.toLowerCase() === baseName.toLowerCase() && srDay === dayStr;
      });
      if (sisters.length === 0) sisters.push(r);
      sisters.sort(function(a, b) { return (parseFloat(b.distance) || 0) - (parseFloat(a.distance) || 0); });

      var mediaInfo = this.resolveRaceMediaAndTrack(sisters);

      this._modalRaceContext = {
        activeRace: r,
        sisters: sisters,
        baseName: baseName,
        briefingExpanded: false,
        posterUrl: mediaInfo.posterUrl,
        trackData: mediaInfo.trackData,
        eventChat: mediaInfo.eventChat
      };

      // Ставим в адресную строку чистый адрес /#slug без board.html
      var pinAlias = this.getRacePinAlias(r.id);
      document.title = baseName + ' — СОТКА';
      if (!fromHistory) {
        var curHash = decodeURIComponent(window.location.hash || '').replace(/^#/, '');

          try {
            history.pushState({ pinRaceId: r.id }, '', '/' + window.location.search + '#' + pinAlias);
          } catch (e) {}
        }
      } else {
        stripBoardHtmlFromUrl();
      }

      document.body.classList.add('pin-view-open');
      await this.renderRaceHubModalContent();

      window.scrollTo({ top: 0, behavior: 'smooth' });

        this.openVilkaProtocol(r.id);

    switchModalSisterRace: function(raceId) {
