  async renderStoryPosterCanvas() {
    const raceId = document.getElementById('spRaceSelect')?.value;
    const file = document.getElementById('spPhotoInput')?.files?.[0];
    const race = this.racesById[raceId];
    if (!file || !race) return;

    const wrap = document.getElementById('spCanvasPreviewWrap');
    if (wrap) wrap.style.display = 'flex';

    const imgUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      // 1. Рендерим вертикальный сторис 1080x1920
      const canvas = document.getElementById('spPosterCanvas');
      const ctx = canvas.getContext('2d');
      const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
      const x = (canvas.width / 2) - (img.width / 2) * scale;
      const y = (canvas.height / 2) - (img.height / 2) * scale;
      ctx.drawImage(img, x, y, img.width * scale, img.height * scale);

      const grad = ctx.createLinearGradient(0, canvas.height * 0.35, 0, canvas.height);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.92)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#FFC107';
      ctx.font = '900 38px "Unbounded", sans-serif';
      const dateStr = new Date(race.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
      ctx.fillText(`${dateStr} • ${race.distance || 0} КМ`, 80, canvas.height - 420);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 72px "Unbounded", sans-serif';
      const cleanName = (race.name.includes('[') ? race.name.split('[')[0].trim() : race.name).toUpperCase();
      ctx.fillText(cleanName.slice(0, 22), 80, canvas.height - 320);

      ctx.fillStyle = '#FFC107';
      ctx.font = '900 64px "Unbounded", sans-serif';
      ctx.fillText('Я В ДЕЛЕ • SOTKA.ONE', 80, canvas.height - 180);

      // 2. Готовим сжатую обложку 600x800 для карточки пина на личном борде
      const thumbCanvas = document.getElementById('spCoverThumbCanvas');
      if (thumbCanvas) {
        const tCtx = thumbCanvas.getContext('2d');
        const tScale = Math.max(thumbCanvas.width / img.width, thumbCanvas.height / img.height);
        const tx = (thumbCanvas.width / 2) - (img.width / 2) * tScale;
        const ty = (thumbCanvas.height / 2) - (img.height / 2) * tScale;
        tCtx.drawImage(img, tx, ty, img.width * tScale, img.height * tScale);
      }
    };
    img.src = imgUrl;
  }

  async savePersonalPinCover() {
    if (this.isGuest || !this.currentRider) return this.openLoginModal();
    const raceId = document.getElementById('spRaceSelect')?.value;
    const thumbCanvas = document.getElementById('spCoverThumbCanvas');
    if (!raceId || !thumbCanvas) return;

    const btn = document.getElementById('btnSaveMyPersonalCover');
    if (btn) { btn.innerText = 'СОХРАНЕНИЕ...'; btn.disabled = true; }

    try {
      const dataUrl = thumbCanvas.toDataURL('image/webp', 0.78);
      let subs = this.currentRider.subscriptions || {};
      if (typeof subs === 'string') {
        try { subs = JSON.parse(subs); } catch (e) { subs = {}; }
      }
      if (!subs || typeof subs !== 'object' || Array.isArray(subs)) {
        subs = { riders: [], teams: [], pelotons: [] };
      }
      if (!subs.custom_posters || typeof subs.custom_posters !== 'object') {
        subs.custom_posters = {};
      }

      // Привязываем личную обложку ко всем сестринским дистанциям этого старта
      const r = this.racesById[raceId];
      const baseName = r?.name?.includes('[') ? r.name.split('[')[0].trim().toLowerCase() : (r?.name || '').trim().toLowerCase();
      const dayStr = r?.date ? String(r.date).slice(0, 10) : '';
      (this.races || []).forEach(sr => {
        const srBase = sr.name?.includes('[') ? sr.name.split('[')[0].trim().toLowerCase() : (sr.name || '').trim().toLowerCase();
        const srDay = sr.date ? String(sr.date).slice(0, 10) : '';
        if (sr.id === raceId || (baseName && srBase === baseName && srDay === dayStr)) {
          subs.custom_posters[sr.id] = dataUrl;
        }
      });

      const updated = await this.pb.collection('riders').update(this.currentRider.id, {
        subscriptions: subs
      }, { requestKey: null });

      this.currentRider = updated;
      if (this.subdomainOwnerRider && this.subdomainOwnerRider.id === updated.id) {
        this.subdomainOwnerRider = updated;
      }
      localStorage.setItem('vilka_cached_rider', JSON.stringify(updated));

      document.getElementById('hubQrModal').style.display = 'none';
      this.buildPinsStream();
      this.renderGrid();
      if (this._modalRaceContext) {
        await this.openRaceHubModal(raceId, 'briefing', true);
      }
      this.showToast('Личная обложка старта установлена на вашем борде!');
    } catch (e) {
      alert('Ошибка сохранения обложки: ' + e.message);
      if (btn) { btn.innerText = 'УСТАНОВИТЬ ОБЛОЖКОЙ НА МОЁМ БОРДЕ'; btn.disabled = false; }
    }
  }

  async removePersonalPinCover(raceId) {
    if (this.isGuest || !this.currentRider) return;
    try {
      let subs = this.currentRider.subscriptions || {};
      if (typeof subs === 'string') {
        try { subs = JSON.parse(subs); } catch (e) { subs = {}; }
      }
      if (subs && subs.custom_posters) {
        const r = this.racesById[raceId];
        const baseName = r?.name?.includes('[') ? r.name.split('[')[0].trim().toLowerCase() : (r?.name || '').trim().toLowerCase();
        const dayStr = r?.date ? String(r.date).slice(0, 10) : '';
        (this.races || []).forEach(sr => {
          const srBase = sr.name?.includes('[') ? sr.name.split('[')[0].trim().toLowerCase() : (sr.name || '').trim().toLowerCase();
          const srDay = sr.date ? String(sr.date).slice(0, 10) : '';
          if (sr.id === raceId || (baseName && srBase === baseName && srDay === dayStr)) {

    const lon = parseFloat(document.getElementById('rdLon')?.value);

    const btn = document.getElementById('btnLaunchRadar');
    if (btn) { btn.innerText = 'ОТПРАВКА...'; btn.disabled = true; }

    try {
      const yandexMapUrl = `https://yandex.ru/maps/?pt=${lon},${lat}&z=16&l=map`;
      const panelData = {
        text: `Сигнал от: ${this.currentRider.first_name} ${this.currentRider.last_name}\nКоординаты: ${lat}, ${lon}`,

        expiresAt: new Date(Date.now() + 6 * 3600 * 1000).toISOString()
      };

      const newChat = await this.pb.collection('chats').create({
        name: msg,
        type: 'radar',
        participants: [this.currentRider.id],
        panel_data: JSON.stringify(panelData)
      }, { requestKey: null });

      await this.pb.send('/api/push', {
        method: 'POST',
        body: {
          title: type === 'sos' ? 'СИГНАЛ SOS В ПЕЛОТОНЕ' : 'СБОР НА ПОКАТУШКУ',

      document.getElementById('hubQrModal').style.display = 'none';
      this.showToast('Сигнал Радара отправлен пелотону!');
      await this.loadEcosystem();
    } catch (e) {

        <canvas id="hubJudgeQrCanvas" width="210" height="210" style="border-radius:12px; border:1px solid var(--border-light);"></canvas>
      </div>
      <div style="display:flex; gap:8px; width:100%;">
        <button class="ctrl-btn primary" style="height:42px;" onclick="window.open('${pultUrl}', '_blank')">
          <span>ОТКРЫТЬ ПУЛЬТ</span>
          ${ICONS.arrowRight}
        </button>
        <button class="ctrl-btn" style="height:42px;" onclick="document.getElementById('hubQrModal').style.display='none'">ЗАКРЫТЬ</button>
      </div>
    `;
    modal.style.display = 'flex';

    setTimeout(() => {
      const canvas = document.getElementById('hubJudgeQrCanvas');
      if (canvas && typeof QRCode !== 'undefined') {
        QRCode.toCanvas(canvas, pultUrl, { width: 210, margin: 1 });
      }
    }, 30);
  }

  openMyIduckModal() {
    if (this.isGuest || !this.currentRider) return this.openLoginModal();

    const r = this.currentRider;
    const modal = document.getElementById('hubQrModal');
    const box = document.getElementById('hubQrModalContent');
    box.className = 'hub-modal-card';

    const fullName = `${r.first_name || ''} ${r.last_name || ''}`.trim();
    const cluster = r.base_cluster || 'B';
    const yob = r.yob || '';
    const gender = (r.gender || 'M').toUpperCase();
    const tIds = Array.isArray(r.team_id) ? r.team_id : (r.team_id ? [r.team_id] : []);
    const teamName = (tIds[0] && this.teamsMap[tIds[0]]?.name) ? this.teamsMap[tIds[0]].name : 'ONE TEAM';

    const qrPayload = `V1|${r.id}|${r.last_name || ''}|${r.first_name || ''}|${yob}|${gender}|${cluster}|${teamName}`;

    box.innerHTML = `
      <div style="font-family:'Roboto Mono',monospace; font-size:10px; font-weight:800; color:var(--text-muted); margin-bottom:4px; display:inline-flex; align-items:center; gap:5px; justify-content:center;">
        ${ICONS.qr} <span>IDUCK • ПРОПУСК УЧАСТНИКА</span>
      </div>
      <div style="font-family:'Unbounded',sans-serif; font-size:15px; font-weight:900; text-transform:uppercase; text-align:center;">${this.escapeHTML(fullName)}</div>
      <div style="font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:700; color:#b45309; text-align:center;">${this.escapeHTML(teamName)} • КЛАСТЕР ${cluster}</div>
      <div style="display:flex; justify-content:center;">
        <canvas id="hubIduckCanvas" width="210" height="210" style="border-radius:12px; border:1px solid var(--border-light);"></canvas>
      </div>
      <div style="font-size:11px; color:var(--text-muted); text-align:center;">Покажите QR судье на регистрации для мгновенной выдачи номера BIB</div>
      <button class="ctrl-btn dark" style="width:100%; height:44px;" onclick="document.getElementById('hubQrModal').style.display='none'">ЗАКРЫТЬ</button>
    `;

    modal.style.display = 'flex';

    setTimeout(() => {
      const canvas = document.getElementById('hubIduckCanvas');
      if (canvas && typeof QRCode !== 'undefined') {
        QRCode.toCanvas(canvas, qrPayload, { width: 210, margin: 1, errorCorrectionLevel: 'H' });
      }
    }, 30);
  }

  async openWalletModal() {
    if (this.isGuest || !this.currentRider) return this.openLoginModal();
    this.closeDrawers();

    const modal = document.getElementById('hubQrModal');
    const box = document.getElementById('hubQrModalContent');
    box.className = 'hub-modal-card';

    box.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-family:'Unbounded',sans-serif; font-size:13px; font-weight:900;">КОШЕЛЁК ДРАФТ (ВАТТЫ)</span>
        <button type="button" class="pin-icon-round" style="width:28px; height:28px;" onclick="document.getElementById('hubQrModal').style.display='none'">${MIN_SVG.closeX}</button>
      </div>
      <div style="background:#111111; color:#ffffff; padding:20px; border-radius:16px; text-align:center;">
        <div style="font-family:'Roboto Mono',monospace; font-size:10px; color:var(--sotka-gold); font-weight:800;">ДОСТУПНЫЙ БАЛАНС АТЛЕТА</div>
        <div style="font-family:'Roboto Mono',monospace; font-size:38px; font-weight:900; margin:6px 0;">${this.walletBalance} <span style="font-size:18px; color:var(--sotka-gold);">W</span></div>
        <button type="button" class="ctrl-btn primary" style="height:42px; width:100%; font-size:10px; margin-top:8px;" onclick="window.sotkaHub.promptTopup()">
          ${ICONS.bolt} <span>+ ПОПОЛНИТЬ ЧЕРЕЗ Т-БАНК</span>
        </button>
      </div>
      <div id="hubWalletTxList" style="display:flex; flex-direction:column; gap:6px; max-height:240px; overflow-y:auto;">
        <div style="text-align:center; padding:16px; color:var(--text-muted); font-size:12px;">Загрузка истории операций...</div>
      </div>
    `;
    modal.style.display = 'flex';

    try {
      const uid = this.pb.authStore.model?.id;
      const txRes = await this.pb.collection('draft_transactions').getList(1, 15, {
        filter: `sender_id="${uid}" || receiver_id="${uid}"`,
        sort: '-created',
        requestKey: null
      });
      const txBox = document.getElementById('hubWalletTxList');
      if (!txBox) return;
      if (!txRes.items.length) {
        txBox.innerHTML = `<div style="text-align:center; padding:16px; color:var(--text-muted); font-size:12px;">Операций пока нет</div>`;
      } else {
        txBox.innerHTML = txRes.items.map(tx => {
          const isOut = tx.sender_id === uid;
          return `
            <div class="roster-row">
              <div style="min-width:0;">
                <div style="font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${this.escapeHTML(tx.description || tx.type || 'Операция')}</div>
                <div style="font-size:10px; color:var(--text-muted); font-family:'Roboto Mono',monospace;">${new Date(tx.created).toLocaleDateString('ru-RU')}</div>
              </div>
              <div style="font-family:'Roboto Mono',monospace; font-weight:900; font-size:13px; color:${isOut ? '#111' : 'var(--sotka-green)'};">
                ${isOut ? '−' : '+'}${tx.amount} W
              </div>
            </div>
          `;
        }).join('');
      }
    } catch (e) {}
  }

  async promptTopup() {
    if (this.isGuest || !this.currentRider) return this.openLoginModal();
    const amount = prompt('Введите сумму пополнения (руб / Ватт):', '1000');
    if (!amount || isNaN(parseInt(amount, 10))) return;
    const email = this.pb.authStore.model?.email || this.currentRider.email || 'info@sotka.one';
    try {
      const res = await this.pb.send('/api/draft/topup', {
        method: 'POST',
        body: { amount: parseInt(amount, 10), email }
      });
      if (res?.paymentUrl) {
        window.location.href = res.paymentUrl;
      } else {
        alert('Платёжный шлюз не вернул ссылку.');
      }
    } catch (e) {
      alert('Ошибка создания платежа: ' + (e.data?.error || e.message));
    }
  }

  // =====================================================================
  // ШТОРКИ БОКОВОГО МЕНЮ (.pin-rail)
  // =====================================================================
  toggleDrawer(drawerKey) {
    const drawer = document.getElementById('railDrawer');
    const backdrop = document.getElementById('railDrawerBackdrop');
    const titleEl = document.getElementById('railDrawerTitle');
    const bodyEl = document.getElementById('railDrawerBody');

    if (this.activeDrawer === drawerKey && drawer.classList.contains('open')) {
      this.closeDrawers();
      return;
    }

    this.activeDrawer = drawerKey;
    document.querySelectorAll('.rail-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.getElementById(`railBtn-${drawerKey}`);
    if (activeBtn) activeBtn.classList.add('active');

    if (drawerKey === 'create') {
      const openCnt = this.getOpenRegistrationEvents().length;
      titleEl.innerText = 'СОЗДАТЬ В ЭКОСИСТЕМЕ';
      bodyEl.innerHTML = `
        <div class="drawer-card" style="background:#111111; color:#ffffff; border:1.5px solid var(--sotka-gold);" onclick="window.sotkaHub.openSuperRegPin()">
          <div style="font-family:'Unbounded',sans-serif; font-size:12px; font-weight:900; color:var(--sotka-gold); display:inline-flex; align-items:center; gap:6px;">
            ${ICONS.bolt} <span>Супер-заявка на все старты (${openCnt})</span>
          </div>
          <div style="font-size:12px; opacity:0.85;">Заявиться самому или заявить спортсмена команды/базы сразу на все открытые гонки</div>
        </div>
        <div class="drawer-card" onclick="window.sotkaHub.openCreateEventModal()">
          <div style="font-family:'Unbounded',sans-serif; font-size:12px; font-weight:800;">+ Гонка или Тренировка</div>
          <div style="font-size:12px; color:var(--text-muted);">Открыть конструктор стартов, загрузить GPX и настроить категории</div>
        </div>
        <div class="drawer-card" onclick="window.sotkaHub.openStoryPosterModal()">
          <div style="font-family:'Unbounded',sans-serif; font-size:12px; font-weight:800;">Сторис-постер «Я в деле»</div>
          <div style="font-size:12px; color:var(--text-muted);">Сгенерировать карточку участника или финишера для соцсетей</div>
        </div>
        <div class="drawer-card" onclick="window.sotkaHub.openCreateRadarModal()">
          <div style="font-family:'Unbounded',sans-serif; font-size:12px; font-weight:800;">Сигнал Радара (GPS)</div>
          <div style="font-size:12px; color:var(--text-muted);">Отправить точку сбора на покатушку или сигнал технической помощи</div>
        </div>
        <div class="drawer-card" onclick="window.sotkaHub.openJudgeRaceSelectorModal()">
          <div style="font-family:'Unbounded',sans-serif; font-size:12px; font-weight:800;">Мобильный пульт судьи Pero</div>
          <div style="font-size:12px; color:var(--text-muted);">Автономная отсечка старта и финиша со смартфона</div>
        </div>
      `;
    } else if (drawerKey === 'notif') {
      titleEl.innerText = 'УВЕДОМЛЕНИЯ И АНОНСЫ';
      if (Array.isArray(this.announcements) && this.announcements.length > 0) {
        let latestTs = 0;
        this.announcements.forEach(m => {
          const t = new Date(m.created || 0).getTime() || 0;
          if (t > latestTs) latestTs = t;
        });
        if (latestTs > 0) {
          try { localStorage.setItem('sotka_notif_seen_ts', String(latestTs)); } catch (e) {}
        }
      }
      this.updateNotifBadge();

      if (this.announcements.length === 0) {
        bodyEl.innerHTML = `<div style="text-align:center; padding:40px 10px; color:var(--text-muted); font-size:13px;">Новых анонсов пока нет</div>`;
      } else {
        bodyEl.innerHTML = this.announcements.slice(0, 20).map(m => {
          const sourceTitle = this.resolveAnnouncementSource(m);
          const cleanTxt = (m.text || 'Анонс события').replace(/\[ACTION:[^\]]+\]/g, '').trim();
          const dateStr = new Date(m.created).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

          let imgHtml = '';
          if (m.file) {
            const fName = Array.isArray(m.file) ? m.file[0] : m.file;
            if (typeof fName === 'string' && /\.(jpe?g|png|webp|gif|svg)$/i.test(fName)) {
              const col = m.collectionId || 'messages';
              imgHtml = `<img class="notif-thumb" src="https://vilka.sotka.one/api/files/${col}/${m.id}/${fName}" alt="Афиша" loading="lazy">`;
            }
          }

          const chat = this.chatsById[m.chat_id];
          const raceId = chat?.race_id;
          const clickCall = raceId
            ? `window.sotkaHub.closeDrawers(); window.sotkaHub.openRaceHubModal('${raceId}', 'briefing');`
            : `window.sotkaHub.openLiveChatInDrawer('${m.chat_id}', '${this.escapeHTML(sourceTitle)}');`;

          return `
            <div class="drawer-card" onclick="${clickCall}">
              <div class="notif-card-head">
                <div class="notif-source-badge">${ICONS.flag} <span>${this.escapeHTML(sourceTitle)}</span></div>
                <span class="notif-date">${dateStr}</span>
              </div>
              ${cleanTxt ? `<div style="font-size:12.5px; font-weight:600; color:#111; line-height:1.35; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">${this.escapeHTML(cleanTxt)}</div>` : ''}
              ${imgHtml}
            </div>
          `;
        }).join('');
      }
    } else if (drawerKey === 'messages') {
      titleEl.innerText = 'РАЦИЯ И ЭФИРЫ';
      const activeChats = this.chatsList.slice(0, 20);
      bodyEl.innerHTML = activeChats.map(c => {
        const cleanTitle = (c.name || 'Канал').replace(/\s+\d{1,2}\s+[а-яА-Я]+\s+\d{1,2}:\d{2}$/i, '').trim();
        return `
          <div class="drawer-card" onclick="window.sotkaHub.openLiveChatInDrawer('${c.id}', '${this.escapeHTML(cleanTitle)}')">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <span style="font-family:'Unbounded',sans-serif; font-size:11px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${this.escapeHTML(cleanTitle)}</span>
              <span style="font-family:'Roboto Mono',monospace; font-size:9px; color:var(--text-muted); flex-shrink:0;">${c.type === 'team_channel' ? 'КЛУБ' : 'ЭФИР'}</span>
            </div>
          </div>
        `;
      }).join('');
    } else if (drawerKey === 'settings') {
      titleEl.innerText = 'НАСТРОЙКИ БОРДА';
      const isRight = document.body.classList.contains('rail-right');

      const yearsSet = new Set();
      this.races.forEach(r => {
        if (r.date) {
          const y = new Date(r.date).getFullYear();
          if (!isNaN(y) && y > 2000) yearsSet.add(y);
        }
      });
      const availableYears = Array.from(yearsSet).sort((a, b) => a - b);

      bodyEl.innerHTML = `
        <div style="font-family:'Unbounded',sans-serif; font-size:10px; font-weight:800; color:var(--text-muted); margin-top:4px;">РАСПОЛОЖЕНИЕ МЕНЮ НА ЭКРАНЕ</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <button type="button" class="ctrl-btn ${!isRight ? 'dark' : ''}" style="height:38px;" onclick="window.sotkaHub.setRailPosition('left')">Слева (По умолч.)</button>
          <button type="button" class="ctrl-btn ${isRight ? 'dark' : ''}" style="height:38px;" onclick="window.sotkaHub.setRailPosition('right')">Справа</button>
        </div>

        <div style="font-family:'Unbounded',sans-serif; font-size:10px; font-weight:800; color:var(--text-muted); margin-top:12px;">СЕЗОН КАЛЕНДАРЯ</div>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">
          <button type="button" class="ctrl-btn ${this.selectedSeasonYear === 'all' ? 'dark' : ''}" style="height:36px; flex:1; min-width:70px;" onclick="window.sotkaHub.setSeasonYear('all')">Все</button>
          ${availableYears.map(yr => `
            <button type="button" class="ctrl-btn ${Number(this.selectedSeasonYear) === yr ? 'dark' : ''}" style="height:36px; flex:1; min-width:70px;" onclick="window.sotkaHub.setSeasonYear(${yr})">${yr}</button>
          `).join('')}
        </div>

        <div style="font-family:'Unbounded',sans-serif; font-size:10px; font-weight:800; color:var(--text-muted); margin-top:12px;">ФИЛЬТР ПО ПЕЛОТОНУ / ЛИГЕ</div>
        <div class="drawer-card" onclick="window.sotkaHub.setPelotonFilter('all')" style="${this.selectedPelotonId === 'all' ? 'border:1.5px solid #111;' : ''}">
          <div style="font-weight:700; font-size:13px;">Все пелотоны (Глобально)</div>
        </div>
        ${this.pelotonsList.map(p => `
          <div class="drawer-card" onclick="window.sotkaHub.setPelotonFilter('${p.id}')" style="${this.selectedPelotonId === p.id ? 'border:1.5px solid #111;' : ''}">
            <div style="font-weight:700; font-size:13px;">${this.escapeHTML(p.name)}</div>
          </div>
        `).join('')}
      `;
    }

    backdrop.classList.add('open');
    drawer.classList.add('open');
  }

  async openLiveChatInDrawer(chatId, chatTitle) {
    const titleEl = document.getElementById('railDrawerTitle');
    const bodyEl = document.getElementById('railDrawerBody');
    if (!bodyEl) return;

    titleEl.innerText = chatTitle || 'ЭФИР';
    bodyEl.innerHTML = `<div style="padding:30px; text-align:center; color:var(--text-muted);">Загрузка сообщений...</div>`;

    const chat = this.chatsById[chatId];
    const raceId = chat?.race_id;

    const msgsRes = await this.pb.collection('messages').getList(1, 30, {
      filter: `chat_id="${chatId}"`,
      sort: '-created',
      expand: 'sender_id',
      requestKey: null
    }).catch(() => ({ items: [] }));

    const msgs = (msgsRes.items || []).reverse();

    bodyEl.innerHTML = `
      <div style="display:flex; justify-content:space-between; gap:6px; margin-bottom:6px;">
        <button type="button" class="ctrl-btn" style="flex:0 0 auto;" onclick="window.sotkaHub.toggleDrawer('messages')">${MIN_SVG.arrowLeft} <span>К списку</span></button>
        ${raceId ? `<button type="button" class="ctrl-btn primary" onclick="window.sotkaHub.closeDrawers(); window.sotkaHub.openRaceHubModal('${raceId}', 'briefing')">КАРТОЧКА ГОНКИ</button>` : ''}
      </div>
      <div style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px;" id="drawerChatStream">
        ${msgs.map(m => {
          const s = m.expand?.sender_id || {};
          const sName = ((s.first_name || '') + ' ' + (s.last_name || '')).trim() || 'Атлет';
          const cleanTxt = (m.text || '').replace(/\[ACTION:[^\]]+\]/g, '').trim();
          return `
            <div style="background:var(--bg-subtle); padding:10px 12px; border-radius:12px;">
              <div style="display:flex; justify-content:space-between; font-size:10px; font-weight:800; margin-bottom:3px;">
                <span style="font-family:'Unbounded',sans-serif;">${this.escapeHTML(sName)}</span>
                <span style="font-family:'Roboto Mono',monospace; color:var(--text-muted);">${new Date(m.created).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</span>
              </div>
              <div style="font-size:12.5px; line-height:1.4; white-space:pre-wrap;">${this.escapeHTML(cleanTxt)}</div>
            </div>
          `;
        }).join('') || '<div style="text-align:center; padding:30px; color:var(--text-muted);">Сообщений пока нет</div>'}
      </div>
      <div style="display:flex; gap:6px; padding-top:8px; border-top:1px solid var(--border-light);">
        <input type="text" id="drawerChatInput" class="hub-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') window.sotkaHub.sendDrawerChatMessage('${chatId}', '${this.escapeHTML(chatTitle)}')">
        <button type="button" class="ctrl-btn dark" style="flex:0 0 auto; height:40px; padding:0 12px;" onclick="window.sotkaHub.sendDrawerChatMessage('${chatId}', '${this.escapeHTML(chatTitle)}')">${MIN_SVG.send}</button>
      </div>
    `;
    const stream = document.getElementById('drawerChatStream');
    if (stream) stream.scrollTop = stream.scrollHeight;
  }

  async sendDrawerChatMessage(chatId, chatTitle) {
    if (this.isGuest || !this.currentRider) return this.openLoginModal();
    const inp = document.getElementById('drawerChatInput');
    const txt = (inp?.value || '').trim();
    if (!txt) return;
    inp.value = '';
    try {
      await this.pb.collection('messages').create({
        chat_id: chatId,
        sender_id: this.currentRider.id,
        text: txt
      }, { requestKey: null });
      await this.openLiveChatInDrawer(chatId, chatTitle);
    } catch (e) {
      alert('Ошибка отправки: ' + e.message);
    }
  }

  closeDrawers() {
    this.activeDrawer = null;
    document.getElementById('railDrawer')?.classList.remove('open');
    document.getElementById('railDrawerBackdrop')?.classList.remove('open');
    document.querySelectorAll('.rail-btn').forEach(b => b.classList.remove('active'));
    this.updateCalendarToggleUI();
  }

  setRailPosition(pos) {
    if (pos === 'right') {
      document.body.classList.add('rail-right');
      localStorage.setItem('sotka_rail_pos', 'right');
    } else {
      document.body.classList.remove('rail-right');
      localStorage.setItem('sotka_rail_pos', 'left');
    }
    this.toggleDrawer('settings');
  }

  setSeasonYear(yr) {
    this.selectedSeasonYear = yr;
    this.buildPinsStream();
    this.renderGrid();
    this.closeDrawers();
  }

  setPelotonFilter(pId) {
    this.selectedPelotonId = pId;
    this.buildPinsStream();
    this.renderGrid();
    if (this.isCalendarViewOpen) {
      this.renderBoardMonthCalendar(this.boardCalDate || new Date());
    }
    this.closeDrawers();
  }
}

window.sotkaHub = new SotkaPinterestHub();
document.addEventListener('DOMContentLoaded', () => window.sotkaHub.start());
</script>
