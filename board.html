    renderRaceHubModalContent: async function() {
      var self = this;
      var ctx = this._modalRaceContext;
      if (!ctx) return;
      var wrap = ensureInlineContainer();
      if (!wrap) return;
      wrap.classList.add('open');

      var r = ctx.activeRace;
      var activeTrack = ctx.trackData;
      try {
        var cl = typeof r.cat_logic === 'string' ? JSON.parse(r.cat_logic) : r.cat_logic;
        if (cl && cl.track_data && cl.track_data.points && cl.track_data.points.length) {
          activeTrack = cl.track_data;
        }
      } catch (e) {}

      var myReg = this.myRostersMap[r.id];
      var isFinished = r.status === 'Finished';
      var isLive = r.status === 'LIVE';
      var isSoon = r.status === 'Скоро';
      var isPinned = this.isRacePinned(r.id);

      var chat = this.chatsByRaceId[r.id] || ctx.eventChat;
      var radioDirectUrl = 'https://vilka.sotka.one/#' + r.id;
      if (chat) {
        radioDirectUrl = chat.slug
          ? ('https://vilka.sotka.one/#' + chat.slug)
          : ('https://vilka.sotka.one/?chat=' + chat.id);
      }

      var pData = { text: '', buttons: [] };
      if (chat && chat.panel_data) {
        try {
          pData = typeof chat.panel_data === 'string' ? JSON.parse(chat.panel_data) : chat.panel_data;
        } catch (e) {}
      }

      var hasEmbedMap = Boolean(pData.embed_code || pData.map_iframe);
      var hasGpx = Boolean(activeTrack && activeTrack.points && activeTrack.points.length);
      var hasAnyMap = hasGpx || hasEmbedMap;
      var sm = (activeTrack && activeTrack.summary) ? activeTrack.summary : {};

      var dObj = new Date(r.date);
      var validDate = !isNaN(dObj.getTime());
      var timeStr = validDate ? dObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '--:--';
      var dateShort = validDate ? dObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).toUpperCase() : 'СКОРО';
      var fullDateStr = validDate ? dObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) : '';

      var surfaceMap = { road: 'ШОССЕ', offroad: 'ГРУНТ', track: 'ТРЕК', indoor: 'ИНДОР' };
      var surfaceLabel = surfaceMap[r.surface] || 'ВЕЛОГОНКА';

      var formatMap = { mass: 'ГРУППА', itt: 'РАЗДЕЛКА ITT', ttt: 'КОМАНДНАЯ TTT', crit: 'КРИТЕРИУМ' };
      var formatLabel = formatMap[r.format] || String(r.format || 'МАСС-СТАРТ').toUpperCase();

      var totalReg = this.rosterCounts[r.id] || 0;
      var priceStr = Number(r.price) > 0 ? (r.price + ' W') : '0 W';

      var pId = Array.isArray(r.peloton_id) ? r.peloton_id[0] : r.peloton_id;
      var pelotonObj = this.pelotonsList.find(function(p) { return p.id === pId; });
      var pelotonName = pelotonObj ? pelotonObj.name : 'SOTKA.ONE';

      var ctaBtnHtml = '';
      if (isFinished) {
        ctaBtnHtml = '<button type="button" class="pin-cta-btn is-dark" style="height:40px; padding:0 18px; font-size:12.5px;" onclick="window.sotkaHub.openVilkaProtocol(\'' + r.id + '\', event)">' + ICONS.trophy + ' <span>Протокол</span></button>';
      } else if (myReg) {
        ctaBtnHtml = '<button type="button" class="pin-cta-btn is-green" style="height:40px; padding:0 18px; font-size:12.5px;" onclick="window.sotkaHub.openManageMyRegModal(window.sotkaHub.racesById[\'' + r.id + '\'], window.sotkaHub.myRostersMap[\'' + r.id + '\'])">' + ICONS.check + ' <span>Вы в старте</span></button>';
      } else if (isSoon) {
        ctaBtnHtml = '<button type="button" class="pin-cta-btn is-soon" style="height:40px; padding:0 18px; font-size:12.5px;" onclick="window.sotkaHub.togglePinRace(\'' + r.id + '\', event)">' + ICONS.clock + ' <span>Скоро</span></button>';
      } else {
        ctaBtnHtml = '<button type="button" class="pin-cta-btn" style="height:40px; padding:0 20px; font-size:13px;" onclick="window.sotkaHub.handleRaceRegistration(\'' + r.id + '\')">' + ICONS.bolt + ' <span>Заявиться</span></button>';
      }

      var sisterSelectHtml = '';
      if (ctx.sisters.length > 1) {
        var opts = ctx.sisters.map(function(sr) {
          var tag = (sr.name && sr.name.includes('[')) ? sr.name.split('[')[1].replace(']', '').trim() : ((sr.distance || 0) + ' км');
          var cnt = self.rosterCounts[sr.id] || 0;
          var sel = (sr.id === r.id) ? ' selected' : '';
          return '<option value="' + sr.id + '"' + sel + '>' + self.escapeHTML(tag) + ' (' + cnt + ')</option>';
        }).join('');
        sisterSelectHtml = '<select class="pin-sister-select" onchange="window.sotkaHub.switchModalSisterRace(this.value)">' + opts + '</select>';
      }

      var mediaContentHtml = '';
      if (ctx.posterUrl) {
        mediaContentHtml = '<img class="pin-poster-full-img" id="pinMainPosterImg" src="' + ctx.posterUrl + '" alt="' + this.escapeHTML(ctx.baseName) + '">';
      } else {
        var yGpx = hasGpx
          ? ('<div class="yp-gpx-box" style="margin-top:10px;"><div class="yp-gpx-stats"><span>3D GPX +' + (sm.gain || 0) + 'М</span><span>MAX ' + (sm.maxSlope || 0) + '%</span></div>' + this.buildCardElevationSvg(activeTrack.points, false) + '</div>')
          : '';
        mediaContentHtml =
          '<div style="width:100%; min-height:540px; background:var(--sotka-gold); color:#111; padding:72px 32px; display:flex; flex-direction:column; justify-content:center; gap:12px; line-height:normal;">' +
            '<div class="yp-under-title-pills" style="margin:0;">' +
              '<span class="yp-meta-pill">' + ICONS.flag + ' <span>' + surfaceLabel + '</span></span>' +
              '<span class="yp-meta-pill is-date">' + dateShort + '</span>' +
              '<span class="yp-meta-pill">' + (r.distance || 0) + ' КМ</span>' +
            '</div>' +
            '<h2 class="yp-event-title" style="font-size:28px; line-height:1.12;">' + this.escapeHTML(ctx.baseName) + '</h2>' +
            '<div style="font-family:\'Roboto Mono\',monospace; font-size:12px; font-weight:800;">' + fullDateStr + ' • Старт в ' + timeStr + '</div>' +
            yGpx +
          '</div>';
      }

      var mapOverlayBtns = '';
      if (hasAnyMap) {
        mapOverlayBtns =
          '<div style="display:flex; gap:6px;">' +
            (hasGpx ? ('<button type="button" class="pin-glass-pill" onclick="window.sotkaHub.downloadGpxFromTrack(\'' + r.id + '\')" title="Скачать GPX">' + MIN_SVG.download + ' <span>GPX</span></button>') : '') +
            '<button type="button" class="pin-glass-pill" onclick="window.sotkaHub.openVilkaRouteMap(\'' + r.id + '\', event)">' + MIN_SVG.mapRoute + ' <span>Карта дистанции</span></button>' +
          '</div>';
      }

      var extButtonsHtml = '';
      if (Array.isArray(pData.buttons) && pData.buttons.length > 0) {
        extButtonsHtml = pData.buttons.map(function(btn) {
          return '<a href="' + self.escapeHTML(btn.url) + '" target="' + (btn.blank ? '_blank' : '_self') + '" class="pin-web-pill-btn">' +
            '<span>' + self.escapeHTML(btn.label || 'Открыть веб-сайт') + '</span>' +
            MIN_SVG.arrowUpRight +
          '</a>';
        }).join('');
      }

      var rawBriefing = pData.text || '';
      var isLong = rawBriefing.length > 200 || (rawBriefing.split('\n').length > 3);
      var briefingTextHtml = rawBriefing
        ? this.formatBriefingHtml(rawBriefing)
        : '<span style="color:var(--text-muted);">Регламент и описание обновляются организатором.</span>';
      var clampCls = (!ctx.briefingExpanded && isLong) ? ' pin-briefing-clamp' : '';
      var expandBtnHtml = isLong
        ? ('<button type="button" id="pinBriefingExpandBtn" class="pin-expand-link" onclick="window.sotkaHub.toggleBriefingExpand()">' + (ctx.briefingExpanded ? 'Свернуть положение' : 'Развернуть полностью') + '</button>')
        : '';

      var relatedPins = this.allPins.filter(function(p) {
        return (p.kind === 'media_race' || p.kind === 'yellow_poster_race') && p.race && p.race.id !== r.id;
      }).slice(0, 2);
      var relatedHtml = relatedPins.map(function(p) { return self.renderPinHTML(p); }).join('');

      var chatIdStr = chat ? chat.id : '';

      wrap.innerHTML =
        '<div class="pin-pinterest-layout">' +
          '<div class="pin-inline-card">' +
            '<div class="pin-inline-media">' +
              '<div class="pin-media-top-bar">' +
                '<button type="button" class="pin-back-btn-inline" onclick="window.sotkaHub.closeInlinePin()" title="Назад к доске">' + MIN_SVG.arrowLeft + '</button>' +
                '<span class="pin-date-pill" style="padding:6px 10px; font-size:10px;">' + surfaceLabel + ' • ' + dateShort + '</span>' +
              '</div>' +
              mediaContentHtml +
              '<div class="pin-media-bottom-bar">' +
                '<button type="button" class="pin-glass-pill" onclick="window.sotkaHub.openStoryPosterForRace(\'' + r.id + '\')">' + MIN_SVG.camera + ' <span>Сторис</span></button>' +
                mapOverlayBtns +
              '</div>' +
            '</div>' +

            '<div class="pin-inline-body">' +
              '<div class="pin-inline-topbar">' +
                '<div class="pin-tool-cluster">' +
                  '<button type="button" class="pin-tool-circle ' + (isPinned ? 'is-pinned' : '') + '" onclick="window.sotkaHub.togglePinRace(\'' + r.id + '\', event); setTimeout(function(){window.sotkaHub.renderRaceHubModalContent();}, 60);" title="Сохранить в мои пины">' +
                    (isPinned ? MIN_SVG.bookmarkFilled : MIN_SVG.bookmarkOutline) +
                  '</button>' +
                  '<button type="button" class="pin-tool-circle" onclick="window.sotkaHub.shareRace(\'' + r.id + '\')" title="Поделиться ссылкой">' + MIN_SVG.sharePin + '</button>' +
                  '<button type="button" class="pin-tool-circle" onclick="window.sotkaHub.openStoryPosterForRace(\'' + r.id + '\')" title="Создать сторис">' + MIN_SVG.camera + '</button>' +
                  '<button type="button" class="pin-tool-circle" onclick="window.sotkaHub.openJudgeQrModal(\'' + r.id + '\', \'' + this.escapeHTML(ctx.baseName) + '\')" title="Пульт судьи Pero">' + MIN_SVG.shield + '</button>' +
                '</div>' +
                '<div style="display:flex; align-items:center; gap:8px;">' +
                  sisterSelectHtml +
                  ctaBtnHtml +
                '</div>' +
              '</div>' +

              '<div class="pin-body-scroll-area">' +
                '<div>' +
                  '<div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">' +
                    '<div style="display:inline-flex; align-items:center; gap:8px;">' +
                      '<div class="pin-org-avatar"><img src="' + DUCK_SVG_URL + '" width="15" height="15" alt="S"></div>' +
                      '<span class="pin-org-name">' + this.escapeHTML(pelotonName) + '</span>' +
                    '</div>' +
                    '<span style="font-family:\'Roboto Mono\',monospace; font-size:11px; font-weight:800; color:var(--text-muted);">' +
                      (isLive ? 'LIVE' : fullDateStr) +
                    '</span>' +
                  '</div>' +
                  '<h1 class="pin-inline-title">' + this.escapeHTML(ctx.baseName) + '</h1>' +
                '</div>' +

                '<div class="vilka-bento-telemetry" style="margin-bottom:0;">' +
                  '<div class="vilka-tile-mini">' +
                    '<span class="vilka-mini-lbl">СТАРТ</span>' +
                    '<div class="vilka-mini-val">' + timeStr + '</div>' +
                    '<div class="vilka-mini-sub">' + dateShort + '</div>' +
                  '</div>' +
                  '<div class="vilka-tile-mini ' + (hasAnyMap ? 'clickable' : '') + '" ' + (hasAnyMap ? ('onclick="window.sotkaHub.openVilkaRouteMap(\'' + r.id + '\', event)"') : '') + '>' +
                    '<span class="vilka-mini-lbl">ДИСТАНЦИЯ</span>' +
                    '<div class="vilka-mini-val accent">' + (r.distance || 0) + ' КМ</div>' +
                    '<div class="vilka-mini-sub" style="' + (hasAnyMap ? 'color:#111; font-weight:800;' : '') + '">' + (hasAnyMap ? 'КАРТА ДИСТАНЦИИ' : this.escapeHTML(formatLabel)) + '</div>' +
                  '</div>' +
                  '<div class="vilka-tile-mini clickable" onclick="window.sotkaHub.openVilkaProtocol(\'' + r.id + '\', event)">' +
                    '<span class="vilka-mini-lbl">ПЕЛОТОН</span>' +
                    '<div class="vilka-mini-val">' + totalReg + ' ЧЕЛ.</div>' +
                    '<div class="vilka-mini-sub" style="color:#111; font-weight:800;">ПРОТОКОЛ</div>' +
                  '</div>' +
                  '<div class="vilka-tile-mini clickable" onclick="window.sotkaHub.openWalletModal()">' +
                    '<span class="vilka-mini-lbl">ВЗНОС</span>' +
                    '<div class="vilka-mini-val">' + priceStr + '</div>' +
                    '<div class="vilka-mini-sub">КОШЕЛЁК</div>' +
                  '</div>' +
                '</div>' +

                '<div class="pin-bridge-actions">' +
                  '<button type="button" class="pin-web-pill-btn" onclick="window.sotkaHub.openVilkaProtocol(\'' + r.id + '\', event)">' +
                    MIN_SVG.protocolList +
                    '<span>Протокол (' + totalReg + ')</span>' +
                  '</button>' +
                  '<a href="' + radioDirectUrl + '" class="pin-web-pill-btn is-gold">' +
                    MIN_SVG.radioWave +
                    '<span>Радио гонки</span>' +
                  '</a>' +
                '</div>' +

                extButtonsHtml +

                '<div class="vilka-briefing-card" style="padding:12px 14px;">' +
                  '<div class="vilka-briefing-head" style="margin-bottom:6px; padding-bottom:6px;">ПОЛОЖЕНИЕ И ПРОГРАММА</div>' +
                  '<div id="pinBriefingTextBody" class="vilka-briefing-body' + clampCls + '" style="font-size:13px;">' + briefingTextHtml + '</div>' +
                  expandBtnHtml +
                '</div>' +

                '<div class="pin-radio-teaser">' +
                  '<div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">' +
                    '<div style="font-family:\'Unbounded\',sans-serif; font-size:10px; font-weight:900; display:inline-flex; align-items:center; gap:6px;">' +
                      '<span class="pin-live-dot"></span>' +
                      '<span>РАДИО ГОНКИ</span>' +
                      '<span id="pinRadioCountBadge" style="font-family:\'Roboto Mono\',monospace; font-size:9.5px; color:var(--text-muted);"></span>' +
                    '</div>' +
                    '<a href="' + radioDirectUrl + '" class="pin-caption-radio-chip" style="text-decoration:none; padding:4px 10px;">' +
                      MIN_SVG.radioWave + ' <span>Радио гонки</span>' +
                    '</a>' +
                  '</div>' +

                  '<div id="hubModalChatStream" style="display:flex; flex-direction:column; gap:6px;">' +
                    '<div style="padding:6px; text-align:center; color:var(--text-muted); font-size:12px;">Загрузка эфира...</div>' +
                  '</div>' +
                '</div>' +
              '</div>' +

              '<div class="pin-bottom-dock">' +
                '<div class="pin-comment-pill">' +
                  '<input type="text" id="hubModalChatInput" class="pin-comment-input" ' +
                    'placeholder="Выйти в эфир гонки..." ' +
                    'onkeydown="if(event.key===\'Enter\') window.sotkaHub.sendModalChatMessage(\'' + chatIdStr + '\', \'' + radioDirectUrl + '\')">' +
                  '<button type="button" class="pin-dock-icon-btn" onclick="window.sotkaHub.openCreateRadarModal()" title="Сигнал Радара GPS">' + MIN_SVG.radar + '</button>' +
                  '<button type="button" class="pin-dock-send-btn" onclick="window.sotkaHub.sendModalChatMessage(\'' + chatIdStr + '\', \'' + radioDirectUrl + '\')" title="Отправить">' +
                    MIN_SVG.send +
                  '</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<aside class="pin-side-related-col">' +
            relatedHtml +
          '</aside>' +
        '</div>';

      var posterImg = document.getElementById('pinMainPosterImg');
      if (posterImg) {
        if (posterImg.complete) syncPinHeightToPoster();
        else posterImg.addEventListener('load', syncPinHeightToPoster);
      } else {
        syncPinHeightToPoster();
      }

      await this.refreshPinRadioStream(chatIdStr, radioDirectUrl);
    },

    refreshPinRadioStream: async function(chatId, radioDirectUrl) {
      var self = this;
      var streamEl = document.getElementById('hubModalChatStream');
      var countBadge = document.getElementById('pinRadioCountBadge');
      if (!streamEl) return;

      if (!chatId) {
        streamEl.innerHTML = '<div style="padding:6px; text-align:center; color:var(--text-muted); font-size:12px;">Обсуждение доступно в Радио гонки</div>';
        return;
      }

      var msgsRes = await this.pb.collection('messages').getList(1, 3, {
        filter: 'chat_id="' + chatId + '"',
        sort: '-created',
        expand: 'sender_id',
        requestKey: null
      }).catch(function() { return { items: [], totalItems: 0 }; });

      var msgs = (msgsRes.items || []).reverse();
      if (countBadge) countBadge.innerText = msgsRes.totalItems ? ('(' + msgsRes.totalItems + ')') : '';

      if (msgs.length === 0) {
        streamEl.innerHTML = '<div style="padding:8px; text-align:center; color:var(--text-muted); font-size:12px;">В эфире пока тихо — напишите первым</div>';
        return;
      }

      var listHtml = msgs.map(function(m) {
        var s = (m.expand && m.expand.sender_id) ? m.expand.sender_id : {};
        var sName = ((s.first_name || '') + ' ' + (s.last_name || '')).trim() || 'VILKA MOTO';
        var fChar = s.first_name ? s.first_name[0] : 'V';
        var lChar = s.last_name ? s.last_name[0] : 'M';
        var avInner = (fChar + lChar).toUpperCase();
        if (s.avatar && s.id) {
          var avFile = Array.isArray(s.avatar) ? s.avatar[0] : s.avatar;
          avInner = '<img src="https://vilka.sotka.one/api/files/riders/' + s.id + '/' + avFile + '" alt="AV">';
        }
        var cleanTxt = (m.text || '').replace(/\[ACTION:[^\]]+\]/g, '').trim();
        var msgTime = new Date(m.created).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

        return '<div class="pin-msg-bubble">' +
          '<div class="pin-msg-av">' + avInner + '</div>' +
          '<div style="flex:1; min-width:0;">' +
            '<div style="display:flex; justify-content:space-between; gap:6px; margin-bottom:2px;">' +
              '<span style="font-family:\'Unbounded\',sans-serif; font-size:9px; font-weight:800;">' + self.escapeHTML(sName) + '</span>' +
              '<span style="font-family:\'Roboto Mono\',monospace; font-size:8.5px; color:var(--text-muted);">' + msgTime + '</span>' +
            '</div>' +
            '<div style="font-size:12.5px; line-height:1.35; overflow-wrap:break-word;">' + self.formatBriefingHtml(cleanTxt) + '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      if (msgsRes.totalItems > 3 && radioDirectUrl) {
        listHtml += '<a href="' + radioDirectUrl + '" style="font-family:\'Unbounded\',sans-serif; font-size:9px; font-weight:800; color:#111111; text-decoration:none; text-align:center; padding:4px;">Открыть все сообщения (' + msgsRes.totalItems + ') в Радио гонки</a>';
      }

      streamEl.innerHTML = listHtml;
    },

    sendModalChatMessage: async function(chatId, radioDirectUrl) {
      if (!chatId && radioDirectUrl) {
        window.location.href = radioDirectUrl;
        return;
      }
      if (this.isGuest || !this.currentRider) return this.openLoginModal();
      var inp = document.getElementById('hubModalChatInput');
      var txt = (inp && inp.value ? inp.value : '').trim();
      if (!txt) {
        if (radioDirectUrl) window.location.href = radioDirectUrl;
        return;
      }
      inp.value = '';
      try {
        await this.pb.collection('messages').create({
          chat_id: chatId,
          sender_id: this.currentRider.id,
          text: txt
        }, { requestKey: null });
        await this.refreshPinRadioStream(chatId, radioDirectUrl);
      } catch (e) {
        alert('Ошибка отправки: ' + e.message);
      }
    }
  });
})();
</script>

</body>
</html>
