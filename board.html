      url += (url.includes('?') ? '&' : '?') + 'nocache=' + Date.now();
      return { url, options };
    };

    this.currentRider = null;
    this.isGuest = true;
    this.userRoles = [];
    this.walletBalance = 0;

    this.races = [];
    this.racesById = {};
    this.rosters = [];
    this.ridersMap = {};
    this.myRostersMap = {};
    this.rosterCounts = {};
    this.teamsMap = {};
    this.pelotonsList = [];
    this.postersMap = {};
    this.announcements = [];
    this.chatsList = [];
    this.chatsById = {};
    this.chatsByRaceId = {};

    this.activeTag = 'all';
    this.selectedPelotonId = 'all';
    this.selectedSport = 'all';
    this.selectedSeasonYear = 'all';
    this.searchQuery = '';
    this.allPins = [];
    this.activeDrawer = null;
    this.pendingGpxTrack = null;
    this.isCalendarViewOpen = false;
    this.boardCalDate = new Date();

    if (localStorage.getItem('sotka_rail_pos') === 'right') {
      document.body.classList.add('rail-right');
    }

    window.addEventListener('resize', () => {
      clearTimeout(this._resizeTimer);
      this._resizeTimer = setTimeout(() => this.renderGrid(), 120);
    });

    document.addEventListener('click', () => {
      const pop = document.getElementById('pinAccountPopover');
      if (pop) pop.classList.remove('open');
    });
  }

  escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  showToast(msg) {
    const t = document.getElementById('hubToast');
    if (!t) return;
    t.innerHTML = `${ICONS.check} <span>${this.escapeHTML(msg)}</span>`;
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  getColumnsCount() {
    const w = window.innerWidth;
    if (w > 1480) return 5;
    if (w > 1100) return 4;
    if (w > 740) return 3;
    return 2;
  }

  formatBriefingHtml(rawText) {
    if (!rawText) return '';
    let safe = this.escapeHTML(rawText);
    safe = safe
      .replace(/&lt;b&gt;/gi, '<b>').replace(/&lt;\/b&gt;/gi, '</b>')
      .replace(/&lt;strong&gt;/gi, '<b>').replace(/&lt;\/strong&gt;/gi, '</b>')
      .replace(/&lt;i&gt;/gi, '<i>').replace(/&lt;\/i&gt;/gi, '</i>')
      .replace(/&lt;u&gt;/gi, '<u>').replace(/&lt;\/u&gt;/gi, '</u>')
      .replace(/&lt;br\s*\/?&gt;/gi, '<br>');
    safe = safe.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    safe = safe.replace(/(https?:\/\/[^\s<]+)/gi, '<a href="$1" target="_blank" style="color:#d97706;text-decoration:underline;font-weight:700;">$1</a>');
    return safe;
  }

  canManageOtherRiders() {
    if (this.isGuest || !this.currentRider) return false;
    const uRoles = Array.isArray(this.userRoles) ? this.userRoles : [];
    const rRoles = Array.isArray(this.currentRider.roles) ? this.currentRider.roles : (this.currentRider.roles ? [this.currentRider.roles] : []);
    const all = uRoles.concat(rRoles);
    return all.some(role => ['superadmin', 'admin', 'judge', 'captain'].includes(String(role).toLowerCase()));
  }

  canEditRace(raceOrId) {
    if (this.isGuest || !this.currentRider) return false;
    const r = (typeof raceOrId === 'object' && raceOrId) ? raceOrId : this.racesById[raceOrId];
    const uRoles = Array.isArray(this.userRoles) ? this.userRoles : [];
    const rRoles = Array.isArray(this.currentRider.roles) ? this.currentRider.roles : (this.currentRider.roles ? [this.currentRider.roles] : []);
    const all = uRoles.concat(rRoles).map(x => String(x).toLowerCase());
    if (all.includes('superadmin') || all.includes('admin') || all.includes('judge')) return true;
    if (r && r.creator_id && (r.creator_id === this.currentRider.id || (this.pb.authStore.model && r.creator_id === this.pb.authStore.model.id))) {
      return true;
    }
    return false;
  }

  openEventRadio(raceId, event) {
    if (event) {
      event.stopPropagation();
      event.preventDefault();
    }
    let chat = this.chatsByRaceId[raceId];
    const r = this.racesById[raceId];
    if (!chat && r) {
      const baseName = r.name && r.name.includes('[') ? r.name.split('[')[0].trim() : r.name;
      const dayStr = r.date ? String(r.date).slice(0, 10) : '';
      const sister = this.races.find(sr => {
        const srBase = sr.name && sr.name.includes('[') ? sr.name.split('[')[0].trim() : sr.name;
        const srDay = sr.date ? String(sr.date).slice(0, 10) : '';
        return srBase.toLowerCase() === baseName.toLowerCase() && srDay === dayStr && this.chatsByRaceId[sr.id];
      });
      if (sister) chat = this.chatsByRaceId[sister.id];
    }
    if (chat) {
      window.location.href = chat.slug ? `https://vilka.sotka.one/#${chat.slug}` : `https://vilka.sotka.one/?chat=${chat.id}`;
    } else {
      window.location.href = `https://vilka.sotka.one/#${raceId}`;
    }
  }

  resolveAnnouncementSource(msg) {
    if (!msg) return 'СОБЫТИЕ СОТКИ';
    const chatId = Array.isArray(msg.chat_id) ? msg.chat_id[0] : msg.chat_id;
    const chat = this.chatsById[chatId] || msg.expand?.chat_id;

    if (chat) {
      const rId = Array.isArray(chat.race_id) ? chat.race_id[0] : chat.race_id;
      const race = rId ? this.racesById[rId] : null;
      if (race && race.name) {
        return race.name.includes('[') ? race.name.split('[')[0].trim() : race.name.trim();
      }
      const tId = Array.isArray(chat.team_id) ? chat.team_id[0] : chat.team_id;
      const team = tId ? this.teamsMap[tId] : null;
      if (team && team.name) return team.name.trim();
      if (chat.name) {
        return chat.name.replace(/\s+\d{1,2}\s+[а-яА-Я]+\s+\d{1,2}:\d{2}$/i, '').trim();
      }
    }

    const actionMatch = (msg.text || '').match(/\[ACTION:(?:REGISTER|LIVE):([a-zA-Z0-9_]+)\]/);
    if (actionMatch && actionMatch[1] && this.racesById[actionMatch[1]]) {
      const rName = this.racesById[actionMatch[1]].name;
      return rName.includes('[') ? rName.split('[')[0].trim() : rName;
    }

    return 'СОБЫТИЕ ПЕЛОТОНА';
  }

  getRacePinAlias(raceId) {
    const r = this.racesById[raceId];
    if (!r) return raceId;
    let chat = this.chatsByRaceId[raceId];
    if (!chat) {
      const baseName = (r.name && r.name.includes('[')) ? r.name.split('[')[0].trim().toLowerCase() : (r.name || '').trim().toLowerCase();
      const dayStr = r.date ? String(r.date).slice(0, 10) : '';
      for (let i = 0; i < this.races.length; i++) {
        const sr = this.races[i];
        const srBase = (sr.name && sr.name.includes('[')) ? sr.name.split('[')[0].trim().toLowerCase() : (sr.name || '').trim().toLowerCase();
        const srDay = sr.date ? String(sr.date).slice(0, 10) : '';
        if (srBase === baseName && srDay === dayStr && this.chatsByRaceId[sr.id]) {
          chat = this.chatsByRaceId[sr.id];
          break;
        }
      }
    }
    if (chat && chat.slug && String(chat.slug).trim()) {
      return String(chat.slug).trim();
    }
    return raceId;
  }

  resolveRaceIdFromHash(rawHash) {
    const clean = decodeURIComponent(String(rawHash || '')).replace(/^#\/?/, '').trim();
    if (!clean) return null;
    const low = clean.toLowerCase();

    if (this.racesById[clean]) return clean;

    for (let i = 0; i < this.chatsList.length; i++) {
      const c = this.chatsList[i];
      if (!c || !c.race_id) continue;
      const cSlug = String(c.slug || '').trim().toLowerCase();
      if ((cSlug && cSlug === low) || String(c.id).toLowerCase() === low || String(c.race_id).toLowerCase() === low) {
        const rId = Array.isArray(c.race_id) ? c.race_id[0] : c.race_id;
        if (this.racesById[rId]) return rId;
      }
    }

    for (let j = 0; j < this.races.length; j++) {
      const r = this.races[j];
      if (String(r.id).toLowerCase() === low) return r.id;
    }

    return null;
  }

  async handleUrlHashRouting() {
    stripBoardHtmlFromUrl();
    const hash = window.location.hash;
    if (!hash || hash === '#') {
      if (this._modalRaceContext || document.body.classList.contains('pin-view-open')) {
        this.closeInlinePin(true);
      }
      return false;
    }
    const cleanHash = decodeURIComponent(hash).replace(/^#\/?/, '').trim().toLowerCase();
    if (cleanHash === 'superreg') {
      await this.openSuperRegPin(true);
      return true;
    }
    const targetRaceId = this.resolveRaceIdFromHash(hash);
    if (targetRaceId) {
      if (!this._modalRaceContext || this._modalRaceContext.activeRace.id !== targetRaceId) {
        await this.openRaceHubModal(targetRaceId, 'briefing', true);
      }
      return true;
    }
    return false;
  }

  bindHistoryRouter() {
    if (this._historyRouterBound) return;
    this._historyRouterBound = true;

    window.addEventListener('popstate', () => {
      stripBoardHtmlFromUrl();

      const liveModal = document.getElementById('liveBoardModal');
      if (liveModal && liveModal.style.display === 'flex') {
        if (window.app && window.app.crm) window.app.crm.closeLiveBoard();
        else liveModal.style.display = 'none';
        return;
      }
      const track3DModal = document.getElementById('race3DTrackModal');
      if (track3DModal && track3DModal.style.display === 'flex') {
        if (window.app && typeof window.app.close3DTrackModal === 'function') window.app.close3DTrackModal();
        else track3DModal.style.display = 'none';
        return;
      }
      const mapModal = document.getElementById('mapEmbedModal');
      if (mapModal && mapModal.style.display === 'flex') {
        mapModal.style.display = 'none';
        return;
      }
      const qrModal = document.getElementById('hubQrModal');
      if (qrModal && qrModal.style.display === 'flex') {
        qrModal.style.display = 'none';
        return;
      }

      this.handleUrlHashRouting();
    });
  }

 async start() {
    stripBoardHtmlFromUrl();
    this.bindHistoryRouter();
    this.updateCalendarToggleUI();

    try {
      const authCookieMatch = document.cookie.match(/(?:^|;\s*)pb_auth=([^;]+)/);
      const hasAuthCookie = Boolean(authCookieMatch && authCookieMatch[1] && authCookieMatch[1].trim() !== '');
      if (hasAuthCookie) {
        this.pb.authStore.loadFromCookie(document.cookie, 'pb_auth');
        const cachedRiderStr = localStorage.getItem('vilka_cached_rider');
        if (cachedRiderStr && this.pb.authStore.isValid) {
          this.currentRider = JSON.parse(cachedRiderStr);
          this.isGuest = false;
          const authModel = this.pb.authStore.model || this.pb.authStore.record;
          if (authModel && authModel.role) {
            this.userRoles = Array.isArray(authModel.role) ? authModel.role : [authModel.role];
          }
          this.renderHeaderIdentity();
        }
      }
    } catch (e) {}

    let openedFromCacheHash = false;
    try {
      const snapStr = localStorage.getItem(BOARD_CACHE_KEY);
      if (snapStr) {
        const snap = JSON.parse(snapStr);
        if (snap && Array.isArray(snap.races) && snap.races.length > 0) {
          this.walletBalance = snap.walletBalance || 0;
          this.applyEcosystemPayload(snap);
          if (window.location.hash && window.location.hash.length > 1) {
            openedFromCacheHash = await this.handleUrlHashRouting();
          }
        }
      }
    } catch (e) {}

    await Promise.all([
      this.initAuth(),
      this.loadEcosystem()
    ]);

    // Подхват владельца личного домена (например, timo.sotka.one) или пелотона
    if (typeof this.resolveSubdomainOwner === 'function') {
      await this.resolveSubdomainOwner();
    }

    if (!openedFromCacheHash && window.location.hash && window.location.hash.length > 1) {
      await this.handleUrlHashRouting();
    } else if (this._modalRaceContext) {
      const freshRace = this.racesById[this._modalRaceContext.activeRace.id];
      if (freshRace) {
        this._modalRaceContext.activeRace = freshRace;
        await this.renderRaceHubModalContent();
      }
    }

    setTimeout(() => {
      ensureVilkaEngineReady(this);
    }, 1200);
  }
  async initAuth() {
    const authCookieMatch = document.cookie.match(/(?:^|;\s*)pb_auth=([^;]+)/);
    const hasAuthCookie = Boolean(authCookieMatch && authCookieMatch[1] && authCookieMatch[1].trim() !== '');

    if (!hasAuthCookie) {
      this.pb.authStore.clear();
      localStorage.removeItem('pocketbase_auth');
      localStorage.removeItem('vilka_cached_rider');
      this.isGuest = true;

      const savedGuestId = localStorage.getItem('vilka_guest_id');
      if (savedGuestId) {
        try {
          this.currentRider = await this.pb.collection('riders').getOne(savedGuestId, { requestKey: null });
        } catch (e) {
          this.currentRider = null;
          localStorage.removeItem('vilka_guest_id');
        }
      } else {
        this.currentRider = null;
      }

      this.renderHeaderIdentity();
      return;
    }

    try {
      this.pb.authStore.loadFromCookie(document.cookie, 'pb_auth');
    } catch (e) {}

    if (!this.pb.authStore.isValid || !this.pb.authStore.token) {
      this.pb.authStore.clear();
      localStorage.removeItem('pocketbase_auth');
      localStorage.removeItem('vilka_cached_rider');
      this.currentRider = null;
      this.isGuest = true;
      this.renderHeaderIdentity();
      return;
    }

    try {
      await this.pb.collection('users').authRefresh({ requestKey: null });
      const authModel = this.pb.authStore.model || this.pb.authStore.record;
      if (authModel) {
        this.isGuest = false;
        this.userRoles = Array.isArray(authModel.role) ? authModel.role : (authModel.role ? [authModel.role] : []);
        const freshRider = await this.pb.collection('riders').getFirstListItem(
          `user_id="${authModel.id}" || email="${authModel.email}"`,
          { requestKey: null }
        );
        if (freshRider) {
          this.currentRider = freshRider;
          localStorage.setItem('vilka_cached_rider', JSON.stringify(freshRider));
        }
      }
    } catch (err) {
      this.pb.authStore.clear();
      localStorage.removeItem('pocketbase_auth');
      localStorage.removeItem('vilka_cached_rider');
      this.currentRider = null;
      this.isGuest = true;
    }

    this.renderHeaderIdentity();
  }

  renderHeaderIdentity() {
    const avEl = document.getElementById('hubUserAv');
    if (!avEl) return;

    if (!this.isGuest && this.currentRider) {
      if (this.currentRider.avatar) {
        const avFile = Array.isArray(this.currentRider.avatar) ? this.currentRider.avatar[0] : this.currentRider.avatar;
        avEl.innerHTML = `<img src="https://vilka.sotka.one/api/files/riders/${this.currentRider.id}/${avFile}" alt="AV">`;
      } else {
        avEl.innerText = ((this.currentRider.first_name?.[0] || 'A') + (this.currentRider.last_name?.[0] || '')).toUpperCase();
      }
    } else {
      avEl.innerHTML = `<img src="${DUCK_SVG_URL}" style="width:20px; height:20px; object-fit:contain;" alt="Guest">`;
    }
  }

  async loadEcosystem() {
    try {
      const uid = (!this.isGuest && this.pb.authStore.model) ? this.pb.authStore.model.id : null;

      const results = await Promise.all([
        this.pb.collection('races').getFullList({
          sort: 'date',
          fields: 'id,name,date,sport,surface,format,distance,laps,status,price,peloton_id,creator_id,is_public,level,cat_logic,live_board',
          requestKey: null
        }).catch(() => []),
        this.pb.collection('race_rosters').getFullList({
          filter: 'status != "canceled"',
          fields: 'id,race_id,rider_id,bib,planned_start,is_paid,status,final_cluster,time_ms,speed,earned_points',
          requestKey: null
        }).catch(() => []),
        this.pb.collection('teams').getFullList({
          sort: '-points',
          fields: 'id,name,points,peloton_id,avatar',
          requestKey: null
        }).catch(() => []),
        this.pb.collection('messages').getList(1, 35, {
          filter: 'is_announcement = true',
          sort: '-created',
          expand: 'chat_id',
          requestKey: null
        }).catch(() => ({ items: [] })),
        this.pb.collection('chats').getFullList({
          filter: 'type = "global" || type = "team_channel"',
          fields: 'id,collectionId,name,type,race_id,team_id,panel_image,slug,panel_data',
          sort: '-updated',
          requestKey: null
        }).catch(() => []),
        this.pb.collection('pelotons').getFullList({
          fields: 'id,name,slug,is_private,admin_id,allowed_teams,allowed_riders,avatar,sports',
          sort: 'name',
          requestKey: null
        }).catch(() => []),
        uid
          ? this.pb.collection('draft_wallets').getFirstListItem(`user_id="${uid}"`, { requestKey: null }).catch(() => null)
          : Promise.resolve(null)
      ]);

      const wallet = results[6];
      if (wallet && wallet.balances) {
        this.walletBalance = Object.values(wallet.balances).reduce((a, b) => a + Number(b || 0), 0);
      }

      const payload = {
        races: results[0] || [],
        rosters: results[1] || [],
        teams: results[2] || [],
        announcements: (results[3] && results[3].items) ? results[3].items : [],
        chats: results[4] || [],
        pelotons: results[5] || [],
        walletBalance: this.walletBalance
      };

      this.applyEcosystemPayload(payload);

      try {
        localStorage.setItem(BOARD_CACHE_KEY, JSON.stringify(payload));
      } catch (e) {}
    } catch (err) {
      console.error('Ошибка синхронизации с PocketBase:', err);
    }
  }

  applyEcosystemPayload(data) {
    this.races = data.races || [];
    this.racesById = {};
    this.races.forEach(r => { this.racesById[r.id] = r; });

    this.rosters = data.rosters || [];
    this.pelotonsList = data.pelotons || [];
    this.pelotonsById = {};
    this.pelotonsList.forEach(p => { this.pelotonsById[p.id] = p; });
    this.chatsList = data.chats || [];
    this.announcements = data.announcements || [];

    this.updateNotifBadge();

    this.teamsMap = {};
    (data.teams || []).forEach(t => { this.teamsMap[t.id] = t; });

    this.rosterCounts = {};
    this.myRostersMap = {};
    if (this.subdomainOwnerRider) this.ownerRostersMap = {};
    this.rosters.forEach(r => {
      if (r.race_id) {
        this.rosterCounts[r.race_id] = (this.rosterCounts[r.race_id] || 0) + 1;
        if (this.currentRider && r.rider_id === this.currentRider.id) {
          this.myRostersMap[r.race_id] = r;
        }
        if (this.subdomainOwnerRider && r.rider_id === this.subdomainOwnerRider.id) {
          this.ownerRostersMap[r.race_id] = r;
        }
      }
    });

    this.chatsById = {};
    this.chatsByRaceId = {};
    (data.chats || []).forEach(c => {
      this.chatsById[c.id] = c;
      if (c.race_id) this.chatsByRaceId[c.race_id] = c;
    });

    this.postersMap = {};
    (data.announcements || []).forEach(m => {
      if (m.file && m.chat_id && !this.postersMap[m.chat_id]) {
        this.postersMap[m.chat_id] = m;
      }
    });

    this.buildPinsStream();
    this.renderGrid();
    if (this.isCalendarViewOpen) {
      this.renderBoardMonthCalendar(this.boardCalDate || new Date());
    }
  }

  updateNotifBadge() {
    const notifBadge = document.getElementById('railNotifBadge');
    if (!notifBadge) return;

    const seenTs = Number(localStorage.getItem('sotka_notif_seen_ts') || 0);
    const unreadCount = (this.announcements || []).filter(m => {
      const mTs = new Date(m.created || 0).getTime() || 0;
      return mTs > seenTs;
    }).length;

    if (unreadCount > 0) {
      notifBadge.innerText = unreadCount > 9 ? '9+' : String(unreadCount);
      notifBadge.style.display = 'flex';
    } else {
      notifBadge.style.display = 'none';
    }
  }

  goHome() {
    this._returnToCalendarOnClose = false;
    this.closeInlinePin();
    if (this.isCalendarViewOpen) {
      this.toggleBoardCalendarView(false);
    }
    this.closeDrawers();
    this.activeTag = 'all';
    this.selectedPelotonId = 'all';
    this.selectedSport = 'all';
    this.selectedSeasonYear = 'all';
    this.searchQuery = '';
    const inp = document.getElementById('hubSearchInput');
    if (inp) inp.value = '';
    document.querySelectorAll('.hub-tag').forEach((b, i) => b.classList.toggle('active', i === 0));
    this.buildPinsStream();
    this.renderGrid();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  
  // Человекочитаемое название любого покрытия/дисциплины (включая новые из БД)
  getSurfaceLabel(surfaceKey) {
    const key = String(surfaceKey || 'road').toLowerCase().trim();
    if (TAG_CATALOG[key]) return TAG_CATALOG[key].label.toUpperCase();
    return key ? key.toUpperCase() : 'ВЕЛОГОНКА';
  }

  // Определение тренировки по уровню или ключевым словам
  isTrainingEvent(r) {
    if (!r) return false;
    const lvl = String(r.level || '').toLowerCase();
    const fmt = String(r.format || '').toLowerCase();
    const nm = String(r.name || '').toLowerCase();
    return lvl === 'training' || fmt === 'training' || /тренир|кофе-?райд|прикидк|coffee/i.test(nm);
  }

  // Единый сборщик всех тегов для гонки/группы дистанций (с удержанием 5 дней после финиша)
  getRaceTags(r, opts = {}) {
    if (!r) return [];
    const sisters = opts.sisters || [r];
    const nowMs = new Date().setHours(0, 0, 0, 0);
    const dMs = new Date(r.date || 0).getTime() || 0;

    const isLive = sisters.some(s => s.status === 'LIVE');
    const isFinished = sisters.every(s => s.status === 'Finished' || s.status === 'Завершена');
    // В фильтр «Ближайшие старты» попадают только LIVE и предстоящие (не завершённые) гонки
    const isUpcoming = isLive || (!isFinished && dMs >= nowMs);
    const isPinnedOrMy = opts.isPinnedOrMy !== undefined
      ? opts.isPinnedOrMy
      : sisters.some(s => this.isRacePinned(s.id) || Boolean(this.myRostersMap[s.id]));

    let hasGpx = Boolean(opts.hasGpx);
    if (!hasGpx) {
      hasGpx = sisters.some(sr => {
        try {
          const cl = typeof sr.cat_logic === 'string' ? JSON.parse(sr.cat_logic) : sr.cat_logic;
          return Boolean(cl?.track_data?.points?.length);
        } catch (e) { return false; }
      });
    }

    const tags = new Set();
    const surf = String(r.surface || 'road').toLowerCase().trim();
    if (surf) tags.add(surf);

    if (this.isTrainingEvent(r)) tags.add('training');
    if (hasGpx) tags.add('gpx');
    if (isPinnedOrMy) tags.add('my');
    tags.add(isUpcoming ? 'upcoming' : 'archive');

    return Array.from(tags);
  }

setSport(sportKey) {
    this.selectedSport = (this.selectedSport === sportKey) ? 'all' : sportKey;
    this.buildPinsStream();
    this.renderGrid();
    if (this.isCalendarViewOpen) {
      this.renderBoardMonthCalendar(this.boardCalDate || new Date());
    }
  }

  renderFilterTagsBar() {
    const wrap = document.getElementById('hubTagButtons');
    if (!wrap) return;

    const tagCounts = {};
    (this.allPins || []).forEach(p => {
      (p.tagGroups || []).forEach(t => {
        tagCounts[t] = (tagCounts[t] || 0) + 1;
      });
    });

    // Собираем все известные + любые новые дисциплины, пришедшие из БД
    const allKeys = new Set(Object.keys(TAG_CATALOG));
    Object.keys(tagCounts).forEach(k => allKeys.add(k));

    const sortedKeys = Array.from(allKeys).sort((a, b) => {
      const ordA = TAG_CATALOG[a]?.order ?? 50;
      const ordB = TAG_CATALOG[b]?.order ?? 50;
      return ordA - ordB;
    });

    // Если активный тег опустел после смены фильтра пелотона/года — сбрасываем на «Все»
    if (this.activeTag !== 'all' && !TAG_CATALOG[this.activeTag]?.always && !tagCounts[this.activeTag]) {
      this.activeTag = 'all';
    }

    // 1. Собираем виды спорта из выбранного пелотона и из стартов в БД
    const availableSports = new Set();
    if (this.selectedPelotonId && this.selectedPelotonId !== 'all' && this.pelotonsById?.[this.selectedPelotonId]) {
      const pSports = this.pelotonsById[this.selectedPelotonId].sports;
      if (Array.isArray(pSports)) pSports.forEach(s => { if (s) availableSports.add(String(s).toLowerCase().trim()); });
      else if (typeof pSports === 'string' && pSports.trim()) availableSports.add(pSports.toLowerCase().trim());
    }

    (this.races || []).forEach(r => {
      if (this.selectedPelotonId !== 'all') {
        const pId = Array.isArray(r.peloton_id) ? r.peloton_id[0] : r.peloton_id;
        if (pId !== this.selectedPelotonId) return;
      }
      availableSports.add(String(r.sport || 'cycling').toLowerCase().trim());
    });

    if (availableSports.size === 0) availableSports.add('cycling');
    const sportsArr = Array.from(availableSports);

    // 2. Если видов спорта больше одного — рисуем кнопки переключения спорта слева от «Все»
    const SPORT_LABELS = { cycling: 'Вело', run: 'Бег', ski: 'Лыжи', swim: 'Плавание', triathlon: 'Триатлон' };
    const curSport = this.selectedSport || 'all';
    let sportSwitcherHtml = '';

    if (sportsArr.length > 1) {
      sportSwitcherHtml = sportsArr.map(sp => {
        const isSpAct = curSport === sp ? ' active' : '';
        return `<button type="button" class="hub-tag${isSpAct}" style="display:inline-flex; align-items:center; gap:6px;" onclick="window.sotkaHub.setSport('${this.escapeHTML(sp)}')">
          ${SPORT_ICONS[sp] || ''}
          <span>${this.escapeHTML(SPORT_LABELS[sp] || sp)}</span>
        </button>`;
      }).join('') + `<div style="width:1px; height:20px; background:var(--border-light); margin:0 4px; flex-shrink:0;"></div>`;
    }

    // 3. Иконка для кнопки «Все»
    const allBtnIconHtml = (curSport !== 'all' && SPORT_ICONS[curSport])
      ? SPORT_ICONS[curSport]
      : (SPORT_ICONS[sportsArr[0]] || SPORT_ICONS.cycling);

    wrap.innerHTML = sportSwitcherHtml + sortedKeys
      .filter(key => TAG_CATALOG[key]?.always || (tagCounts[key] && tagCounts[key] > 0))
      .map(key => {
        const meta = TAG_CATALOG[key] || { label: key.charAt(0).toUpperCase() + key.slice(1) };
        const isAct = this.activeTag === key ? ' active' : '';
        const cnt = tagCounts[key] || 0;
        const showCnt = key !== 'all' && cnt > 0;
        const iconHtml = key === 'all' ? allBtnIconHtml : (meta.icon || '');
        return `<button type="button" class="hub-tag${isAct}" style="display:inline-flex; align-items:center; gap:6px;" onclick="window.sotkaHub.setTag('${this.escapeHTML(key)}', this)">
          ${iconHtml}
          <span>${this.escapeHTML(meta.label)}</span>
          ${showCnt ? `<span style="opacity:0.65; font-size:11.5px; font-family:'Roboto Mono',monospace;">${cnt}</span>` : ''}
        </button>`;
      }).join('');
  }
  setTag(tag, btn) {
    this.closeInlinePin();
    this.activeTag = tag;
    document.querySelectorAll('.hub-tag').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    this.renderGrid();
    if (this.isCalendarViewOpen) {
      if (this.searchQuery) {
        this.autoJumpCalendarToSearchMatch(this.searchQuery);
      }
      this.renderBoardMonthCalendar(this.boardCalDate || new Date());
    }
  }

  onSearch(val) {
    this.searchQuery = (val || '').toLowerCase().trim();
    this.renderGrid();
    if (this.isCalendarViewOpen) {
      if (val && val.trim().length >= 2) {
        this.autoJumpCalendarToSearchMatch(val);
      }
      this.renderBoardMonthCalendar(this.boardCalDate || new Date());
    }
  }

  shareRace(raceId) {
    const alias = this.getRacePinAlias(raceId);
    const url = `${window.location.origin}/#${alias}`;
    navigator.clipboard.writeText(url).then(() => {
      this.showToast('Ссылка скопирована: ' + url.replace(/^https?:\/\//, ''));
    });
  }

  // =====================================================================
  // КАЛЕНДАРЬ МЕСЯЦА С УТОЧКАМИ НА САП-БОРДАХ И ДВУМЯ КАПСУЛАМИ
  // =====================================================================
  updateCalendarToggleUI() {
    const isCal = Boolean(this.isCalendarViewOpen);
    const topBtn = document.getElementById('hubTopCalBtn');
    if (topBtn) {
      topBtn.classList.toggle('active', isCal);
      topBtn.innerHTML = isCal
        ? `${MIN_SVG.pinsGrid} <span>ПИНЫ</span>`
        : `${MIN_SVG.calGrid} <span>СЕТКА</span>`;
    }
    const railCalBtn = document.getElementById('railBtn-calendar');
    const railHomeBtn = document.getElementById('railBtn-home');
    if (railCalBtn) railCalBtn.classList.toggle('active', isCal);
    if (railHomeBtn && !this.activeDrawer) railHomeBtn.classList.toggle('active', !isCal);
  }

  centerActiveCalPills(smooth = true) {
    setTimeout(() => {
      ['bcalMonthsCapsuleWrap', 'bcalYearsCapsuleWrap'].forEach(wrapId => {
        const wrap = document.getElementById(wrapId);
        if (!wrap) return;
        const activeBtn = wrap.querySelector('.bcal-pill-btn.active');
        if (!activeBtn) return;
        const wrapRect = wrap.getBoundingClientRect();
        const btnRect = activeBtn.getBoundingClientRect();
        const targetLeft = wrap.scrollLeft + (btnRect.left - wrapRect.left) - (wrap.clientWidth / 2) + (btnRect.width / 2);
        wrap.scrollTo({
          left: Math.max(0, targetLeft),
          behavior: smooth === false ? 'auto' : 'smooth'
        });
      });
    }, 30);
  }

  toggleBoardCalendarView(forceState) {
    this.closeDrawers();
    if (this._modalRaceContext || document.body.classList.contains('pin-view-open')) {
      this.closeInlinePin();
    }
    const nextState = (typeof forceState === 'boolean') ? forceState : !this.isCalendarViewOpen;
    this.isCalendarViewOpen = nextState;

    const calWrap = document.getElementById('boardMonthCalendarWrap');
    if (nextState) {
      document.body.classList.add('cal-view-open');
      if (calWrap) calWrap.classList.add('open');
      if (this.searchQuery) {
        this.autoJumpCalendarToSearchMatch(this.searchQuery);
      }
      this.renderBoardMonthCalendar(this.boardCalDate || new Date());
    } else {
      document.body.classList.remove('cal-view-open');
      if (calWrap) {
        calWrap.classList.remove('open');
        calWrap.innerHTML = '';
      }
    }
    this.updateCalendarToggleUI();
  }

  setBoardCalMonth(monthIdx) {
    const cur = this.boardCalDate || new Date();
    this.renderBoardMonthCalendar(new Date(cur.getFullYear(), Number(monthIdx), 1));
  }

  changeBoardCalMonth(deltaMonths) {
    const cur = this.boardCalDate || new Date();
    this.renderBoardMonthCalendar(new Date(cur.getFullYear(), cur.getMonth() + deltaMonths, 1));
  }

  setBoardCalYear(yr) {
    const cur = this.boardCalDate || new Date();
    this.renderBoardMonthCalendar(new Date(Number(yr), cur.getMonth(), 1));
  }

  raceMatchesCalendarFilters(r) {
    if (!r || !r.date) return false;

    if (this.selectedPelotonId !== 'all') {
      const pId = Array.isArray(r.peloton_id) ? r.peloton_id[0] : r.peloton_id;
      if (pId !== this.selectedPelotonId) return false;
    }

    const rSport = String(r.sport || 'cycling').toLowerCase().trim();
    if (this.selectedSport && this.selectedSport !== 'all' && rSport !== this.selectedSport) return false;

    const nowMs = new Date().setHours(0, 0, 0, 0);
    const dMs = new Date(r.date).getTime() || 0;
    const isFinished = r.status === 'Finished';
    const isUpcoming = (r.status === 'LIVE') || (!isFinished && dMs >= nowMs);
    const isPinnedOrMy = this.isRacePinned(r.id) || Boolean(this.myRostersMap[r.id]);

    if (this.activeTag && this.activeTag !== 'all' && this.activeTag !== 'clubs') {
   const rTags = this.getRaceTags(r);
   if (!rTags.includes(this.activeTag)) return false;
 }

    if (this.searchQuery) {
      const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/^#/, '').trim();
      const q = norm(this.searchQuery);
      const tokens = q.split(/\s+/).filter(Boolean);
      if (tokens.length > 0) {
        const baseName = (r.name && r.name.includes('[')) ? r.name.split('[')[0].trim() : (r.name || '');
        const chat = this.chatsByRaceId[r.id];
        const slugStr = (chat && chat.slug) ? chat.slug : '';
        const chatName = (chat && chat.name) ? chat.name : '';
        const surfRu = { road: 'шоссе асфальт', offroad: 'грунт мтб грэвел гравий кросс велокросс cx xco', track: 'трек', indoor: 'индор станок' }[r.surface] || '';
        const hay = norm(`${baseName} ${r.name} ${slugStr} ${chatName} ${r.surface || ''} ${surfRu}`);
        if (!tokens.every(tk => hay.includes(tk))) return false;
      }
    }

    return true;
  }

  autoJumpCalendarToSearchMatch(rawQuery) {
    const q = String(rawQuery || '').trim();
    if (!q) return;

    const matchedRaces = (this.races || []).filter(r => this.raceMatchesCalendarFilters(r));
    if (matchedRaces.length === 0) return;

    const curDate = this.boardCalDate || new Date();
    const curY = curDate.getFullYear();
    const curM = curDate.getMonth();

    const alreadyInCurrentMonth = matchedRaces.some(r => {
      const d = new Date(r.date);
      return d.getFullYear() === curY && d.getMonth() === curM;
    });
    if (alreadyInCurrentMonth) return;

    const nowMs = Date.now();
    const upcoming = matchedRaces
      .filter(r => new Date(r.date).getTime() >= nowMs - 86400000)
      .sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());

    let bestRace = upcoming[0];
    if (!bestRace) {
      const past = matchedRaces.slice().sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
      bestRace = past[0];
    }

    if (bestRace && bestRace.date) {
      const bd = new Date(bestRace.date);
      if (!isNaN(bd.getTime())) {
        this.boardCalDate = new Date(bd.getFullYear(), bd.getMonth(), 1);
      }
    }
  }

  renderBoardMonthCalendar(targetDate) {
    const calWrap = document.getElementById('boardMonthCalendarWrap');
    if (!calWrap) return;

    this.boardCalDate = targetDate ? new Date(targetDate) : (this.boardCalDate || new Date());
    const year = this.boardCalDate.getFullYear();
    const month = this.boardCalDate.getMonth();
    const monthNames = ['ЯНВАРЬ', 'ФЕВРАЛЬ', 'МАРТ', 'АПРЕЛЬ', 'МАЙ', 'ИЮНЬ', 'ИЮЛЬ', 'АВГУСТ', 'СЕНТЯБРЬ', 'ОКТЯБРЬ', 'НОЯБРЬ', 'ДЕКАБРЬ'];

    const yearsSet = new Set([new Date().getFullYear(), new Date().getFullYear() + 1]);
    (this.races || []).forEach(r => {
      if (r.date) {
        const y = new Date(r.date).getFullYear();
        if (!isNaN(y) && y > 2020) yearsSet.add(y);
      }
    });
    const yearsList = Array.from(yearsSet).sort((a, b) => a - b);

    const groupedByDay = {};
    const monthEventCounts = new Array(12).fill(0);
    const seenEventKeys = new Set();

    const sortedRaces = (this.races || []).slice().sort((a, b) => (parseFloat(b.distance) || 0) - (parseFloat(a.distance) || 0));

    sortedRaces.forEach(r => {
      if (!this.raceMatchesCalendarFilters(r)) return;
      const dObj = new Date(r.date);
      if (isNaN(dObj.getTime())) return;

      const baseName = (r.name && r.name.includes('[')) ? r.name.split('[')[0].trim() : (r.name || 'Гонка').trim();
      const dateKey = `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
      const evKey = `${dateKey}_${baseName.toLowerCase()}`;

      if (seenEventKeys.has(evKey)) return;
      seenEventKeys.add(evKey);

      if (dObj.getFullYear() === year) {
        monthEventCounts[dObj.getMonth()]++;
      }

      if (!groupedByDay[dateKey]) groupedByDay[dateKey] = [];
      groupedByDay[dateKey].push({
        race: r,
        baseName,
        isFinished: r.status === 'Finished'
      });
    });

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDayIdx = (firstDay.getDay() + 6) % 7;
    const totalDays = lastDay.getDate();
    const prevMonthLast = new Date(year, month, 0).getDate();
    const todayKey = new Date().toISOString().slice(0, 10);

    let cellsHtml = '';
    for (let i = startDayIdx - 1; i >= 0; i--) {
      cellsHtml += `<div class="bcal-day other-month"><div class="bcal-day-top"><span class="bcal-day-num">${prevMonthLast - i}</span></div></div>`;
    }

    const surfaceLabels = { road: 'ШОССЕ', offroad: 'ГРУНТ', track: 'ТРЕК', indoor: 'ИНДОР' };

    for (let day = 1; day <= totalDays; day++) {
      const dKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const isToday = (dKey === todayKey);
      const dayEvents = groupedByDay[dKey] || [];
      const hasRaces = dayEvents.length > 0;

      const moreBadge = dayEvents.length > 2
        ? `<span class="bcal-more-badge" onclick="event.stopPropagation(); window.sotkaHub.openBoardDayAgendaModal('${dKey}')" title="Показать все старты дня">+${dayEvents.length - 2}</span>`
        : '';

      let pondHtml = '';
      if (hasRaces) {
        const visible = dayEvents.slice(0, 2);
        pondHtml = `<div class="bcal-pond">${visible.map(ev => {
          const r = ev.race;
          const sLbl = surfaceLabels[r.surface] || 'СТАРТ';
          const distLbl = r.distance ? `${r.distance} КМ` : '';
          const tooltipStr = [ev.baseName.toUpperCase(), sLbl, distLbl].filter(Boolean).join(' • ');
          const extraCls = ev.isFinished ? ' is-finished' : '';

          return `<div class="bcal-sup-unit${extraCls}" onclick="event.stopPropagation(); window.sotkaHub.openPinFromCalendar('${r.id}')" title="${this.escapeHTML(tooltipStr)}">
            <img src="${DUCK_SVG_URL}" class="bcal-duck-rider" alt="Duck">
            <div class="bcal-sup-board">
              <span class="bcal-sup-text">${this.escapeHTML(ev.baseName.toUpperCase())}</span>
            </div>
          </div>`;
        }).join('')}</div>`;
      } else {
        pondHtml = `
          <div class="bcal-empty-slot">
            <div class="bcal-empty-plus">+</div>
            <span class="bcal-empty-label">добавь свою уточку</span>
          </div>
        `;
      }

      const cellClick = hasRaces
        ? `window.sotkaHub.openBoardDayAgendaModal('${dKey}')`
        : `window.sotkaHub.openCreateEventOnDate('${dKey}')`;

      cellsHtml += `
        <div class="bcal-day${isToday ? ' today' : ''}${hasRaces ? ' has-race' : ''}" onclick="${cellClick}">
          <div class="bcal-day-top">
            <span class="bcal-day-num">${day}</span>
            ${moreBadge}
          </div>
          ${pondHtml}
        </div>
      `;
    }

    const totalCells = startDayIdx + totalDays;
    const nextCells = (7 - (totalCells % 7)) % 7;
    for (let n = 1; n <= nextCells; n++) {
      cellsHtml += `<div class="bcal-day other-month"><div class="bcal-day-top"><span class="bcal-day-num">${n}</span></div></div>`;
    }

    const monthsPillsHtml = monthNames.map((mName, mIdx) => {
      const isAct = (mIdx === month) ? ' active' : '';
      const cnt = monthEventCounts[mIdx];
      const cntBadge = cnt > 0 ? `<span class="bcal-pill-count">${cnt}</span>` : '';
      return `<button type="button" class="bcal-pill-btn${isAct}" onclick="window.sotkaHub.setBoardCalMonth(${mIdx})"><span>${mName}</span>${cntBadge}</button>`;
    }).join('');

    const yearPillsHtml = yearsList.map(yr => {
      const act = (yr === year) ? ' active' : '';
      return `<button type="button" class="bcal-pill-btn${act}" onclick="window.sotkaHub.setBoardCalYear(${yr})">${yr}</button>`;
    }).join('');

    calWrap.innerHTML = `
      <div class="bcal-header">
        <div id="bcalMonthsCapsuleWrap" class="bcal-capsule-scroll bcal-months-capsule">
          <div class="bcal-capsule-track">${monthsPillsHtml}</div>
        </div>
        <div id="bcalYearsCapsuleWrap" class="bcal-capsule-scroll bcal-years-capsule">
          <div class="bcal-capsule-track">${yearPillsHtml}</div>
        </div>
        <button type="button" class="bcal-close-icon-btn" onclick="window.sotkaHub.toggleBoardCalendarView(false)" title="Закрыть сетку календаря">
          ${MIN_SVG.closeX}
        </button>
      </div>
      <div class="bcal-weekdays">
        <div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div style="color:#d97706;">СБ</div><div style="color:#d97706;">ВС</div>
      </div>
      <div class="bcal-grid" id="bcalSwipeGrid">${cellsHtml}</div>
    `;

    this.centerActiveCalPills(true);

    const mCap = document.getElementById('bcalMonthsCapsuleWrap');
    if (mCap) {
      mCap.onwheel = e => {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          e.preventDefault();
          mCap.scrollLeft += e.deltaY;
        }
      };
    }

    const gridEl = document.getElementById('bcalSwipeGrid');
    if (gridEl) {
      let sx = 0, sy = 0;
      gridEl.ontouchstart = e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
      gridEl.ontouchend = e => {
        const dx = e.changedTouches[0].clientX - sx;
        const dy = e.changedTouches[0].clientY - sy;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) {
          this.changeBoardCalMonth(dx < 0 ? 1 : -1);
        }
      };
    }
  }

  openPinFromCalendar(raceId) {
    this._returnToCalendarOnClose = true;
    const calWrap = document.getElementById('boardMonthCalendarWrap');
    if (calWrap) calWrap.classList.remove('open');
    this.openRaceHubModal(raceId, 'briefing');
  }

  openCreateEventOnDate(dateKey) {
    this.openCreateEventModal(dateKey);
  }

  openBoardDayAgendaModal(dateKey) {
    const parts = dateKey.split('-').map(Number);
    const dObj = new Date(parts[0], parts[1] - 1, parts[2]);
    const dateFormatted = dObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

    const seenBase = new Set();
    const dayEvents = [];
    (this.races || []).forEach(r => {
      if (!r || !r.date) return;
      const rd = new Date(r.date);
      if (isNaN(rd.getTime())) return;
      const k = `${rd.getFullYear()}-${String(rd.getMonth() + 1).padStart(2, '0')}-${String(rd.getDate()).padStart(2, '0')}`;
      if (k !== dateKey) return;
      const base = (r.name && r.name.includes('[')) ? r.name.split('[')[0].trim() : r.name;
      if (seenBase.has(base.toLowerCase())) return;
      seenBase.add(base.toLowerCase());
      dayEvents.push({ race: r, baseName: base });
    });

    const modal = document.getElementById('hubQrModal');
    const box = document.getElementById('hubQrModalContent');
    box.className = 'hub-modal-card';

    const listHtml = dayEvents.map(ev => {
      const r = ev.race;
      const tStr = new Date(r.date).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      const editBtn = this.canEditRace(r)
        ? `<button type="button" class="pin-icon-round" style="width:26px; height:26px;" onclick="event.stopPropagation(); window.sotkaHub.openEditPinModal('${r.id}', 'main', event)" title="Редактировать">${MIN_SVG.editPen}</button>`
        : '';
      return `
        <div class="drawer-card" onclick="document.getElementById('hubQrModal').style.display='none'; window.sotkaHub.openPinFromCalendar('${r.id}')">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <span style="font-family:'Unbounded',sans-serif; font-size:12px; font-weight:900;">${this.escapeHTML(ev.baseName)}</span>
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="font-family:'Roboto Mono',monospace; font-size:11px; font-weight:800; color:#d97706;">${r.distance || 0} км</span>
              ${editBtn}
            </div>
          </div>
          <div style="font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--text-muted);">Старт в ${tStr} • Открыть пин</div>
        </div>
      `;
    }).join('');

    box.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-family:'Roboto Mono',monospace; font-size:10px; font-weight:800; color:#d97706;">КАЛЕНДАРЬ ДНЯ</div>
          <div style="font-family:'Unbounded',sans-serif; font-size:14px; font-weight:900; text-transform:uppercase;">${this.escapeHTML(dateFormatted)}</div>
        </div>
        <button type="button" class="pin-icon-round" style="width:28px; height:28px;" onclick="document.getElementById('hubQrModal').style.display='none'">${MIN_SVG.closeX}</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; max-height:50vh; overflow-y:auto;">
        ${listHtml || '<div style="text-align:center; padding:20px; color:var(--text-muted);">На этот день стартов пока нет</div>'}
      </div>
      <button type="button" class="ctrl-btn primary" style="height:44px; width:100%; font-size:10px;" onclick="document.getElementById('hubQrModal').style.display='none'; window.sotkaHub.openCreateEventOnDate('${dateKey}')">
        + ДОБАВИТЬ СОБЫТИЕ НА ЭТОТ ДЕНЬ
      </button>
    `;

    modal.style.display = 'flex';
  }

  // =====================================================================
  // ЛЕНТА ПИНОВ И MASONRY-ДОСКА
  // =====================================================================
  isRacePinned(raceId) {
    if (!this.currentRider) return false;
    let pinned = this.currentRider.pinned_chats || [];
    if (typeof pinned === 'string') {
      try { pinned = JSON.parse(pinned); } catch (e) { pinned = []; }
    }
    if (!Array.isArray(pinned)) return false;

    const chat = this.chatsByRaceId[raceId];
    const chatId = chat?.id;
    return pinned.includes(raceId) || Boolean(chatId && pinned.includes(chatId));
  }

  async togglePinRace(raceId, event) {
    if (event) {
      event.stopPropagation();
      event.preventDefault();
    }

    if (this.isGuest || !this.currentRider || this.currentRider.id === 'anonymous_guest') {
      this.openLoginModal();
      return;
    }

    let pinned = this.currentRider.pinned_chats || [];
    if (typeof pinned === 'string') {
      try { pinned = JSON.parse(pinned); } catch (e) { pinned = []; }
    }
    if (!Array.isArray(pinned)) pinned = [];

    const chat = this.chatsByRaceId[raceId];
    const chatId = chat?.id;
    const pinObj = this.allPins.find(p => p.race?.id === raceId);
    const sisterIds = (pinObj?.sisters || []).map(s => s.id);
    const targetIds = new Set([raceId, chatId, ...sisterIds].filter(Boolean));

    const alreadyPinned = Array.from(targetIds).some(id => pinned.includes(id));

    if (alreadyPinned) {
      pinned = pinned.filter(id => !targetIds.has(id));
      this.showToast('Убрано из ваших пинов');
    } else {
      targetIds.forEach(id => {
        if (!pinned.includes(id)) pinned.push(id);
      });
      this.showToast('Добавлено в ваши пины');
    }

    this.currentRider.pinned_chats = pinned;

    try {
      localStorage.setItem('vilka_cached_rider', JSON.stringify(this.currentRider));
      if (window.location.hostname.endsWith('sotka.one')) {
        document.cookie = `pb_rider=${encodeURIComponent(JSON.stringify(this.currentRider))}; path=/; domain=sotka.one; max-age=31536000; SameSite=Lax; Secure`;
      }
    } catch (e) {}

    this.buildPinsStream();
    this.renderGrid();

    try {
      await this.pb.collection('riders').update(this.currentRider.id, { pinned_chats: pinned }, { requestKey: null });
    } catch (err) {
      console.error('Ошибка сохранения пина в БД:', err);
    }
  }
  
  // Извлечение персонального результата текущего спортсмена (или владельца поддомена) из live_board или race_rosters
  extractMyRaceResult(sisters) {
    const targetRider = this.subdomainOwnerRider || (!this.isGuest ? this.currentRider : null);
    if (!targetRider) return null;
    const rostersMap = (this.subdomainOwnerRider && (!this.currentRider || this.currentRider.id !== this.subdomainOwnerRider.id))
      ? (this.ownerRostersMap || {})
      : (this.myRostersMap || {});

    const myId = targetRider.id;
    const myFn = String(targetRider.first_name || '').trim().toLowerCase();
    const myLn = String(targetRider.last_name || '').trim().toLowerCase();
    const myFull1 = `${myLn} ${myFn}`.trim();
    const myFull2 = `${myFn} ${myLn}`.trim();

    for (const sr of (sisters || [])) {
      const myReg = rostersMap[sr.id] || null;
      let lb = sr.live_board || [];
      if (typeof lb === 'string') {
        try { lb = JSON.parse(lb); } catch (e) { lb = []; }
      }
      if (!Array.isArray(lb)) lb = [];

      let foundIdx = -1;
      if (lb.length > 0) {
        foundIdx = lb.findIndex(item => {
          if (item.id && item.id === myId) return true;
          if (item.rider_id && item.rider_id === myId) return true;
          if (myReg?.bib && item.bib && String(item.bib).trim() === String(myReg.bib).trim()) return true;
          const nm = String(item.name || '').trim().toLowerCase();
          return nm && (nm === myFull1 || nm === myFull2 || (myLn.length > 2 && nm.includes(myLn) && nm.includes(myFn)));
        });
      }

      if (foundIdx !== -1) {
        const row = lb[foundIdx];
        const isDnf = row.status === 'dnf' || row.timeStr === 'DNF' || row.timeStr === 'DSQ';
        const finishers = lb.filter(x => x.status !== 'dnf' && x.timeStr !== 'DNF' && x.timeStr !== 'DSQ');
        const absRank = isDnf ? null : (finishers.indexOf(row) + 1);
        const catName = row.category || myReg?.final_cluster || 'Абсолют';
        const catFinishers = finishers.filter(x => (x.category || '') === catName);
        const catRank = isDnf ? null : (catFinishers.indexOf(row) + 1);
        const leaderSpeed = finishers.length > 0 ? Math.max(...finishers.map(x => parseFloat(x.speed) || 0)) : 0;

        let lapTimes = Array.isArray(row.lapTimes) ? row.lapTimes.map(Number).filter(n => n > 0) : [];
        const distTag = sr.name && sr.name.includes('[') ? sr.name.split('[')[1].replace(']', '').trim() : '';

        return {
          raceId: sr.id,
          distTag,
          bib: row.bib || myReg?.bib || '',
          timeStr: row.timeStr || (isDnf ? 'DNF' : 'Финиш'),
          speed: parseFloat(row.speed || myReg?.speed || 0) || 0,
          leaderSpeed,
          category: catName,
          absRank,
          absTotal: finishers.length,
          catRank,
          catTotal: catFinishers.length,
          lapTimes,
          points: parseInt(row.points || myReg?.earned_points || 0, 10) || 0,
          isDnf
        };
      }

      // Фолбэк, если результат сохранён только в race_rosters
      if (myReg && (myReg.status === 'finished' || myReg.status === 'dnf' || myReg.time_ms > 0)) {
        const isDnf = myReg.status === 'dnf';
        const ms = Number(myReg.time_ms) || 0;
        let timeStr = isDnf ? 'DNF' : 'ФИНИШ';
        if (ms > 0) {
          const h = Math.floor(ms / 3600000);
          const m = String(Math.floor((ms % 3600000) / 60000)).padStart(2, '0');
          const s = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
          timeStr = h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
        }
        return {
          raceId: sr.id,
          distTag: sr.name && sr.name.includes('[') ? sr.name.split('[')[1].replace(']', '').trim() : '',
          bib: myReg.bib || '',
          timeStr,
          speed: parseFloat(myReg.speed || 0) || 0,
          leaderSpeed: 0,
          category: myReg.final_cluster || 'Абсолют',
          absRank: null,
          absTotal: 0,
          catRank: null,
          catTotal: 0,
          lapTimes: [],
          points: parseInt(myReg.earned_points || 0, 10) || 0,
          isDnf
        };
      }
    }
    return null;
  }

  // Генерация HTML-плашки персонального результата для пина
  buildMyResultOverlayHtml(res, isYellowCard = false) {
    if (!res) return '';
    const isPodium = res.catRank && res.catRank >= 1 && res.catRank <= 3;
    const rankLabel = res.isDnf
      ? 'DNF • СХОД'
      : (res.catRank ? `#${res.catRank} ${res.category}` : res.category);

    const rightMeta = res.absRank
      ? `АБС ${res.absRank}/${res.absTotal}`
      : (res.bib ? `BIB #${res.bib}` : (res.points > 0 ? `+${res.points} PTS` : 'ФИНИШЕР'));

    // Мини-график темпа по кругам или прогресс относительно лидера
    let sparkHtml = '';
    if (res.lapTimes && res.lapTimes.length >= 2) {
      const minLap = Math.min(...res.lapTimes);
      const maxLap = Math.max(...res.lapTimes);
      const spreadSec = ((maxLap - minLap) / 1000).toFixed(1);
      const bars = res.lapTimes.map(t => {
        // Чем быстрее круг, тем выше столбик темпа
        const ratio = maxLap > minLap ? (1 - (t - minLap) / (maxLap - minLap)) : 1;
        const hPct = Math.round(45 + ratio * 55);
        const isBest = t === minLap;
        return `<div class="prh-lap-bar${isBest ? ' is-best' : ''}" style="height:${hPct}%;" title="Круг: ${(t / 1000).toFixed(1)}с"></div>`;
      }).join('');
      sparkHtml = `
        <div class="prh-spark-wrap">
          ${bars}
          <span class="prh-spark-meta">${res.lapTimes.length} КР • РАЗБРОС ±${spreadSec}С</span>
        </div>
      `;
    } else if (res.speed > 0 && res.leaderSpeed > 0) {
      const pct = Math.min(100, Math.round((res.speed / res.leaderSpeed) * 100));
      sparkHtml = `
        <div class="prh-spark-wrap" style="align-items:center;">
          <div style="flex:1; height:5px; background:rgba(255,255,255,0.16); border-radius:4px; overflow:hidden;">
            <div style="width:${pct}%; height:100%; background:var(--sotka-gold); border-radius:4px;"></div>
          </div>
          <span class="prh-spark-meta">${pct}% ТЕМПА ЛИДЕРА</span>
        </div>
      `;
    }

    const boxClass = isYellowCard ? 'yp-result-box' : `pin-result-hud${isPodium ? ' is-podium' : ''}`;
    return `
      <div class="${boxClass}">
        <div class="prh-top">
          <span class="prh-rank-pill${isPodium ? ' is-podium' : ''}">
            ${isPodium ? ICONS.trophy : ICONS.check}
            <span>${this.escapeHTML(rankLabel)}</span>
          </span>
          <span class="prh-abs-lbl">${this.escapeHTML(rightMeta)}</span>
        </div>
        <div class="prh-main">
          <div class="prh-time">${this.escapeHTML(res.timeStr)}</div>
          ${res.speed > 0 ? `<div class="prh-speed">${res.speed.toFixed(2)} <span>КМ/Ч</span></div>` : ''}
        </div>
        ${sparkHtml}
      </div>
    `;
  }

  buildCardElevationSvg(points, isPhotoOverlay = false) {
    if (!Array.isArray(points) || points.length < 3) return '';

    const eles = points.map(p => Number(p.ele) || 0);
    const minE = Math.min(...eles);
    const maxE = Math.max(...eles);
    const span = Math.max(1, maxE - minE);
    const w = 300, h = 42;

    const coords = points.map((p, i) => {
      const x = ((i / (points.length - 1)) * w).toFixed(1);
      const y = (h - 4 - (((Number(p.ele) - minE) / span) * (h - 10))).toFixed(1);
      return `${x},${y}`;
    });

    const polyline = `M${coords.join(' L')}`;
    const area = `${polyline} L${w},${h} L0,${h} Z`;
    const strokeColor = isPhotoOverlay ? '#ffc107' : '#111111';
    const fillColor = isPhotoOverlay ? 'rgba(255, 193, 7, 0.28)' : 'rgba(0, 0, 0, 0.14)';

    return `
      <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:38px; display:block;" preserveAspectRatio="none">
        <path d="${area}" fill="${fillColor}" />
        <path d="${polyline}" fill="none" stroke="${strokeColor}" stroke-width="2" stroke-linecap="round" />
      </svg>
    `;
  }

  // Получение словаря личных обложек гонщика (владельца поддомена timo.sotka.one или текущего пользователя)
  getActiveProfilePosterMap() {
    const targetRider = this.subdomainOwnerRider || this.currentRider;
    if (!targetRider) return {};
    let subs = targetRider.subscriptions || {};
    if (typeof subs === 'string') {
      try { subs = JSON.parse(subs); } catch (e) { subs = {}; }
    }
    return (subs && typeof subs.custom_posters === 'object' && subs.custom_posters) ? subs.custom_posters : {};
  }

  resolveRaceMediaAndTrack(sisters) {
    const isImgFile = name => typeof name === 'string' && /\.(jpe?g|png|webp|gif|svg)$/i.test(name.trim());
    let posterUrl = null;
    let trackData = null;
    let eventChat = null;

    // 1. Сначала проверяем личную обложку спортсмена (на его борде или на поддомене timo.sotka.one)
    const customPosters = this.getActiveProfilePosterMap();
    for (let k = 0; k < sisters.length; k++) {
      const sid = sisters[k].id;
      if (customPosters[sid]) {
        posterUrl = customPosters[sid];
        break;
      }
    }

    for (let i = 0; i < sisters.length; i++) {
      const sr = sisters[i];
      const chat = this.chatsByRaceId[sr.id];
      if (chat && !eventChat) eventChat = chat;

      if (chat && chat.panel_image && isImgFile(chat.panel_image) && !posterUrl) {
        const col = chat.collectionId || 'chats';
        posterUrl = `https://vilka.sotka.one/api/files/${col}/${chat.id}/${chat.panel_image}`;
      }
      const postMsg = (chat && this.postersMap[chat.id]) || this.postersMap[sr.id];
      if (postMsg && postMsg.file && !posterUrl) {
        const f = Array.isArray(postMsg.file) ? postMsg.file[0] : postMsg.file;
        if (isImgFile(f)) {
          const mCol = postMsg.collectionId || 'messages';
          posterUrl = `https://vilka.sotka.one/api/files/${mCol}/${postMsg.id}/${f}`;
        }
      }

      if (!trackData && sr.cat_logic) {
        try {
          const cl = typeof sr.cat_logic === 'string' ? JSON.parse(sr.cat_logic) : sr.cat_logic;
          if (cl && cl.track_data && cl.track_data.points && cl.track_data.points.length) {
            trackData = cl.track_data;
          }
        } catch (e) {}
      }
    }
    return { posterUrl, trackData, eventChat };
  }

  buildPinsStream() {
    const nowStartOfDay = new Date();
    nowStartOfDay.setHours(0, 0, 0, 0);
    const nowMs = nowStartOfDay.getTime();

    const groupedEventsMap = new Map();
    this.races.forEach(r => {
      if (this.selectedPelotonId !== 'all') {
        const pId = Array.isArray(r.peloton_id) ? r.peloton_id[0] : r.peloton_id;
        if (pId !== this.selectedPelotonId) return;
      }

      // Фильтр по виду спорта (если пусто — по умолчанию cycling)
      const rSport = String(r.sport || 'cycling').toLowerCase().trim();
      if (this.selectedSport && this.selectedSport !== 'all' && rSport !== this.selectedSport) return;

      if (this.selectedSeasonYear !== 'all' && r.date) {
        const rYear = new Date(r.date).getFullYear();
        if (rYear !== Number(this.selectedSeasonYear)) return;
      }

      const baseName = r.name && r.name.includes('[') ? r.name.split('[')[0].trim() : (r.name || 'Гонка').trim();
      const dayStr = r.date ? String(r.date).slice(0, 10) : 'nodate';
      const key = `${dayStr}_${baseName.toLowerCase()}`;

      if (!groupedEventsMap.has(key)) {
        groupedEventsMap.set(key, {
          baseName,
          dayStr,
          dateMs: new Date(r.date || 0).getTime() || 0,
          primaryRace: r,
          sisters: [r]
        });
      } else {
        groupedEventsMap.get(key).sisters.push(r);
      }
    });

    const upcomingRacePins = [];
    const myTicketPins = [];
    const archiveRacePins = [];

    groupedEventsMap.forEach(group => {
      const r = group.primaryRace;
      const sisters = group.sisters;
      sisters.sort((a, b) => (parseFloat(b.distance) || 0) - (parseFloat(a.distance) || 0));

      const totalRiders = sisters.reduce((acc, sr) => acc + (this.rosterCounts[sr.id] || 0), 0);

      let myReg = null;
      let myRegRace = r;
      for (const sr of sisters) {
        if (this.myRostersMap[sr.id]) {
          myReg = this.myRostersMap[sr.id];
          myRegRace = sr;
          break;
        }
      }

      const mediaInfo = this.resolveRaceMediaAndTrack(sisters);
      const fiveDaysMs = 5 * 24 * 60 * 60 * 1000;
      const isPast5Days = group.dateMs > 0 && (Date.now() - group.dateMs) > fiveDaysMs;

      const isLive = sisters.some(s => s.status === 'LIVE');
      const isFinished = sisters.every(s => s.status === 'Finished' || s.status === 'Завершена');
      const isRecentFinish = isFinished && !isPast5Days;
      const hasOpenReg = !isLive && !isFinished && sisters.some(s => s.status === 'Registration');
      const isSoon = !isLive && !isFinished && !hasOpenReg;
      const isUpcoming = isLive || isRecentFinish || (!isFinished && group.dateMs >= nowMs);
      const isPinned = sisters.some(s => this.isRacePinned(s.id));

      // Персональный результат спортсмена (только после вычисления isFinished)
      const myResult = (isFinished && typeof this.extractMyRaceResult === 'function')
        ? this.extractMyRaceResult(sisters)
        : null;

      if (myReg && !isFinished) {
        myTicketPins.push({
          id: `my_ticket_${r.id}`,
          tagGroups: ['my', 'upcoming'],
          kind: 'my_start_ticket',
          dateMs: group.dateMs,
          race: myRegRace,
          baseName: group.baseName,
          reg: myReg,
          isLive,
          totalRiders,
          chat: mediaInfo.eventChat
        });
      }

      const hasOwnerReg = Boolean(this.subdomainOwnerRider && sisters.some(sr => this.ownerRostersMap?.[sr.id]));
      const tagList = this.getRaceTags(r, {
        sisters,
        isUpcoming,
        hasGpx: Boolean(mediaInfo.trackData),
        isPinnedOrMy: Boolean(isPinned || myReg || hasOwnerReg || myResult)
      });

      const racePinObj = {
        id: `race_pin_${r.id}`,
        tagGroups: tagList,
        kind: mediaInfo.posterUrl ? 'media_race' : 'yellow_poster_race',
        dateMs: group.dateMs,
        isUpcoming,
        isRecentFinish,
        hasOpenReg,
        isSoon,
        isPinned,
        race: r,
        baseName: group.baseName,
        sisters,
        posterUrl: mediaInfo.posterUrl,
        trackData: mediaInfo.trackData,
        totalRiders,
        myReg,
        myResult,
        isLive,
        isFinished,
        chat: mediaInfo.eventChat
      };

      if (isUpcoming) upcomingRacePins.push(racePinObj);
      else archiveRacePins.push(racePinObj);
    });

    // Приоритет сортировки как в Вилке: 1. LIVE, 2. Недавний финиш (5 дней) и ближайшие старты
    upcomingRacePins.sort((a, b) => {
      if (a.isLive !== b.isLive) return a.isLive ? -1 : 1;
      if (a.isRecentFinish !== b.isRecentFinish) return a.isRecentFinish ? -1 : 1;
      if (a.isRecentFinish && b.isRecentFinish) return b.dateMs - a.dateMs;
      return a.dateMs - b.dateMs;
    });
    archiveRacePins.sort((a, b) => b.dateMs - a.dateMs);

    const finalStream = [];

    if (!this.isGuest && this.currentRider) {
      finalStream.push({ id: 'pin_personal_control', tagGroups: ['my'], kind: 'control_athlete', rider: this.currentRider });
    } else {
      finalStream.push({ id: 'pin_guest_welcome', tagGroups: ['my'], kind: 'control_guest' });
    }

    finalStream.push(...myTicketPins);
    finalStream.push(...upcomingRacePins);

    const combatTeams = Object.values(this.teamsMap).filter(t => t.name && !t.name.toUpperCase().includes('ONE TEAM')).slice(0, 4);
    if (combatTeams.length > 0) {
      finalStream.push({ id: 'pin_clubs_leaderboard', tagGroups: ['clubs'], kind: 'data_clubs_top', teams: combatTeams });
    }

    const isJudgeOrAdmin = this.userRoles.some(rl => ['superadmin', 'admin', 'judge'].includes(rl));
    if (isJudgeOrAdmin) {
      const targetJudgeRace = upcomingRacePins[0]?.race || this.races[0];
      finalStream.push({ id: 'pin_judge_control', tagGroups: ['my'], kind: 'control_judge', race: targetJudgeRace });
    }

    finalStream.push(...archiveRacePins);
    this.allPins = finalStream;
    this.renderFilterTagsBar();
  }
  
  getYellowPosterInnerHtml(pin, surfaceLabel, dateFmt, ctaText, ctaClass, ctaIcon) {
    const r = pin.race;
    const dObj = new Date(r.date);

    const titleLen = (pin.baseName || '').length;
    const fontSize = titleLen > 24 ? '15px' : (titleLen > 15 ? '17px' : '20px');

      gpxEmbeddedHtml = `

    const radioHoverBtn = pin.chat ? `

        ${ICONS.radio}
        <span>Радио</span>
      </button>
    ` : '';

    return `
      <div class="pin-hover-layer">
        <div class="pin-hover-bottom-bar">
          <button class="pin-cta-btn ${ctaClass}" onclick="event.stopPropagation(); window.sotkaHub.handleRaceRegistration('${r.id}')">
            ${ctaIcon}
            <span>${ctaText}</span>
          </button>
          <div style="display:flex; align-items:center; gap:5px;">

            <button class="pin-icon-round ${pin.isPinned ? 'is-pinned' : ''}" onclick="window.sotkaHub.togglePinRace('${r.id}', event)" title="${pin.isPinned ? 'В моих пинах (убрать)' : 'Добавить в мои пины'}">
              ${pin.isPinned ? ICONS.pinFilled : ICONS.pinOutline}
            </button>
            <button class="pin-icon-round" onclick="event.stopPropagation(); window.sotkaHub.shareRace('${r.id}')" title="Скопировать ссылку">
              ${ICONS.share}
            </button>
          </div>
        </div>

  upgradeBrokenImgToYellowPoster(imgEl, pinId) {
    const pin = this.allPins.find(p => p.id === pinId);
    const card = imgEl.closest('.pin-visual-card');
    if (!card || !pin) return;

    const r = pin.race;
    const dObj = new Date(r.date);
    const dateFmt = !isNaN(dObj.getTime()) ? dObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).toUpperCase() : 'СКОРО';
    const surfaceLabel = this.getSurfaceLabel(r.surface);

    let ctaText = 'Заявиться', ctaClass = '', ctaIcon = ICONS.bolt;
    if (pin.isFinished) { ctaText = 'Результаты'; ctaClass = 'is-dark'; ctaIcon = ICONS.flag; }
    else if (pin.isLive) { ctaText = 'LIVE'; ctaClass = ''; ctaIcon = ICONS.bolt; }
    else if (pin.myReg) { ctaText = 'В старте'; ctaClass = 'is-green'; ctaIcon = ICONS.check; }
    else if (pin.isSoon) { ctaText = 'Анонс'; ctaClass = 'is-soon'; ctaIcon = ICONS.clock; }

    card.classList.remove('is-media');
    card.classList.add('pin-yellow-poster');
    card.innerHTML = this.getYellowPosterInnerHtml(pin, surfaceLabel, dateFmt, ctaText, ctaClass, ctaIcon);
  }

  openCalendarForYear(yr, event) {
    if (event) event.stopPropagation();
    const numYr = Number(yr);
    if (!isNaN(numYr)) {
      const firstRaceInYear = (this.races || []).find(r => {
        if (!r || !r.date) return false;
        const d = new Date(r.date);
        return d.getFullYear() === numYr && this.raceMatchesCalendarFilters(r);
      });
      const targetMonth = firstRaceInYear ? new Date(firstRaceInYear.date).getMonth() : 0;
      this.boardCalDate = new Date(numYr, targetMonth, 1);
    }
    this.toggleBoardCalendarView(true);
  }

  renderGrid() {
    const grid = document.getElementById('hubMasonryGrid');
    const mobileDeck = document.getElementById('hubMobileDeck');
    if (!grid) return;

    const isMobile = window.innerWidth <= 640;

    const filtered = this.allPins.filter(p => {
      const tags = p.tagGroups || [];
      const matchTag = (this.activeTag === 'all') || tags.includes(this.activeTag) || (this.activeTag === 'my' && (p.myReg || p.isPinned));
      if (!matchTag) return false;
      if (!this.searchQuery) return true;

      const dump = JSON.stringify({ b: p.baseName, n: p.race?.name, s: p.race?.surface, k: p.kind }).toLowerCase();
      return dump.includes(this.searchQuery);
    });

    if (filtered.length === 0) {
      if (mobileDeck) mobileDeck.innerHTML = '';
      grid.innerHTML = `<div style="width:100%; text-align:center; padding:60px 20px; color:var(--text-muted); font-family:'Unbounded'; font-size:12px;">В ЭТОЙ КАТЕГОРИИ ПОКА НЕТ ПИНОВ</div>`;
      return;
    }

    let basePins = filtered;
    if (isMobile && mobileDeck) {
      const controlPin = filtered.find(p => p.kind === 'control_athlete' || p.kind === 'control_guest');
      if (controlPin && (this.activeTag === 'all' || this.activeTag === 'my')) {
        mobileDeck.innerHTML = this.renderPinHTML(controlPin);
        basePins = filtered.filter(p => p.id !== controlPin.id);
      } else {
        mobileDeck.innerHTML = '';
      }
    } else if (mobileDeck) {
      mobileDeck.innerHTML = '';
    }

    // Считаем количество стартов по каждому году в текущей выборке и вставляем вехи года
    const yearRaceCounts = {};
    basePins.forEach(p => {
      if ((p.kind === 'media_race' || p.kind === 'yellow_poster_race') && p.race?.date) {
        const y = new Date(p.race.date).getFullYear();
        if (!isNaN(y)) {
          const scopeKey = `${p.isUpcoming ? 'up' : 'arch'}_${y}`;
          yearRaceCounts[scopeKey] = (yearRaceCounts[scopeKey] || 0) + 1;
        }
      }
    });

    const gridPins = [];
    let lastMilestoneKey = null;

    basePins.forEach(p => {
      if ((p.kind === 'media_race' || p.kind === 'yellow_poster_race') && p.race?.date) {
        const y = new Date(p.race.date).getFullYear();
        if (!isNaN(y)) {
          const mKey = `${p.isUpcoming ? 'up' : 'arch'}_${y}`;
          if (mKey !== lastMilestoneKey) {
            lastMilestoneKey = mKey;
            gridPins.push({
              id: `pin_milestone_${mKey}`,
              kind: 'year_milestone',
              year: y,
              isUpcoming: p.isUpcoming,
              count: yearRaceCounts[mKey] || 1
            });
          }
        }
      }
      gridPins.push(p);
    });

    const colCount = this.getColumnsCount();
    const colsHtml = Array.from({ length: colCount }, () => []);
    const colHeights = Array.from({ length: colCount }, () => 0);

    gridPins.forEach(pin => {
      let shortestColIdx = 0;
      for (let i = 1; i < colCount; i++) {
        if (colHeights[i] < colHeights[shortestColIdx]) shortestColIdx = i;
      }
      colsHtml[shortestColIdx].push(this.renderPinHTML(pin));
      colHeights[shortestColIdx] += (pin.kind === 'media_race' ? 320 : 230);
    });

    grid.innerHTML = colsHtml.map(colItems => `<div class="hub-masonry-col">${colItems.join('')}</div>`).join('');
  }
