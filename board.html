            <div class="pin-caption-meta">
              <div style="display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <span>${rYear ? rYear + ' • ' : ''}${this.escapeHTML(statusMetaLabel)}</span>
                ${radioCaptionChipHtml}
              </div>
              <span style="font-family:'Roboto Mono',monospace; font-weight:700; display:inline-flex; align-items:center; gap:3px;">${ICONS.users} <span>${pin.totalRiders}</span></span>
            </div>
            ${sisterChipsHtml}
          </div>
        </article>
      `;
    }

    return `
      <article class="pin-unit">
        <div class="pin-visual-card pin-yellow-poster" onclick="window.sotkaHub.openRaceHubModal('${targetRaceId}', 'briefing')">
          ${this.getYellowPosterInnerHtml(pin, surfaceLabel, dateFmt, ctaText, ctaClass, ctaIcon)}
        </div>
        <div class="pin-caption">
          <div class="pin-caption-row">
            <div style="display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap;">
              <span style="font-size:11px; color:var(--text-muted); font-weight:600;">${rYear ? rYear + ' • ' : ''}${this.escapeHTML(statusMetaLabel)}</span>
              ${radioCaptionChipHtml}
            </div>
            <button class="pin-caption-pin-btn ${pin.isPinned ? 'is-pinned' : ''}" onclick="window.sotkaHub.togglePinRace('${r.id}', event)" title="${pin.isPinned ? 'В моих пинах' : 'В мои пины'}">
              ${pin.isPinned ? ICONS.pinFilled : ICONS.pinOutline}
            </button>
          </div>
          ${sisterChipsHtml}
        </div>
      </article>
    `;
  }
  // =====================================================================
  // КАРТОЧКА ПИНА PINTEREST (АФИША БЕЗ ПОЛЕЙ + МОСТ С ПРОТОКОЛОМ И РАДИО)
  // =====================================================================
  closeInlinePin(fromHistory = false) {
    document.body.classList.remove('pin-view-open');
    document.title = DEFAULT_DOC_TITLE;
    const wrap = document.getElementById('inlinePinStageWrap');
    if (wrap) {
      wrap.classList.remove('open');
      wrap.innerHTML = '';
    }
    this._modalRaceContext = null;

    if (this._returnToCalendarOnClose && this.isCalendarViewOpen) {
      this._returnToCalendarOnClose = false;
      document.body.classList.add('cal-view-open');
      const calWrap = document.getElementById('boardMonthCalendarWrap');
      if (calWrap) calWrap.classList.add('open');
      this.renderBoardMonthCalendar(this.boardCalDate || new Date());
    }

    if (!fromHistory) {
      try {
        history.pushState(null, '', '/' + window.location.search);
      } catch (e) {}
    }
  }

  async openVilkaProtocol(raceId, event) {
    if (event) event.stopPropagation();
    const app = await ensureVilkaEngineReady(this);
    if (app && typeof app.openLiveBoard === 'function') {
      app.openLiveBoard(raceId, event);
    }
  }

  async openVilkaRouteMap(raceId, event) {
    if (event) event.stopPropagation();
    const app = await ensureVilkaEngineReady(this);
    const r = this.racesById[raceId];
    if (!r || !app) return;

    let hasGpx = false;
    try {
      const cl = typeof r.cat_logic === 'string' ? JSON.parse(r.cat_logic) : r.cat_logic;
      hasGpx = Boolean(cl && cl.track_data && cl.track_data.points && cl.track_data.points.length);
    } catch (e) {}

    if (hasGpx && typeof app.open3DTrackModal === 'function') {
      app.open3DTrackModal(raceId);
      return;
    }

    const chat = this.chatsByRaceId[raceId] || (this._modalRaceContext && this._modalRaceContext.eventChat);
    let embedCode = null;
    if (chat && chat.panel_data) {
      try {
        const pData = typeof chat.panel_data === 'string' ? JSON.parse(chat.panel_data) : chat.panel_data;
        embedCode = pData.embed_code || pData.map_iframe;
      } catch (e) {}
    }
    if (embedCode && typeof app.openMapModal === 'function') {
      app.currentMapEmbed = embedCode;
      app.openMapModal();
      return;
    }

    if (this._modalRaceContext && this._modalRaceContext.trackData && typeof app.open3DTrackModal === 'function') {
      const sisterWithTrack = (this._modalRaceContext.sisters || []).find(sr => {
        try {
          const scl = typeof sr.cat_logic === 'string' ? JSON.parse(sr.cat_logic) : sr.cat_logic;
          return Boolean(scl && scl.track_data && scl.track_data.points && scl.track_data.points.length);
        } catch (e) { return false; }
      });
      if (sisterWithTrack) {
        app.open3DTrackModal(sisterWithTrack.id);
        return;
      }
    }

    this.showToast('Маршрут для этой дистанции ещё не загружен');
  }

  async openRaceHubModal(raceId, initialTab = 'briefing', fromHistory = false) {
    const modal = document.getElementById('hubQrModal');
    if (modal) modal.style.display = 'none';

    const r = this.racesById[raceId] || this.races[0];
    if (!r) return;

    const baseName = (r.name && r.name.includes('[')) ? r.name.split('[')[0].trim() : r.name;
    const dayStr = r.date ? String(r.date).slice(0, 10) : '';
    const sisters = this.races.filter(sr => {
      const srBase = (sr.name && sr.name.includes('[')) ? sr.name.split('[')[0].trim() : sr.name;
      const srDay = sr.date ? String(sr.date).slice(0, 10) : '';
      return srBase.toLowerCase() === baseName.toLowerCase() && srDay === dayStr;
    });
    if (sisters.length === 0) sisters.push(r);
    sisters.sort((a, b) => (parseFloat(b.distance) || 0) - (parseFloat(a.distance) || 0));

    const mediaInfo = this.resolveRaceMediaAndTrack(sisters);

    this._modalRaceContext = {
      activeRace: r,
      sisters,
      baseName,
      briefingExpanded: false,
      posterUrl: mediaInfo.posterUrl,
      trackData: mediaInfo.trackData,
      eventChat: mediaInfo.eventChat
    };

    const pinAlias = this.getRacePinAlias(r.id);
    document.title = `${baseName} — СОТКА`;
    if (!fromHistory) {
      const curHash = decodeURIComponent(window.location.hash || '').replace(/^#/, '');
      if (curHash !== pinAlias || window.location.pathname.indexOf('board.html') !== -1) {
        try {
          history.pushState({ pinRaceId: r.id }, '', '/' + window.location.search + '#' + pinAlias);
        } catch (e) {}
      }
    } else {
      stripBoardHtmlFromUrl();
    }

    document.body.classList.add('pin-view-open');
    await this.renderRaceHubModalContent();

    window.scrollTo({ top: 0, behavior: 'smooth' });

    if (initialTab === 'force_start' || initialTab === 'start' || initialTab === 'results') {
      this.openVilkaProtocol(r.id);
    }
  }

  switchModalSisterRace(raceId) {
    const target = this.racesById[raceId];
    if (target && this._modalRaceContext) {
      this._modalRaceContext.activeRace = target;
      const alias = this.getRacePinAlias(target.id);
      try {
        history.replaceState({ pinRaceId: target.id }, '', '/' + window.location.search + '#' + alias);
      } catch (e) {}
      this.renderRaceHubModalContent();
    }
  }

  toggleBriefingExpand() {
    if (!this._modalRaceContext) return;
    this._modalRaceContext.briefingExpanded = !this._modalRaceContext.briefingExpanded;
    const bodyEl = document.getElementById('pinBriefingTextBody');
    const btnEl = document.getElementById('pinBriefingExpandBtn');
    if (bodyEl) bodyEl.classList.toggle('pin-briefing-clamp', !this._modalRaceContext.briefingExpanded);
    if (btnEl) btnEl.innerText = this._modalRaceContext.briefingExpanded ? 'Свернуть положение' : 'Развернуть полностью';
  }

  openStoryPosterForRace(raceId) {
    this.openStoryPosterModal();
    setTimeout(() => {
      const sel = document.getElementById('spRaceSelect');
      if (sel && raceId) sel.value = raceId;
    }, 40);
  }

  async renderRaceHubModalContent() {
    const ctx = this._modalRaceContext;
    if (!ctx) return;
    const wrap = document.getElementById('inlinePinStageWrap');
    if (!wrap) return;
    wrap.classList.add('open');

    const r = ctx.activeRace;
    const canEdit = this.canEditRace(r);
    let activeTrack = ctx.trackData;
    try {
      const cl = typeof r.cat_logic === 'string' ? JSON.parse(r.cat_logic) : r.cat_logic;
      if (cl && cl.track_data && cl.track_data.points && cl.track_data.points.length) {
        activeTrack = cl.track_data;
      }
    } catch (e) {}

    const myReg = this.myRostersMap[r.id];
    const isFinished = r.status === 'Finished' || r.status === 'Завершена' || ctx.sisters.every(s => s.status === 'Finished' || s.status === 'Завершена');
    const isLive = !isFinished && (r.status === 'LIVE' || ctx.sisters.some(s => s.status === 'LIVE'));
    const isSoon = !isLive && !isFinished && (r.status === 'Скоро' || !ctx.sisters.some(s => s.status === 'Registration'));
    const isPinned = this.isRacePinned(r.id);

    const chat = this.chatsByRaceId[r.id] || ctx.eventChat;
    let radioDirectUrl = `https://vilka.sotka.one/#${r.id}`;

        ? `https://vilka.sotka.one/#${chat.slug}`
        : `https://vilka.sotka.one/?chat=${chat.id}`;

    const dObj = new Date(r.date);

    const dateShort = validDate ? dObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).toUpperCase() : 'СКОРО';

    let ctaBtnHtml = '';

      ctaBtnHtml = `<button type="button" class="pin-cta-btn is-dark" style="height:40px; padding:0 18px; font-size:12.5px;" onclick="window.sotkaHub.openVilkaProtocol('${r.id}', event)">${ICONS.trophy} <span>Протокол</span></button>`;

        return `<button type="button" class="bcal-pill-btn${isAct}" onclick="window.sotkaHub.switchModalSisterRace('${sr.id}')">

        ? `<div class="yp-gpx-box" style="margin-top:10px;"><div class="yp-gpx-stats"><span>3D GPX +${sm.gain || 0}М</span><span>MAX ${sm.maxSlope || 0}%</span></div>${this.buildCardElevationSvg(activeTrack.points, false)}</div>`
        : '';
      mediaContentHtml = `

    if (hasAnyMap || canEdit) {

    const clampCls = (!ctx.briefingExpanded && isLong) ? ' pin-briefing-clamp' : '';
    const expandBtnHtml = isLong

      : '';

    const relatedPins = this.allPins.filter(p => (p.kind === 'media_race' || p.kind === 'yellow_poster_race') && p.race && p.race.id !== r.id).slice(0, 2);
    const relatedHtml = relatedPins.map(p => this.renderPinHTML(p)).join('');

    const editToolBtnHtml = canEdit

                  <div class="vilka-mini-sub" style="${hasAnyMap ? 'color:#111; font-weight:800; display:inline-flex; align-items:center; gap:3px;' : ''}">${hasAnyMap ? `<span>КАРТА</span> ${MIN_SVG.arrowUpRight}` : this.escapeHTML(formatLabel)}</div>

  async refreshPinRadioStream(chatId, radioDirectUrl) {
    const streamEl = document.getElementById('hubModalChatStream');
    const countBadge = document.getElementById('pinRadioCountBadge');
    if (!streamEl) return;

    if (!chatId) {
      streamEl.innerHTML = '<div style="padding:6px; text-align:center; color:var(--text-muted); font-size:12px;">Обсуждение доступно в Радио гонки</div>';
      return;
    }

    const msgsRes = await this.pb.collection('messages').getList(1, 3, {
      filter: `chat_id="${chatId}"`,
      sort: '-created',
      expand: 'sender_id',
      requestKey: null
    }).catch(() => ({ items: [], totalItems: 0 }));

    const msgs = (msgsRes.items || []).reverse();
    if (countBadge) countBadge.innerText = msgsRes.totalItems ? `(${msgsRes.totalItems})` : '';

    if (msgs.length === 0) {
      streamEl.innerHTML = '<div style="padding:8px; text-align:center; color:var(--text-muted); font-size:12px;">В эфире пока тихо — напишите первым</div>';
      return;
    }

    let listHtml = msgs.map(m => {
      const s = (m.expand && m.expand.sender_id) ? m.expand.sender_id : {};
      const sName = `${s.first_name || ''} ${s.last_name || ''}`.trim() || 'VILKA MOTO';
      const fChar = s.first_name ? s.first_name[0] : 'V';
      const lChar = s.last_name ? s.last_name[0] : 'M';
      let avInner = (fChar + lChar).toUpperCase();
      if (s.avatar && s.id) {
        const avFile = Array.isArray(s.avatar) ? s.avatar[0] : s.avatar;
        avInner = `<img src="https://vilka.sotka.one/api/files/riders/${s.id}/${avFile}" alt="AV">`;
      }
      // Очищаем и [ACTION:...], и технические теги ответов [TO:...]
      const cleanTxt = (m.text || '')
        .replace(/\[ACTION:[^\]]+\]/g, '')
        .replace(/\[TO:[^\]]+\]/g, '')
        .trim();
      const msgTime = new Date(m.created).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

      return `
        <div class="pin-msg-bubble">
          <div class="pin-msg-av">${avInner}</div>
          <div style="flex:1; min-width:0;">
            <div style="display:flex; justify-content:space-between; gap:6px; margin-bottom:2px;">
              <span style="font-family:'Unbounded',sans-serif; font-size:9px; font-weight:800;">${this.escapeHTML(sName)}</span>
              <span style="font-family:'Roboto Mono',monospace; font-size:8.5px; color:var(--text-muted);">${msgTime}</span>
            </div>
            <div style="font-size:12.5px; line-height:1.35; overflow-wrap:break-word;">${this.formatBriefingHtml(cleanTxt)}</div>
          </div>
        </div>
      `;
    }).join('');

    if (msgsRes.totalItems > 3 && radioDirectUrl) {
      listHtml += `<a href="${radioDirectUrl}" style="font-family:'Unbounded',sans-serif; font-size:9px; font-weight:800; color:#111111; text-decoration:none; text-align:center; padding:4px;">Открыть все сообщения (${msgsRes.totalItems}) в Радио гонки</a>`;
    }

    streamEl.innerHTML = listHtml;
  }

  async sendModalChatMessage(chatId, radioDirectUrl) {

  downloadGpxFromTrack(raceId) {
    const r = this.racesById[raceId];
    if (!r) return;
    let pts = [];
    try {
      const cl = typeof r.cat_logic === 'string' ? JSON.parse(r.cat_logic) : r.cat_logic;
      pts = cl?.track_data?.points || [];
    } catch (e) {}
    if (!pts.length) return alert('GPX точки не найдены');

    let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="SOTKA.ONE">\n  <trk><name>${this.escapeHTML(r.name)}</name><trkseg>\n`;
    pts.forEach(p => { gpx += `    <trkpt lat="${p.lat}" lon="${p.lon}"><ele>${p.ele || 0}</ele></trkpt>\n`; });
    gpx += `  </trkseg></trk>\n</gpx>`;

    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${(r.name || 'track').replace(/\s+/g, '_')}.gpx`;
    a.click();
  }

  computeSuperRegCategory(rider, race, chosenGear) {
    if (!rider || !race) return 'АБСОЛЮТ';
    const g = (rider.gender === 'F' || rider.gender === 'Ж') ? 'F' : 'M';
    const rusG = (g === 'M') ? 'М' : 'Ж';

    const dObj = race.date ? new Date(race.date) : new Date();
    const raceYear = isNaN(dObj.getFullYear()) ? new Date().getFullYear() : dObj.getFullYear();
    const birthYear = parseInt(rider.yob || 1990, 10);
    const age = raceYear - birthYear;

    let matrix = null;
    if (race.cat_logic) {
      try {
        matrix = typeof race.cat_logic === 'string' ? JSON.parse(race.cat_logic) : race.cat_logic;
      } catch (e) { matrix = null; }
    }

    const gearLabels = {
      ROAD: 'ШОССЕ', TT: 'TT', GRAVEL: 'ГРЭВЕЛ', GRVL: 'ГРЭВЕЛ',
      CX: 'ЦИКЛОКРОСС', MTB: 'МТБ', FIX: 'ФИКС', FAT: 'ФЭТ',
      SS: 'СИНГЛСПИД', EBIKE: 'ЭЛЕКТРО'
    };

    if (matrix && typeof matrix === 'object') {
      const parts = [];
      let rawGear = chosenGear;
      if (!rawGear && matrix.use_gear && Array.isArray(matrix.active_gears) && matrix.active_gears.length > 0) {
        rawGear = matrix.active_gears[0];
      }
      if (matrix.use_gear && rawGear) {
        const gUp = String(rawGear).toUpperCase().trim();
        parts.push(gearLabels[gUp] || gUp);
      }

      if (matrix.has_team_genders || matrix.has_team_age || race.format === 'ttt' || race.format === 'relay') {
        const teamLbl = (g === 'F') ? 'ЖЕНЩИНЫ' : 'МУЖЧИНЫ';
        return (parts.length ? parts.join(' • ') + ' • ' : '') + teamLbl;
      }

      if (matrix.has_clusters || matrix.model === 'clusters') {
        const surf = race.surface || 'road';
        const rawCl = rider['cluster_' + surf] || rider.base_cluster || 'B';
        const cleanCl = String(rawCl).replace(/\[.*?\]\s*/g, '').trim() || 'B';
        parts.push('Кластер ' + cleanCl);
        return `[${rusG}] ${parts.join(' • ')}`;
      }

      if (matrix.has_age || matrix.model === 'pure_age' || matrix.model === 'sport_age') {
        const bands = (matrix.age_bands && matrix.age_bands[g]) ? matrix.age_bands[g] : (Array.isArray(matrix.age_bands) ? matrix.age_bands : ['18-29', '30-39', '40-49', '50-59', '60+']);
        let matchedBand = bands[0] || '18+';
        for (let i = 0; i < bands.length; i++) {
          const b = String(bands[i]);
          if (b.indexOf('U') === 0) {
            const lim = parseInt(b.replace('U', ''), 10);
            if (age <= lim) { matchedBand = b; break; }
          } else if (b.indexOf('-') !== -1) {
            const sp = b.split('-').map(Number);
            if (age >= sp[0] && age <= sp[1]) { matchedBand = b; break; }
          } else if (b.indexOf('+') !== -1) {
            const minA = parseInt(b.replace('+', ''), 10);
            if (age >= minA) { matchedBand = b; break; }
          }
        }
        parts.push(matchedBand);
        return `[${rusG}] ${parts.join(' • ')}`;
      }

      parts.push('АБСОЛЮТ');
      return `[${rusG}] ${parts.join(' • ')}`;
    }

    if (chosenGear) {
      const cg = gearLabels[String(chosenGear).toUpperCase()] || chosenGear;
      return `[${rusG}] ${cg} • АБСОЛЮТ`;
    }
    return `[${rusG}] АБСОЛЮТ`;
  }

  getOpenRegistrationEvents() {
    const nowMs = new Date().setHours(0, 0, 0, 0);
    const map = new Map();

    (this.races || []).forEach(r => {
      if (!r || r.status !== 'Registration') return;
      const dMs = new Date(r.date || 0).getTime() || 0;
      if (dMs > 0 && dMs < nowMs - 86400000) return;

      const baseName = (r.name && r.name.includes('[')) ? r.name.split('[')[0].trim() : (r.name || 'Гонка').trim();
      const dayStr = r.date ? String(r.date).slice(0, 10) : 'nodate';
      const key = `${dayStr}_${baseName.toLowerCase()}`;

      if (!map.has(key)) {
        map.set(key, {
          key,
          baseName,
          dayStr,
          dateMs: dMs,
          primaryRace: r,
          sisters: [r]
        });
      } else {
        map.get(key).sisters.push(r);
      }
    });

    const groups = Array.from(map.values()).filter(g => {
      const allSisters = this.races.filter(sr => {
        const srBase = (sr.name && sr.name.includes('[')) ? sr.name.split('[')[0].trim() : (sr.name || '').trim();
        const srDay = sr.date ? String(sr.date).slice(0, 10) : 'nodate';
        return srDay === g.dayStr && srBase.toLowerCase() === g.baseName.toLowerCase();
      });
      return !allSisters.some(sr => sr.status === 'LIVE' || sr.status === 'Finished' || sr.status === 'Завершена');
    });
    groups.sort((a, b) => a.dateMs - b.dateMs);
    groups.forEach(g => {
      g.sisters.sort((a, b) => (parseFloat(b.distance) || 0) - (parseFloat(a.distance) || 0));
      const media = this.resolveRaceMediaAndTrack(g.sisters);
      g.posterUrl = media.posterUrl;
    });

    return groups;
  }

      CX: 'Циклокросс (CX)', MTB: 'МТБ', FIX: 'Фикс', FAT: 'Фэтбайк',
      SS: 'Синглспид', EBIKE: 'Электро'
    };
    const surfaceLabels = { road: 'ШОССЕ', offroad: 'ГРУНТ', track: 'ТРЕК', indoor: 'ИНДОР' };

    let selectedCount = 0;
    let totalFeeWatts = 0;

    const rowsHtml = groups.map(g => {
      const st = this._superRegState[g.key];
      const activeRace = g.sisters.find(sr => sr.id === st.raceId) || g.sisters[0];
      const gears = this.extractRaceGears(activeRace);

      if (g.existingReg) {
        const regRace = g.existingSister || activeRace;
        const regTag = (regRace.name && regRace.name.includes('[')) ? regRace.name.split('[')[1].replace(']', '').trim() : `${regRace.distance} км`;
        const dObjReg = new Date(regRace.date);
        const dShortReg = !isNaN(dObjReg.getTime()) ? dObjReg.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).toUpperCase() : '';
        const thumbReg = g.posterUrl
          ? `<img src="${g.posterUrl}" alt="">`
          : `<span style="font-size:10px; font-weight:900;">${dShortReg}</span>`;

        return `
          <div class="sreg-race-row is-already-reg">
            <div style="width:22px; text-align:center; color:var(--sotka-green); font-weight:900;">${ICONS.check}</div>
            <div class="sreg-thumb" onclick="window.sotkaHub.openRaceHubModal('${regRace.id}')" style="cursor:pointer;">${thumbReg}</div>
            <div style="min-width:0;">
              <div style="font-family:'Unbounded',sans-serif; font-size:13px; font-weight:900; text-transform:uppercase; cursor:pointer;" onclick="window.sotkaHub.openRaceHubModal('${regRace.id}')">${this.escapeHTML(g.baseName)}</div>
              <div style="font-family:'Roboto Mono',monospace; font-size:11px; color:var(--text-muted); margin-top:2px;">
                ${dShortReg} • Дистанция: <b style="color:#111;">${this.escapeHTML(regTag)}</b> • Зачёт: <b style="color:#111;">${this.escapeHTML(g.existingReg.final_cluster || 'Абсолют')}</b>
              </div>
            </div>
            <div class="sreg-controls-group">
              <span style="background:rgba(16,185,129,0.14); color:var(--sotka-green); font-family:'Unbounded',sans-serif; font-size:9px; font-weight:900; padding:6px 12px; border-radius:10px;">УЖЕ В СТАРТ-ЛИСТЕ${g.existingReg.bib ? ` • BIB №${g.existingReg.bib}` : ''}</span>
            </div>
            <div>
              <button type="button" class="ctrl-btn" style="color:var(--pin-red); border-color:rgba(230,0,35,0.25); height:32px;" onclick="window.sotkaHub.revokeSuperRegItem('${regRace.id}', '${g.existingReg.id}')">Отозвать</button>
            </div>
          </div>
        `;
      }

      if (st.checked) {
        selectedCount++;
        totalFeeWatts += (Number(activeRace.price) || 0);
      }

      const dObj = new Date(activeRace.date);
      const dShort = !isNaN(dObj.getTime()) ? dObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).toUpperCase() : 'СКОРО';
      const tShort = !isNaN(dObj.getTime()) ? dObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '--:--';
      const surfLbl = surfaceLabels[activeRace.surface] || 'ВЕЛОГОНКА';
      const priceNum = Number(activeRace.price) || 0;
      const priceBadge = priceNum > 0 ? `${priceNum} W` : '0 W (Бесплатно)';
      const totalEventRiders = g.sisters.reduce((acc, sr) => acc + (this.rosterCounts[sr.id] || 0), 0);

      const thumbHtml = g.posterUrl
        ? `<img src="${g.posterUrl}" alt="">`
        : `<span style="font-size:10px; font-weight:900; text-align:center; line-height:1.1;">${dShort}</span>`;

      let distControlHtml = '';
      if (g.sisters.length > 1) {
        const distOpts = g.sisters.map(sr => {
          const tag = (sr.name && sr.name.includes('[')) ? sr.name.split('[')[1].replace(']', '').trim() : `${sr.distance || 0} км`;
          const sel = (sr.id === activeRace.id) ? ' selected' : '';
          return `<option value="${sr.id}"${sel}>${this.escapeHTML(tag)} (${sr.distance || 0} км)</option>`;
        }).join('');
        distControlHtml = `<select class="sreg-select" onchange="window.sotkaHub.onSuperRegChangeDist('${g.key}', this.value)">${distOpts}</select>`;
      } else {
        distControlHtml = `<span style="font-family:'Roboto Mono',monospace; font-size:11.5px; font-weight:800; padding:0 8px; color:#111;">${activeRace.distance || 0} КМ</span>`;
      }

      let gearControlHtml = '';
      if (gears.length > 1) {
        const gearOpts = gears.map(gk => {
          const cleanK = String(gk).toUpperCase();
          const lbl = gearLabels[cleanK] || cleanK;
          const sel = (cleanK === String(st.gear).toUpperCase()) ? ' selected' : '';
          return `<option value="${cleanK}"${sel}>Велосипед: ${this.escapeHTML(lbl)}</option>`;
        }).join('');
        gearControlHtml = `<select class="sreg-select" onchange="window.sotkaHub.onSuperRegChangeGear('${g.key}', this.value)">${gearOpts}</select>`;
      }

      const catControlHtml = canManageOthers
        ? `<input type="text" class="sreg-cat-input" value="${this.escapeHTML(st.category)}" title="Категория зачёта" oninput="window.sotkaHub.onSuperRegChangeCat('${g.key}', this.value)">`
        : `<span style="font-family:'Roboto Mono',monospace; font-size:11px; font-weight:800; background:var(--bg-subtle); padding:6px 10px; border-radius:10px; color:#111;">${this.escapeHTML(st.category)}</span>`;

      return `
        <div class="sreg-race-row${st.checked ? ' is-selected' : ''}">
          <input type="checkbox" class="sreg-check-input" ${st.checked ? 'checked' : ''} onchange="window.sotkaHub.onSuperRegToggleRow('${g.key}', this.checked)">
          <div class="sreg-thumb" onclick="window.sotkaHub.openRaceHubModal('${activeRace.id}')" style="cursor:pointer;">${thumbHtml}</div>
          <div style="min-width:0;">
            <div style="font-family:'Unbounded',sans-serif; font-size:13px; font-weight:900; text-transform:uppercase; cursor:pointer; line-height:1.2;" onclick="window.sotkaHub.openRaceHubModal('${activeRace.id}')">
              ${this.escapeHTML(g.baseName)}
            </div>
            <div style="font-family:'Roboto Mono',monospace; font-size:11px; color:var(--text-muted); margin-top:3px;">
              ${dShort} в ${tShort} • ${surfLbl} • ${totalEventRiders} уч.
            </div>
          </div>
          <div class="sreg-controls-group">
            ${distControlHtml}
            ${gearControlHtml}
            ${catControlHtml}
          </div>
          <div style="font-family:'Roboto Mono',monospace; font-size:12px; font-weight:900; text-align:right; white-space:nowrap;">
            ${priceBadge}
          </div>
        </div>
      `;
    }).join('');

    wrap.innerHTML = `
      <div class="sreg-card-shell">
        <div class="sreg-top-header">
          <div style="display:flex; align-items:center; gap:12px;">
            <button type="button" class="pin-back-btn-inline" style="position:static; width:40px !important; height:40px !important;" onclick="window.sotkaHub.closeInlinePin()" title="Назад к доске">
              ${MIN_SVG.arrowLeft}
            </button>
            <div>
              <div style="font-family:'Roboto Mono',monospace; font-size:10px; font-weight:800; color:#d97706; text-transform:uppercase;">ПАКЕТНАЯ РЕГИСТРАЦИЯ В 1 КЛИК</div>
              <h1 style="font-family:'Unbounded',sans-serif; font-size:18px; font-weight:900; margin:2px 0 0; text-transform:uppercase; display:inline-flex; align-items:center; gap:8px;">
                ${ICONS.bolt} <span>СУПЕР-ЗАЯВКА НА ОТКРЫТЫЕ СТАРТЫ (${groups.length})</span>
              </h1>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <button type="button" class="ctrl-btn" style="height:34px; padding:0 12px;" onclick="window.sotkaHub.toggleAllSuperRegChecks(true)">Выбрать все</button>
            <button type="button" class="ctrl-btn" style="height:34px; padding:0 12px;" onclick="window.sotkaHub.toggleAllSuperRegChecks(false)">Снять выбор</button>
          </div>
        </div>

        ${adminBarHtml}

        <div class="sreg-list-body">
          ${rowsHtml || '<div style="padding:40px; text-align:center; color:var(--text-muted); font-family:\'Unbounded\',sans-serif; font-size:12px;">СЕЙЧАС НЕТ ОТКРЫТЫХ РЕГИСТРАЦИЙ</div>'}
        </div>

        <div class="sreg-footer-dock">
          <div>
            <div style="font-family:'Unbounded',sans-serif; font-size:12px; font-weight:900;">
              ВЫБРАНО СТАРТОВ ДЛЯ ЗАЯВКИ: <span style="color:#d97706;">${selectedCount}</span>
            </div>
            <div style="font-family:'Roboto Mono',monospace; font-size:11px; color:var(--text-muted); margin-top:2px;">
              Сумма стартовых взносов: <b>${totalFeeWatts} W</b> • Доступно в кошельке: <b>${this.walletBalance} W</b>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            ${totalFeeWatts > 0 ? `
              <button type="button" class="pin-cta-btn is-dark" style="height:44px; padding:0 20px; font-size:12.5px; ${selectedCount === 0 ? 'opacity:0.5; pointer-events:none;' : ''}" onclick="window.sotkaHub.submitSuperRegBatch(false)">
                <span>Заявить без оплаты (${selectedCount})</span>
              </button>
              <button type="button" class="pin-cta-btn" style="height:44px; padding:0 22px; font-size:13px; background:var(--sotka-gold); color:#111; ${selectedCount === 0 ? 'opacity:0.5; pointer-events:none;' : ''}" onclick="window.sotkaHub.submitSuperRegBatch(true)">
                ${ICONS.bolt} <span>Заявить и оплатить (${totalFeeWatts} W)</span>
              </button>
            ` : `
              <button type="button" class="pin-cta-btn" style="height:44px; padding:0 24px; font-size:13px; ${selectedCount === 0 ? 'opacity:0.5; pointer-events:none;' : ''}" onclick="window.sotkaHub.submitSuperRegBatch(false)">
                ${ICONS.bolt} <span>ПОДАТЬ СУПЕР-ЗАЯВКУ (${selectedCount} СТАРТ.)</span>
              </button>
            `}
          </div>
        </div>
      </div>
    `;
  }

  extractRaceGears(r) {
    if (!r) return [];
    try {
      const cl = typeof r.cat_logic === 'string' ? JSON.parse(r.cat_logic) : (r.cat_logic || {});
      if (cl && cl.use_gear && Array.isArray(cl.active_gears) && cl.active_gears.length > 0) {
        return cl.active_gears;
      }
    } catch (e) {}
    if (r.name && r.name.includes('[')) {
      const tag = r.name.split('[')[1].replace(']', '').trim();
      const parts = tag.split(/[\/,•|\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
      const known = ['CX', 'MTB', 'GRAVEL', 'GRVL', 'FIX', 'ROAD', 'TT', 'FAT', 'SS', 'EBIKE'];
      const found = parts.filter(p => known.includes(p));
      if (found.length > 0) return found;
    }
    return [];
  }

  onSuperRegToggleRow(groupKey, isChecked) {
    if (!this._superRegState || !this._superRegState[groupKey]) return;
    this._superRegState[groupKey].checked = Boolean(isChecked);
    this.renderSuperRegPinContent();
  }

  toggleAllSuperRegChecks(checkState) {
    const groups = this.getOpenRegistrationEvents();
    groups.forEach(g => {
      if (this._superRegState && this._superRegState[g.key]) {
        this._superRegState[g.key].checked = Boolean(checkState);
      }
    });
    this.renderSuperRegPinContent();
  }

  onSuperRegChangeDist(groupKey, newRaceId) {
    const st = this._superRegState && this._superRegState[groupKey];
    const r = this.racesById[newRaceId];
    if (!st || !r) return;
    st.raceId = newRaceId;
    st.checked = true;
    const gears = this.extractRaceGears(r);
    st.gear = gears[0] || '';
    st.category = this.computeSuperRegCategory(this._superRegTargetRider || this.currentRider, r, st.gear);
    this.renderSuperRegPinContent();
  }

  onSuperRegChangeGear(groupKey, newGear) {
    const st = this._superRegState && this._superRegState[groupKey];
    if (!st) return;
    const r = this.racesById[st.raceId];
    st.gear = newGear;
    st.checked = true;
    st.category = this.computeSuperRegCategory(this._superRegTargetRider || this.currentRider, r, newGear);
    this.renderSuperRegPinContent();
  }

  onSuperRegChangeCat(groupKey, manualCat) {
    const st = this._superRegState && this._superRegState[groupKey];
    if (!st) return;
    st.category = manualCat;
  }

  async filterSuperRegRiderDropdown(query) {
    const dd = document.getElementById('sregRiderDropdown');
    if (!dd) return;
    await this.ensureAllRidersLoaded();

    const q = String(query || '').toLowerCase().replace(/ё/g, 'е').trim();
    const allRiders = Object.values(this.ridersMap || {}).filter(r => r && r.email !== 'bot@sotka.one' && !(r.email && r.email.indexOf('guest_') === 0));
    const myTeams = Array.isArray(this.currentRider?.team_id) ? this.currentRider.team_id : (this.currentRider?.team_id ? [this.currentRider.team_id] : []);

    const filtered = allRiders.filter(r => {
      if (!q) return true;
      const full = `${r.last_name || ''} ${r.first_name || ''}`.toLowerCase().replace(/ё/g, 'е');
      const tIds = Array.isArray(r.team_id) ? r.team_id : (r.team_id ? [r.team_id] : []);
      const tNames = tIds.map(id => this.teamsMap[id] ? this.teamsMap[id].name.toLowerCase() : '').join(' ');
      return full.includes(q) || tNames.includes(q);
    });

    filtered.sort((a, b) => {
      const aTeams = Array.isArray(a.team_id) ? a.team_id : (a.team_id ? [a.team_id] : []);
      const bTeams = Array.isArray(b.team_id) ? b.team_id : (b.team_id ? [b.team_id] : []);
      const aMate = myTeams.some(id => aTeams.includes(id)) ? 1 : 0;
      const bMate = myTeams.some(id => bTeams.includes(id)) ? 1 : 0;
      if (aMate !== bMate) return bMate - aMate;
      return String(a.last_name || '').localeCompare(String(b.last_name || ''), 'ru');
    });

    const slice = filtered.slice(0, 30);
    if (slice.length === 0) {
      dd.innerHTML = `
        <div style="padding:12px; text-align:center; font-size:12px; color:var(--text-muted);">Спортсмен не найден в базе</div>
        <button type="button" class="ctrl-btn primary" style="height:36px; width:100%;" onclick="window.sotkaHub.openSuperRegQuickNewRiderModal('${this.escapeHTML(query)}')">+ Создать карточку «${this.escapeHTML(query)}»</button>
      `;
    } else {
      dd.innerHTML = slice.map(r => {
        const name = `${r.last_name || ''} ${r.first_name || ''}`.trim();
        const tIds = Array.isArray(r.team_id) ? r.team_id : (r.team_id ? [r.team_id] : []);
        const tName = (tIds[0] && this.teamsMap[tIds[0]]) ? this.teamsMap[tIds[0]].name : 'ONE TEAM';
        return `
          <div class="sreg-rider-option" onclick="window.sotkaHub.selectSuperRegRider('${r.id}')">
            <div>
              <div style="font-weight:800; color:#111;">${this.escapeHTML(name)}</div>
              <div style="font-size:11px; color:var(--text-muted); font-family:'Roboto Mono',monospace;">${this.escapeHTML(tName)}${r.yob ? ` • ${r.yob}` : ''}</div>
            </div>
            <span style="font-family:'Roboto Mono',monospace; font-size:11px; font-weight:900; background:var(--bg-subtle); padding:3px 8px; border-radius:6px;">Кластер ${this.escapeHTML(r.base_cluster || 'B')}</span>
          </div>
        `;
      }).join('');
    }

    dd.classList.add('open');

    if (!this._sregDocClickBound) {
      this._sregDocClickBound = true;
      document.addEventListener('click', e => {
        const drop = document.getElementById('sregRiderDropdown');
        const inp = document.getElementById('sregRiderSearchInput');
        if (drop && inp && !drop.contains(e.target) && !inp.contains(e.target)) {
          drop.classList.remove('open');
        }
      });
    }
  }

  selectSuperRegRider(riderId) {
    const r = (riderId === this.currentRider?.id) ? this.currentRider : (this.ridersMap && this.ridersMap[riderId]);
    if (!r) return;
    this._superRegTargetRider = r;
    const drop = document.getElementById('sregRiderDropdown');
    if (drop) drop.classList.remove('open');
    this.renderSuperRegPinContent();
  }

  openSuperRegQuickNewRiderModal(prefill = '') {
    const parts = String(prefill || '').trim().split(/\s+/);
    const last = parts[0] || '';
    const first = parts.slice(1).join(' ') || '';

    const modal = document.getElementById('hubQrModal');
    const box = document.getElementById('hubQrModalContent');
    box.className = 'hub-modal-card';

    const teamsList = Object.values(this.teamsMap || {}).sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ru'));

    box.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-family:'Unbounded',sans-serif; font-size:13px; font-weight:900;">+ НОВЫЙ СПОРТСМЕН В БАЗУ</span>
        <button type="button" class="pin-icon-round" style="width:28px; height:28px;" onclick="document.getElementById('hubQrModal').style.display='none'">${MIN_SVG.closeX}</button>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        <div><label class="hub-lbl">Фамилия *</label><input type="text" id="srNewLn" class="hub-input" value="${this.escapeHTML(last)}" placeholder="Иванов"></div>
        <div><label class="hub-lbl">Имя *</label><input type="text" id="srNewFn" class="hub-input" value="${this.escapeHTML(first)}" placeholder="Иван"></div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
        <div><label class="hub-lbl">Год рожд. *</label><input type="number" id="srNewYob" class="hub-input" placeholder="1990"></div>
        <div><label class="hub-lbl">Пол</label><select id="srNewGender" class="hub-input"><option value="M">Муж (М)</option><option value="F">Жен (Ж)</option></select></div>
        <div><label class="hub-lbl">Кластер</label><select id="srNewCluster" class="hub-input"><option value="B">B</option><option value="A+">A+</option><option value="A">A</option><option value="C">C</option><option value="D">D</option><option value="E">E</option><option value="O">O</option></select></div>
      </div>
      <div>
        <label class="hub-lbl">Команда / Клуб</label>
        <select id="srNewTeam" class="hub-input">
          <option value="">Без команды (ONE TEAM)</option>
          ${teamsList.map(t => `<option value="${t.id}">${this.escapeHTML(t.name)}</option>`).join('')}
        </select>
      </div>
      <button type="button" class="ctrl-btn primary" style="height:44px; width:100%; font-size:10px;" onclick="window.sotkaHub.submitSuperRegQuickNewRider()">СОЗДАТЬ И ВЫБРАТЬ ДЛЯ СУПЕР-ЗАЯВКИ</button>
    `;

    modal.style.display = 'flex';
  }

  async submitSuperRegQuickNewRider() {
    const ln = (document.getElementById('srNewLn')?.value || '').trim();
    const fn = (document.getElementById('srNewFn')?.value || '').trim();
    const yob = parseInt(document.getElementById('srNewYob')?.value, 10);
    const gender = document.getElementById('srNewGender')?.value || 'M';
    const cluster = document.getElementById('srNewCluster')?.value || 'B';
    const teamId = document.getElementById('srNewTeam')?.value || '';

    if (!ln || !fn || isNaN(yob) || String(yob).length !== 4) {
      return alert('Заполните Фамилию, Имя и 4-значный год рождения');
    }

    try {
      const created = await this.pb.collection('riders').create({
        first_name: fn,
        last_name: ln,
        yob,
        gender,
        base_cluster: cluster,
        team_id: teamId ? [teamId] : [],
        email: `rider_${Date.now()}@sotka.one`,
        rating: 0
      }, { requestKey: null });

      if (!this.ridersMap) this.ridersMap = {};
      this.ridersMap[created.id] = created;
      this._superRegTargetRider = created;

      document.getElementById('hubQrModal').style.display = 'none';
      this.showToast(`Создан профиль: ${fn} ${ln}`);
      this.renderSuperRegPinContent();
    } catch (e) {
      alert('Ошибка создания спортсмена: ' + e.message);
    }
  }

  async revokeSuperRegItem(raceId, rosterId) {
    if (!confirm('Отозвать заявку на этот старт?')) return;
    try {
      await this.pb.collection('race_rosters').delete(rosterId, { requestKey: null });
      this.rosters = (this.rosters || []).filter(r => r.id !== rosterId);
      if (this.myRostersMap[raceId] && this.myRostersMap[raceId].id === rosterId) {
        delete this.myRostersMap[raceId];
      }
      this.rosterCounts[raceId] = Math.max(0, (this.rosterCounts[raceId] || 1) - 1);
      this.showToast('Заявка отозвана');
      this.renderSuperRegPinContent();
    } catch (e) {
      alert('Ошибка отмены: ' + e.message);
    }
  }

  async submitSuperRegBatch(withPayment) {
    const targetRider = this._superRegTargetRider || this.currentRider;
    if (!targetRider) return;

    const groups = this.getOpenRegistrationEvents();
    const toSubmit = [];
    let totalFee = 0;

    groups.forEach(g => {
      if (g.existingReg) return;
      const st = this._superRegState && this._superRegState[g.key];
      if (st && st.checked) {
        const race = this.racesById[st.raceId] || g.primaryRace;
        if (race) {
          toSubmit.push({
            race,
            category: st.category || this.computeSuperRegCategory(targetRider, race, st.gear)
          });
          totalFee += (Number(race.price) || 0);
        }
      }
    });

    if (toSubmit.length === 0) {
      return alert('Отметьте галочками хотя бы один старт');
    }

    const rFullName = `${targetRider.first_name || ''} ${targetRider.last_name || ''}`.trim();

    if (withPayment && totalFee > 0) {
      if (!confirm(`Списать ${totalFee} Ватт со счёта Драфт и заявить ${rFullName} сразу на ${toSubmit.length} старт(ов)?`)) {
        return;
      }
      try {
        const payRes = await this.pb.send('/api/draft/pay', {
          method: 'POST',
          body: {
            amount: totalFee,
            purpose: `[RACE_FEE] Супер-заявка (${toSubmit.length} старт.) за ${rFullName}`,
            race_id: toSubmit[0].race.id
          }
        });
        if (!payRes || !payRes.success) throw new Error('Оплата не прошла');
        this.walletBalance = Math.max(0, this.walletBalance - totalFee);
      } catch (payErr) {
        if (confirm(`Недостаточно Ватт на балансе (${totalFee} W). Пополнить счёт через Т-Банк?`)) {
          this.promptTopup();
        }
        return;
      }
    }

    try {
      const createPromises = toSubmit.map(item => {
        const r = item.race;
        const isTT = (r.format === 'itt' || r.format === 'ttt' || r.format === 'relay' || String(r.name || '').toUpperCase().includes('DTT'));
        let autoStart = '';
        if (!isTT && r.date) {
          const d = new Date(r.date);
          if (!isNaN(d.getTime())) {
            autoStart = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:00`;
          }
        }
        const isFreeOrPaid = Boolean(withPayment || !(Number(r.price) > 0));

        return this.pb.collection('race_rosters').create({
          race_id: r.id,
          rider_id: targetRider.id,
          status: 'registered',
          is_paid: isFreeOrPaid,
          planned_start: autoStart,
          final_cluster: item.category
        }, { requestKey: null });
      });

      const createdRecords = await Promise.all(createPromises);

      createdRecords.forEach(rec => {
        this.rosters.push(rec);
        this.rosterCounts[rec.race_id] = (this.rosterCounts[rec.race_id] || 0) + 1;
        if (targetRider.id === this.currentRider?.id) {
          this.myRostersMap[rec.race_id] = rec;
        }
      });

      this.buildPinsStream();
      this.renderGrid();
      this.renderSuperRegPinContent();
      this.showToast(`Успешно подано заявок: ${createdRecords.length} (${rFullName})`);
    } catch (err) {
      alert('Ошибка при пакетной записи: ' + err.message);
    }
  }

  // Проверка, что карточка в riders «сиротская» (создана судьёй или гостем и ещё не привязана к аккаунту)
  isUnclaimedRiderProfile(r) {
    if (!r) return false;
    if (r.user_id && String(r.user_id).trim() !== '') return false;
    const em = String(r.email || '').trim().toLowerCase();
    if (!em) return true;
    return em.startsWith('guest_') || em.startsWith('rider_') || em.endsWith('@sotka.one') || em.endsWith('@vilka.local');
  }

  onExpressNameInput() {
    const ln = (document.getElementById('hubRegLastName')?.value || '').trim().toLowerCase().replace(/ё/g, 'е');
    const fn = (document.getElementById('hubRegFirstName')?.value || '').trim().toLowerCase().replace(/ё/g, 'е');
    const box = document.getElementById('hubRegClaimMatchBox');
    if (!box) return;

    // Если человек изменил ФИО вручную — сбрасываем выбранный чужой ID
    if (this._claimedExistingRiderId) {
      const claimed = this.ridersMap?.[this._claimedExistingRiderId];
      if (!claimed || String(claimed.last_name || '').toLowerCase().replace(/ё/g, 'е') !== ln) {
        this._claimedExistingRiderId = null;
      }
    }

    if (ln.length < 2) {
      box.style.display = 'none';
      box.innerHTML = '';
      return;
    }

    const riders = Object.values(this.ridersMap || {});
    // Показываем ТОЛЬКО непривязанные (сиротские) профили без user_id, не показывая год рождения!
    const matches = riders.filter(r => {
      if (!r || !r.last_name || !this.isUnclaimedRiderProfile(r)) return false;
      const rLn = String(r.last_name).toLowerCase().replace(/ё/g, 'е');
      const rFn = String(r.first_name || '').toLowerCase().replace(/ё/g, 'е');
      if (!rLn.startsWith(ln)) return false;
      if (fn && !rFn.startsWith(fn)) return false;
      return true;
    }).slice(0, 3);

    if (matches.length === 0) {
      box.style.display = 'none';
      box.innerHTML = '';
      return;
    }

    box.style.display = 'flex';
    box.style.flexDirection = 'column';
    box.style.gap = '6px';
    box.innerHTML = `
      <div style="font-family:'Roboto Mono',monospace; font-size:9.5px; font-weight:800; color:#b45309;">УЖЕ УЧАСТВОВАЛИ В ГОНКАХ? ВЫБЕРИТЕ СВОЮ КАРТОЧКУ И ПОДТВЕРДИТЕ ГОД РОЖДЕНИЯ:</div>
      ${matches.map(r => {
        const tIds = Array.isArray(r.team_id) ? r.team_id : (r.team_id ? [r.team_id] : []);
        const tName = (tIds[0] && this.teamsMap[tIds[0]]?.name) ? this.teamsMap[tIds[0]].name : 'ONE TEAM';
        const isSelected = this._claimedExistingRiderId === r.id;
        return `
          <div onclick="window.sotkaHub.claimExistingRiderForExpress('${r.id}')" style="padding:8px 10px; border-radius:10px; background:${isSelected ? '#111' : '#fffdf2'}; color:${isSelected ? '#fff' : '#111'}; border:1.5px solid var(--sotka-gold); cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700;">
            <span>${this.escapeHTML(r.last_name)} ${this.escapeHTML(r.first_name)}</span>
            <span style="font-family:'Roboto Mono',monospace; font-size:10px; color:${isSelected ? 'var(--sotka-gold)' : '#b45309'};">${this.escapeHTML(tName)} • Кл. ${this.escapeHTML(r.base_cluster || 'B')}</span>
          </div>
        `;
      }).join('')}
    `;
  }

  claimExistingRiderForExpress(riderId) {
    const r = this.ridersMap?.[riderId];
    if (!r || !this.isUnclaimedRiderProfile(r)) return;
    this._claimedExistingRiderId = r.id;

    const lnEl = document.getElementById('hubRegLastName');
    const fnEl = document.getElementById('hubRegFirstName');
    const yobEl = document.getElementById('hubRegYob');
    const genEl = document.getElementById('hubRegGender');
    const teamEl = document.getElementById('hubRegTeam');

    if (lnEl) lnEl.value = r.last_name || '';
    if (fnEl) fnEl.value = r.first_name || '';
    // НЕ подставляем год рождения автоматически — пользователь обязан подтвердить его вручную!
    if (yobEl) {
      yobEl.value = '';
      yobEl.placeholder = 'Подтвердите ваш год рожд.';
    }
    if (genEl && r.gender) genEl.value = (r.gender === 'F' || r.gender === 'Ж') ? 'F' : 'M';

    const tIds = Array.isArray(r.team_id) ? r.team_id : (r.team_id ? [r.team_id] : []);
    if (teamEl && tIds[0]) teamEl.value = tIds[0];

    this.onExpressNameInput();
    this.showToast(`Введите ваш год рождения для подтверждения профиля ${r.first_name} ${r.last_name}`);
    yobEl?.focus();
  }

  async submitExpressRegistration() {
    const ln = (document.getElementById('hubRegLastName')?.value || '').trim();
    const fn = (document.getElementById('hubRegFirstName')?.value || '').trim();
    const yob = parseInt(document.getElementById('hubRegYob')?.value, 10);
    const gender = document.getElementById('hubRegGender')?.value || 'M';
    const teamId = document.getElementById('hubRegTeam')?.value || '';
    const email = (document.getElementById('hubRegEmail')?.value || '').trim().toLowerCase();
    const pin = (document.getElementById('hubRegPin')?.value || '').trim();
    const chosenGear = document.getElementById('hubRegRaceGear')?.value || null;
    const targetRaceId = document.getElementById('hubRegRaceDist')?.value || this._authPendingRaceId;

    if (!ln || !fn) return alert('Введите Фамилию и Имя');
    if (isNaN(yob) || String(yob).length !== 4) return alert('Введите год рождения (4 цифры, например 1990)');
    if (!email || !email.includes('@')) return alert('Введите корректный Email');
    if (pin.length !== 4 || !/^\d{4}$/.test(pin)) return alert('ПИН-код должен состоять ровно из 4 цифр');

    // Если выбрана существующая карточка из базы — проверяем, что она свободна и год рождения совпадает
    if (this._claimedExistingRiderId) {
      const targetClaim = await this.pb.collection('riders').getOne(this._claimedExistingRiderId, { requestKey: null }).catch(() => null);
      if (!targetClaim || !this.isUnclaimedRiderProfile(targetClaim)) {
        this._claimedExistingRiderId = null;
        return alert('Этот профиль уже закреплён за другим аккаунтом. Используйте вкладку «Вход по ПИН-коду».');
      }
      if (targetClaim.yob && Number(targetClaim.yob) !== yob) {
        return alert('Год рождения не совпадает с данными выбранного профиля в базе!');
      }
    }

    const btn = document.getElementById('hubBtnSubmitExpress');
    if (btn) { btn.innerText = 'РЕГИСТРАЦИЯ...'; btn.disabled = true; }

    const securePassword = `VILKA_PIN_${pin}_SECURE`;

    try {
      // 1. Создаём НОВОГО пользователя в users (если email уже занят — НЕ перезаписываем чужие профили!)
      let isNewUserCreated = false;
      try {
        await this.pb.collection('users').create({
          email,
          emailVisibility: true,
          password: securePassword,
          passwordConfirm: securePassword,
          name: `${fn} ${ln}`.trim(),
          role: ['rider']
        }, { requestKey: null });
        isNewUserCreated = true;
      } catch (createUserErr) {
        isNewUserCreated = false;
      }

      await this.pb.collection('users').authWithPassword(email, securePassword);
      localStorage.setItem('vilka_saved_email', email);

      const authModel = this.pb.authStore.model || this.pb.authStore.record;
      const uid = authModel?.id;
      if (authModel && authModel.role) {
        this.userRoles = Array.isArray(authModel.role) ? authModel.role : [authModel.role];
      }

      // 2. Сначала проверяем, нет ли уже у этого аккаунта (uid / email) своего собственного профиля в riders!
      let ownExistingRider = await this.pb.collection('riders').getFirstListItem(
        `user_id="${uid}" || email="${email}"`,
        { requestKey: null }
      ).catch(() => null);

      let rider = null;

      if (ownExistingRider) {
        // Если у этого Email уже есть свой профиль (например, Дмитрий Михнович) — категорически запрещаем привязывать к нему чужую карточку!
        const ownLn = String(ownExistingRider.last_name || '').trim().toLowerCase().replace(/ё/g, 'е');
        const inputLn = ln.toLowerCase().replace(/ё/g, 'е');
        if (ownLn && ownLn !== inputLn) {
          this.pb.authStore.clear();
          if (btn) {
            btn.innerText = targetRaceId ? 'СОЗДАТЬ ПРОФИЛЬ И ЗАЯВИТЬСЯ НА СТАРТ' : 'СОЗДАТЬ ПРОФИЛЬ IDUCK';
            btn.disabled = false;
          }
          return alert(`Email ${email} уже привязан к профилю «${ownExistingRider.first_name} ${ownExistingRider.last_name}».\n\nДля нового спортсмена укажите его собственный Email.`);
        }
        rider = ownExistingRider;
      } else if (this._claimedExistingRiderId && isNewUserCreated) {
        // Привязываем свободную карточку ТОЛЬКО если у неё нет user_id и год рождения подтверждён
        rider = await this.pb.collection('riders').update(this._claimedExistingRiderId, {
          user_id: uid,
          email,
          first_name: fn,
          last_name: ln,
          yob,
          gender,
          team_id: teamId ? [teamId] : []
        }, { requestKey: null }).catch(() => null);
      }

      if (!rider) {
        rider = await this.pb.collection('riders').create({
          user_id: uid,
          email,
          first_name: fn,
          last_name: ln,
          yob,
          gender,
          base_cluster: 'O',
          team_id: teamId ? [teamId] : [],
          rating: 0
        }, { requestKey: null });
      }

      const isSotka = window.location.hostname.toLowerCase().endsWith('sotka.one');
      document.cookie = this.pb.authStore.exportToCookie({
        httpOnly: false,
        secure: window.location.protocol === 'https:',
        sameSite: 'Lax',

  }
  async submitPinLogin() {
    const email = (document.getElementById('hubLoginEmail')?.value || '').trim().toLowerCase();
    const pin = (document.getElementById('hubLoginPin')?.value || '').trim();
    const pendingRaceId = this._authPendingRaceId;

    if (!email || !email.includes('@')) return alert('Введите корректный Email');
    if (pin.length !== 4) return alert('ПИН-код состоит из 4 цифр');

    const btn = document.getElementById('hubBtnSubmitLogin');
    if (btn) { btn.innerText = 'АВТОРИЗАЦИЯ...'; btn.disabled = true; }

    const securePassword = `VILKA_PIN_${pin}_SECURE`;
    try {
      await this.pb.collection('users').authWithPassword(email, securePassword);
      localStorage.setItem('vilka_saved_email', email);

      const isSotka = window.location.hostname.toLowerCase().endsWith('sotka.one');
      document.cookie = this.pb.authStore.exportToCookie({
        httpOnly: false,
        secure: window.location.protocol === 'https:',
        sameSite: 'Lax',
        domain: isSotka ? 'sotka.one' : undefined,
        path: '/'
      }, 'pb_auth');

      const authModel = this.pb.authStore.model || this.pb.authStore.record;
      if (authModel && authModel.role) {

      }

      const uid = authModel?.id;
      const rider = await this.pb.collection('riders').getFirstListItem(`user_id="${uid}" || email="${email}"`, { requestKey: null });
      if (rider) {
        this.currentRider = rider;
        this.isGuest = false;
        localStorage.setItem('vilka_cached_rider', JSON.stringify(rider));
        if (isSotka) {
          document.cookie = `pb_rider=${encodeURIComponent(JSON.stringify(rider))}; path=/; domain=sotka.one; max-age=31536000; SameSite=Lax; Secure`;
        }
      }

      document.getElementById('hubQrModal').style.display = 'none';
      this.showToast(`Добро пожаловать, ${rider?.first_name || 'Атлет'}!`);

      await this.loadEcosystem();

      if (pendingRaceId && this.racesById[pendingRaceId]) {

  // ИНДИВИДУАЛЬНАЯ ЗАЯВКА НА ГОНКУ И УПРАВЛЕНИЕ ЗАЯВКОЙ
  // =====================================================================
 async handleRaceRegistration(raceId, chosenGear = null, forceDirect = false) {
    const r = this.racesById[raceId];
    if (!r) return;

    const baseName = r.name && r.name.includes('[') ? r.name.split('[')[0].trim() : r.name;
    const dayStr = r.date ? String(r.date).slice(0, 10) : '';
    const sisters = this.races.filter(sr => {
      const srBase = sr.name && sr.name.includes('[') ? sr.name.split('[')[0].trim() : sr.name;
      const srDay = sr.date ? String(sr.date).slice(0, 10) : '';
      return srBase.toLowerCase() === baseName.toLowerCase() && srDay === dayStr;
    });

    // Если гонка (или любая её дистанция) в LIVE или завершена — регистрация закрыта, сразу открываем протокол
    if (r.status === 'LIVE' || sisters.some(sr => sr.status === 'LIVE')) {
      return this.openVilkaProtocol(r.id);
    }
    if (r.status === 'Finished' || r.status === 'Завершена' || (sisters.length > 0 && sisters.every(sr => sr.status === 'Finished' || sr.status === 'Завершена'))) {
      return this.openVilkaProtocol(r.id);
    }
    if (r.status === 'Скоро' || r.status !== 'Registration') {
      return this.openRaceHubModal(raceId, 'briefing');
    }

    const existingReg = this.myRostersMap[raceId];
    if (existingReg) return this.openManageMyRegModal(r, existingReg);

    // Если уже заявлен на соседнюю дистанцию этого же старта — открываем управление заявкой
    if (!forceDirect && sisters.length > 1) {
      const sisterReg = sisters.map(sr => this.myRostersMap[sr.id]).find(Boolean);
      if (sisterReg) {
        const regRace = this.racesById[sisterReg.race_id] || r;
        return this.openManageMyRegModal(regRace, sisterReg);
      }
    }

    const gears = this.extractRaceGears(r);

    // 1. Сначала даём выбрать дистанцию и велосипед (и гостям, и авторизованным)
    if (!forceDirect && (sisters.length > 1 || gears.length > 1)) {
      return this.openDistanceGearSelectorModal(sisters.length ? sisters : [r]);
    }

    const selectedGear = chosenGear || gears[0] || '';

    // 2. Если пользователь гость — запускаем экспресс-заявку как в Вилке
    if (this.isGuest || !this.currentRider || this.currentRider.id === 'anonymous_guest') {
      this.openGuestRegistrationModal(r.id, selectedGear);
      return;
    }

    // 3. Штатная заявка для авторизованного атлета
    const finalCat = this.computeSuperRegCategory(this.currentRider, r, selectedGear);
    const isTT = r.format === 'itt' || r.format === 'ttt' || r.format === 'relay';
    let autoStart = '';
    if (!isTT && r.date) {
      const d = new Date(r.date);
      if (!isNaN(d.getTime())) {
        autoStart = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:00`;
      }
    }

    try {
      const created = await this.pb.collection('race_rosters').create({
        race_id: r.id,
        rider_id: this.currentRider.id,
        status: 'registered',
        is_paid: !(Number(r.price) > 0),
        planned_start: autoStart,
        final_cluster: finalCat
      }, { requestKey: null });

      this.rosters.push(created);
      this.myRostersMap[r.id] = created;
      this.rosterCounts[r.id] = (this.rosterCounts[r.id] || 0) + 1;
      this.showToast(`Вы заявлены: ${r.name}`);
      this.buildPinsStream();
      this.renderGrid();
      await this.openRaceHubModal(r.id, 'briefing');
    } catch (err) {
      alert('Ошибка заявки: ' + err.message);
    }
  }

  async ensureGuestSearchData() {
    if (this._guestDataLoaded) return;
    this._guestDataLoaded = true;
    try {
      const [allRiders, allTeams] = await Promise.all([
        (!this.ridersMap || Object.keys(this.ridersMap).length < 10)
          ? this.pb.collection('riders').getFullList({
              fields: 'id,first_name,last_name,email,team_id,base_cluster,gender,yob,rating,slug',
              requestKey: null
            })
          : Promise.resolve([]),
        (!this.teamsMap || Object.keys(this.teamsMap).length === 0)
          ? this.pb.collection('teams').getFullList({
              fields: 'id,name,peloton_id',
              requestKey: null
            })
          : Promise.resolve([])
      ]);

      if (!this.ridersMap) this.ridersMap = {};
      allRiders.forEach(r => { this.ridersMap[r.id] = r; });

      if (!this.teamsMap) this.teamsMap = {};
      allTeams.forEach(t => { this.teamsMap[t.id] = t; });
    } catch (e) {}
  }

  getRiderTeamName(r) {
    if (!r || !r.team_id) return 'ONE TEAM';
    const tIds = Array.isArray(r.team_id) ? r.team_id : [r.team_id];
    for (const id of tIds) {
      if (this.teamsMap?.[id]?.name) return this.teamsMap[id].name;
    }
    return 'ONE TEAM';
  }

  async searchGuestRider() {
    const lastName = (document.getElementById('guestInputLastName')?.value || '').trim();
    const firstName = (document.getElementById('guestInputFirstName')?.value || '').trim();
    const resultsContainer = document.getElementById('guestSearchResults');
    const newProfileBox = document.getElementById('guestNewProfileBox');

    if (!resultsContainer) return;
    resultsContainer.innerHTML = '';

    if (lastName.length < 2 && firstName.length < 2) {
      if (newProfileBox) newProfileBox.style.display = 'none';
      return;
    }

    // 1. Поиск в памяти
    let riders = Object.values(this.ridersMap || {}).filter(r => {
      if (!r || r.email === 'bot@sotka.one' || (r.email && r.email.startsWith('guest_'))) return false;
      const fn = (r.first_name || '').toLowerCase();
      const ln = (r.last_name || '').toLowerCase();
      const lq = lastName.toLowerCase();
      const fq = firstName.toLowerCase();

      if (lq && fq) {
        return (ln.includes(lq) && fn.includes(fq)) || (fn.includes(lq) && ln.includes(fq));
      }
      return (lq && (ln.includes(lq) || fn.includes(lq))) || (fq && (fn.includes(fq) || ln.includes(fq)));
    });

    // 2. Фолбэк-запрос к БД PocketBase, если в памяти не нашли
    if (riders.length === 0 && (lastName.length >= 3 || firstName.length >= 3)) {
      try {
        const searchQ = lastName || firstName;
        const dbRiders = await this.pb.collection('riders').getList(1, 5, {
          filter: `(first_name~"${searchQ}" || last_name~"${searchQ}") && email!~"guest_" && email!="bot@sotka.one"`,
          requestKey: 'guest_search_db'
        });
        if (!this.ridersMap) this.ridersMap = {};
        dbRiders.items.forEach(r => {
          this.ridersMap[r.id] = r;
        });
        riders = dbRiders.items;
      } catch (e) {}
    }

    if (riders.length > 0) {
      riders.slice(0, 4).forEach(r => {
        const teamName = this.getRiderTeamName(r);
        const el = document.createElement('div');
        el.style.cssText = 'background: var(--bg-subtle, #f4f4f5); border: 1px solid var(--border, #e4e4e7); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s;';
        el.onmouseover = () => { el.style.borderColor = 'var(--sotka-gold, #ffc107)'; };
        el.onmouseout = () => { el.style.borderColor = 'var(--border, #e4e4e7)'; };
        el.onclick = () => this.selectGuestRider(r.id);

        el.innerHTML = `
          <div>
            <div style="font-weight: 800; font-size: 13px; color: var(--text-main, #111);">${this.escapeHTML(r.first_name)} ${this.escapeHTML(r.last_name)}</div>
            <div style="font-size: 10px; color: var(--text-muted, #71717a);">${this.escapeHTML(teamName)}</div>
          </div>
          <span style="font-size: 10px; font-family: 'Unbounded', sans-serif; font-weight: 800; color: #d97706;">ЭТО Я ➔</span>
        `;
        resultsContainer.appendChild(el);
      });

      const orDivider = document.createElement('div');
      orDivider.style.cssText = 'text-align:center; font-size:10px; color:var(--text-muted, #71717a); padding:4px 0; margin-top: 4px;';
      orDivider.innerText = 'ИЛИ СОЗДАЙТЕ НОВУЮ КАРТОЧКУ:';
      resultsContainer.appendChild(orDivider);

      if (newProfileBox) newProfileBox.style.display = 'block';
    } else {
      if (newProfileBox && (lastName.length >= 2 || firstName.length >= 2)) {
        newProfileBox.style.display = 'block';
      }
    }
  }

  async submitGuestVerification() {
    const inputYob = (document.getElementById('guestVerifyYob')?.value || '').trim();
    const rider = this.guestRegContext?.selectedRider;

    if (!rider || !inputYob) return alert('Укажите год рождения!');

      return alert('❌ Год рождения не совпадает с данными в базе.\n\nПроверьте опечатки или войдите через основной аккаунт.');
    }

    this.currentRider = rider;
    localStorage.setItem('vilka_guest_id', rider.id);

    const raceId = this.guestRegContext.raceId;
    const race = this.racesById[raceId];
    let squadMax = parseInt(race?.squad_max);
    if (isNaN(squadMax) || squadMax < 1) squadMax = 1;
    const isTeamRace = race?.format === 'ttt' || race?.format === 'relay' || squadMax > 1;

    if (isTeamRace && !this.guestRegContext.squadId) {

      );

      await this.completeGuestRegistration(
        raceId,
        rider.id,
        this.guestRegContext.wave,
        this.guestRegContext.distanceId,
        this.guestRegContext.squadId,
        this.guestRegContext.squadName

  async submitNewGuestRegistration(event) {
    if (this.isSubmittingGuestReg) return;

    const btn = event?.currentTarget || document.querySelector('#guestNewProfileBox button');
    const originalBtnText = btn ? btn.innerHTML : 'СОЗДАТЬ И ЗАЯВИТЬСЯ';

    const rawLastName = (document.getElementById('guestInputLastName')?.value || '').trim();
    const rawFirstName = (document.getElementById('guestInputFirstName')?.value || '').trim();
    const yobInput = (document.getElementById('guestNewYob')?.value || '').trim();
    const gender = document.getElementById('guestNewGender')?.value || 'M';

    if (!rawLastName || !rawFirstName || !yobInput) {
      alert('Пожалуйста, заполните Имя, Фамилию и Год рождения.');
      return;
    }

    if (rawLastName.length < 2 || rawFirstName.length < 2) {
      alert('Имя и Фамилия должны содержать минимум 2 буквы.');
      return;
    }

    const nameRegex = /^[\p{L}\s'-]+$/u;
    if (!nameRegex.test(rawLastName) || !nameRegex.test(rawFirstName)) {
      alert('Имя и Фамилия могут содержать только буквы, дефисы и пробелы.');
      return;
    }

    const numYob = parseInt(yobInput, 10);
    const currentYear = new Date().getFullYear();
    if (isNaN(numYob) || numYob < 1920 || numYob > (currentYear - 4)) {
      alert('Введен некорректный год рождения.');
      return;
    }

    const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : '';
    const lastName = rawLastName.replace(/\s+/g, ' ');
    const firstName = rawFirstName.replace(/\s+/g, ' ');
    const capLn = cap(lastName);
    const capFn = cap(firstName);

    this.isSubmittingGuestReg = true;
    if (btn) {
      btn.innerHTML = 'РЕГИСТРАЦИЯ...';
      btn.disabled = true;
      btn.style.opacity = '0.6';
      btn.style.pointerEvents = 'none';
    }

    try {
      let targetRider = null;
      const oneTeam = Object.values(this.teamsMap || {}).find(t => t.name && t.name.toUpperCase().includes('ONE TEAM'));
      const oneTeamId = oneTeam ? oneTeam.id : null;

      try {
        targetRider = await this.pb.collection('riders').create({
          first_name: capFn,
          last_name: capLn,
          yob: numYob,
          gender: gender,
          base_cluster: 'O',
          team_id: oneTeamId ? [oneTeamId] : [],
          email: `guest_${Date.now()}_${Math.random().toString(36).substring(2, 6)}@sotka.one`,
          rating: 0
        }, { requestKey: null });
      } catch (createErr) {
        targetRider = await this.pb.collection('riders').getFirstListItem(
          `first_name="${capFn}" && last_name="${capLn}" && yob=${numYob}`,
          { requestKey: null }
        );
      }

      if (!targetRider) {
        throw new Error('Не удалось получить профиль спортсмена.');
      }

      if (!this.ridersMap) this.ridersMap = {};
      this.ridersMap[targetRider.id] = targetRider;
      this.currentRider = targetRider;
      localStorage.setItem('vilka_guest_id', targetRider.id);

      const modal = document.getElementById('guestRegModal');
      if (modal) modal.style.display = 'none';

      const raceId = this.guestRegContext.raceId;
      const race = this.racesById[raceId];
      let squadMax = parseInt(race?.squad_max);
      if (isNaN(squadMax) || squadMax < 1) squadMax = 1;
      const isTeamRace = race?.format === 'ttt' || race?.format === 'relay' || squadMax > 1;

      if (isTeamRace && !this.guestRegContext.squadId) {
        this.openGuestSquadSelector(
          raceId,
          targetRider.id,
          this.guestRegContext.wave,
          this.guestRegContext.distanceId
        );
      } else {
        await this.completeGuestRegistration(
          raceId,
          targetRider.id,
          this.guestRegContext.wave,
          this.guestRegContext.distanceId,
          this.guestRegContext.squadId,
          this.guestRegContext.squadName
        );
      }
    } catch (e) {
      alert('Ошибка регистрации: ' + (e.message || 'Проверьте соединение'));
    } finally {
      this.isSubmittingGuestReg = false;
      if (btn) {
        btn.innerHTML = originalBtnText;
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
      }
    }
  }

  async openGuestSquadSelector(raceId, riderId, wave, distanceId) {

        this.pb.collection('race_rosters').getFullList({

      if (isNaN(sMax) || sMax < 1) sMax = (race?.format === 'ttt' || race?.format === 'relay') ? 4 : 2;

        if (r.squad_id) {

                <div>
                  <div style="font-size:12px; font-weight:800; color:var(--text-main, #111);">${this.escapeHTML(sq.squadName)} (${sq.count}/${sMax})</div>
                  <div style="font-size:10px; color:var(--text-muted, #71717a); margin-top:2px;">В составе: ${this.escapeHTML(sq.riderName)}</div>
                </div>
                <button type="button" style="background:var(--sotka-gold, #ffc107); color:#000; border:none; border-radius:6px; padding:6px 10px; font-family:'Unbounded', sans-serif; font-size:9px; font-weight:800; cursor:pointer;">
                  ВСТУПИТЬ
                </button>

      modal.innerHTML = `

          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">

  async completeGuestRegistration(raceId, riderId, wave = null, distanceId = null, squadId = null, squadName = null) {
    try {
      let race = this.racesById[raceId];
      if (!race && navigator.onLine) {
        try {
          race = await this.pb.collection('races').getOne(raceId, { requestKey: null });
          this.racesById[race.id] = race;
        } catch (err) {}
      }

      const targetRider = (this.ridersMap && this.ridersMap[riderId]) || this.currentRider;

      // Проверяем, не записан ли уже этот участник на старт
      const alreadyIn = (this.rosters || []).find(ro => ro.race_id === raceId && ro.rider_id === riderId && ro.status !== 'canceled');
      if (alreadyIn) {
        this.myRostersMap[raceId] = alreadyIn;
        this.showToast(`Вы уже в старт-листе: ${race?.name || 'Гонка'}`);
        this.buildPinsStream();
        this.renderGrid();
        await this.openRaceHubModal(raceId, 'briefing');
        return;
      }

      const isTimeTrial = race?.format === 'itt' || race?.format === 'ttt' || race?.format === 'relay' || (race?.name || '').toUpperCase().includes('DTT');
      let autoPlannedStart = '';
      if (!isTimeTrial && race?.date) {
        const rDate = new Date(race.date);
        if (!isNaN(rDate.getTime())) {
          const hh = String(rDate.getHours()).padStart(2, '0');
          const mm = String(rDate.getMinutes()).padStart(2, '0');
          const ss = String(rDate.getSeconds()).padStart(2, '0');
          autoPlannedStart = `${hh}:${mm}:${ss}`;
        }
      }

      const assignedCat = this.computeSuperRegCategory(targetRider, race, wave || '');

      const payload = {
        race_id: raceId,
        rider_id: riderId,
        status: 'registered',
        is_paid: !(Number(race?.price) > 0),
        planned_start: autoPlannedStart,
        final_cluster: assignedCat || wave || targetRider?.base_cluster || 'O'
      };

      if (distanceId) payload.distance_id = distanceId;

      if (squadId) {
        payload.squad_id = squadId;
        payload.squad_name = squadName;
        try {
          const squadMembers = await this.pb.collection('race_rosters').getFullList({
            filter: `race_id="${raceId}" && squad_id="${squadId}" && status!="canceled"`,
            requestKey: null
          });
          const lead = squadMembers.find(m => m.bib || m.planned_start);
          if (lead?.bib) payload.bib = lead.bib;
          if (lead?.planned_start) payload.planned_start = lead.planned_start;
        } catch (err) {}
      }

      const createdRoster = await this.pb.collection('race_rosters').create(payload, { requestKey: null });

      this.rosters.push(createdRoster);
      this.myRostersMap[raceId] = createdRoster;
      this.rosterCounts[raceId] = (this.rosterCounts[raceId] || 0) + 1;

      this.showToast(`Вы заявлены: ${race?.name || 'Гонка'}`);
      this.buildPinsStream();
      this.renderGrid();
      await this.openRaceHubModal(raceId, 'briefing');
    } catch (e) {
      alert('Ошибка записи в старт-лист: ' + e.message);
    }
  }

        method: 'POST',
        body: { amount: price, purpose: '[RACE_FEE] Взнос за старт', race_id: raceId, roster_id: rosterId }

      if (confirm('Недостаточно Ватт на балансе. Пополнить счёт через Т-Банк?')) {
        this.promptTopup();
      }

  async revokeMyReg(raceId, rosterId) {
    if (!confirm('Отозвать вашу заявку из старт-листа?')) return;
    try {
      await this.pb.collection('race_rosters').delete(rosterId, { requestKey: null });
      delete this.myRostersMap[raceId];
      this.rosters = (this.rosters || []).filter(r => r.id !== rosterId);
      this.rosterCounts[raceId] = Math.max(0, (this.rosterCounts[raceId] || 1) - 1);
      document.getElementById('hubQrModal').style.display = 'none';
      this.showToast('Заявка отозвана');
      this.buildPinsStream();
      this.renderGrid();
      if (this._modalRaceContext && this._modalRaceContext.activeRace.id === raceId) {
        this.renderRaceHubModalContent();
      }
    } catch (e) {
      alert('Ошибка отмены: ' + e.message);

// Определение владельца личного поддомена (например, timo.sotka.one)
  async resolveSubdomainOwner() {
    const host = window.location.hostname.toLowerCase();
    if (!host.endsWith('.sotka.one')) return;
    const sub = host.replace('.sotka.one', '').trim();
    const systemSubs = ['ru', 'vilka', 'www', 'db', 'api', 'pero', 'admin', 'dev'];
    if (!sub || systemSubs.includes(sub)) return;

    // 1. Проверяем, не поддомен ли это пелотона
    const matchedPeloton = (this.pelotonsList || []).find(p => String(p.slug || '').toLowerCase() === sub);
    if (matchedPeloton) {
      this.selectedPelotonId = matchedPeloton.id;
      this.buildPinsStream();
      this.renderGrid();
      return;
    }

    // 2. Ищем владельца личного домена в коллекции riders по полю slug
    try {
      const owner = await this.pb.collection('riders').getFirstListItem(`slug="${sub}"`, { requestKey: null });
      if (owner) {
        this.subdomainOwnerRider = owner;
        document.title = `${owner.first_name || ''} ${owner.last_name || ''} (${sub}.sotka.one) — СОТКА`;
        // Сохраняем заявки владельца поддомена отдельно, не перезаписывая личный myRostersMap гостя
        this.ownerRostersMap = {};
        (this.rosters || []).forEach(r => {
          if (r.race_id && r.rider_id === owner.id && r.status !== 'canceled') {
            this.ownerRostersMap[r.race_id] = r;
          }
        });
        this.buildPinsStream();
        this.renderGrid();
      }
    } catch (e) {}
  }
